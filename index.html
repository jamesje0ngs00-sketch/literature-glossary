const QUESTIONS = {"26수능":{"18":{"s":"윗글에 대한 이해로 적절하지 않은 것은?","c":["사슴이 호랑이에게 대책을 구하자 호랑이는 거드름을 부리며 다른 동물들에게 발언하게 하였다.","호랑이가 자라의 외양에 주목하여 관심을 보이자 자라는 호랑이보다 먼저 자신의 정체를 밝혔다.","자라는 자신을 해치려고 드는 호랑이에게 목을 내밀어 놀라게 한 후 도리랑귀신을 들먹이며 맞섰다.","호랑이가 쓸개를 주겠다며 놓아 달라는 것을 듣고 자라는 호랑이가 얼주검 상태가 되었다고 생각하였다.","호랑이는 남생이가 내다보는 것을 보고 자신이 매달려 애걸했던 자라가 자신을 쫓아왔다고 생각하였다."]},"19":{"s":"㉠～㉢에 대한 이해로 가장 적절한 것은?","c":["㉠은 공동의 문제를 해결하기 위한 모족의 노력이 나타나는 공간으로, 이곳에서 자라와 호랑이의 화해가 이루어진다.","㉡은 자라가 자신의 내력을 소개하며 언급한 공간으로, 자라는 호랑이와의 만남을 예상하고 이곳에서 이를 대비하였다.","㉢은 호랑이가 안도감을 나타내는 공간으로, 이곳에서 호랑이는 살아남은 것을 자신의 능력을 넘어서는 뜻밖의 행운이라고 여겼다.","㉠은 자라가 자신의 행위로 인해 위험에 빠지게 된 공간이며, ㉡은 자라가 위험에서 벗어나고자 언급한 공간이다.","㉠은 호랑이의 지위가 다른 존재의 발언을 통해 확인되는 공간이며, ㉢은 호랑이가 다른 존재와의 비교를 통해 자신의 위엄을 부정하는 공간이다."]},"20":{"s":"ⓐ～ⓕ에 대한 설명으로 가장 적절한 것은?","c":["ⓐ와 ⓑ는 각기 다른 주체가 예의를 갖춘 상대의 태도에 대해 보인 반응이다.","ⓑ와 ⓒ는 동일한 주체가 상대의 당황하는 모습에 대해 보인 반응이다.","ⓒ와 ⓕ는 각기 다른 주체가 상대의 말이나 행동으로 인해 생긴 위기 상황에서 보인 반응이다.","ⓓ와 ⓔ는 동일한 주체가 자신의 숙원이 성취될 수 있음을 확인하면서 보인 반응이다.","ⓔ와 ⓕ는 동일한 주체가 상대의 예상 밖 제안에 대해 보인 반응이다."]},"21":{"s":"다음에 제시된 선생님의 설명을 참고하여 윗글을 감상한 내용으로 적절하지 않은 것은?","c":["‘사냥개’에 대한 토끼의 평가에서, 현실에서 사냥개가 사람에게 길들여진 것을 우화 속 상황에 중첩함으로써 강자의 환심을 사 이익을 얻는 인간에 대한 비판이 드러남을 알 수 있군.","자라가 ‘동의보감’을 떠올린 데서, 현실의 의서를 우화 속 상황에 중첩함으로써 명약을 탐하는 속내를 지식을 내세워 숨기는 위선적 인간에 대한 비판이 드러남을 알 수 있군.","‘포수’에 대한 호랑이의 태도에서, 현실의 인간이 지닌 힘을 우화 속 인물들의 위계질서에 중첩함으로써 권력자가 상대에 대한 두려움을 보여 위신을 잃는 상황이 강조됨을 알 수 있군.","호랑이가 ‘선영’을 언급한 데서, 현실의 윤리를 우화 속 인물이 내세운 구실에 중첩함으로써 자손의 도리를 말하며 곤란한 처지를 벗어나려는 인물의 절박한 상황이 강조됨을 알 수 있군.","호랑이가 ‘해남’에서 ‘압록강 가’까지 뛴 데서, 현실의 지명을 우화 속 공간에 중첩함으로써 실제라면 단숨에 닿기 불가능한 거리를 이동하는 상황이 과장되게 표현된 것임을 알 수 있군."]},"22":{"s":"(가)～(다)에 대한 설명으로 가장 적절한 것은?","c":["(가)는 계절을 나타내는 소재로 시적 분위기를 조성하고 있다.","(나)는 자연을 관조하며 시적 상황을 탈속적 태도로 바라보고 있다.","(다)는 글쓴이와 타인의 생각을 비교하며 세태를 비판하고 있다.","(가)와 (다)는 모두, 연쇄적 표현을 통해 주체의 태도 변화 과정을 보여 주고 있다.","(나)와 (다)는 모두, 가정적 표현을 통해 대상의 속성을 드러내고 있다."]},"23":{"s":"<보기>를 참고하여 (가), (나)를 감상한 내용으로 적절하지 않은 것은?","c":["(가)에서 ‘사방을 둘러보’며 ‘발자국 소리’가 ‘들리지 않’음을 확인하는 것은, ‘밤을 지키는’ 이의 눈을 피해 다니며 그리운 존재를 찾고 있는 암울한 현실 상황을 보여 주는군.","(가)에서 ‘오던 길’을 ‘소금들’이 ‘환히 비춰 주’는 것은, ‘두고 온 것들’이 되살아날 미래를 기대하게 한다는 점에서 빛의 회복에 대한 소망이 실현될 수 있음을 암시하겠군.","(나)에서 ‘반짝’이는 ‘잎새’와 ‘그늘’을 함께 지닌 ‘감나무’ 아래에 ‘평상을 놓’는 것은, 밝음과 어두움이 어우러져 있는 자연에서 내면에 대한 성찰을 이어 가고 있음을 나타내는군.","(가)에서 ‘별 하나 눈뜨지 않’는 밤은 함께하던 이가 보이지 않는 상실의 상황을, (나)에서 ‘잠 뒤척’이는 ‘밤’은 마음이 감처럼 ‘익어’ 가는 데 필요한 성숙의 시간을 의미하겠군.","(가)에서 ‘빛나는 때를 위해’ ‘저녁’부터 ‘새벽’까지 길을 걷는 행동과, (나)에서 ‘짙푸른 감들’이 ‘등불을 밝힐 것’이라는 전망은 모두, 밝음이 나타날 것이라는 인식을 드러내는군."]},"24":{"s":"㉠～㉣에 대한 이해로 적절하지 않은 것은?","c":["㉠이 ‘목메이게 부르짖’는 것과 ㉡을 찾고자 ‘숨가쁘게’ 길을 넘는 것에는 모두, 대상을 향한 간절한 마음이 드러난다.","㉢ 중에는 쓸모는 있지만 남들이 듣고 미워하는 소리가 있는 한편, ㉣은 아니지만 남들이 듣고 좋아하는 소리도 있다.","㉠이 잦아드는 것은 ‘다른 목소리의 끝’에 닿지 못하고 있는 상태를, ㉢이 흩어지는 것은 아름다운 소리가 글로써 실현되지 못한 상태를 의미한다.","㉠은 ‘잊혀진’ 상태이지만 다시 ‘살아’날 수 있다고 화자가 생각하는 대상이고, ㉣은 바른 것 같으면서도 삿된 것일 수 있다고 글쓴이가 생각하는 대상이다.","㉡을 찾기 위해 화자는 미세한 소리에도 ‘칼날’을 ‘세우’듯이 민감하게 반응하려 하고, ㉢ 중에서 담소하는 소리뿐만 아니라 탄식하는 소리도 글쓴이는 쓸모 있다고 여기고 있다."]},"25":{"s":"ⓐ～ⓔ를 중심으로 (나)를 이해한 내용으로 가장 적절한 것은?","c":["화자는 ⓐ가 흔드는 것이 감나무 잎새뿐이라고 여기다가 ⓑ를 보며 그 생각을 바로잡고 있다.","화자는 ⓑ가 내는 소리와 ⓒ의 움직임을 통해 감나무 열매가 충분히 익은 상태임을 짐작하고 있다.","화자는 ⓑ와 ⓒ가 감나무에서 만났다가 한순간에 헤어지는 것을 보며 자신의 사랑이 끝났음을 떠올리고 있다.","화자는 감나무 열매가 자라는 과정에서 ⓓ를 만나기도 하고 ⓔ를 만나기도 하는 일이 유의미하다고 여기고 있다.","화자는 ⓑ와 ⓒ가 감나무를 떠난 후에 ⓓ와 ⓔ가 오는 것을 보며 머지않아 새로운 사랑이 시작될 것을 기대하고 있다."]},"26":{"s":"<보기>를 참고하여 (다)를 감상한 내용으로 적절하지 않은 것은?","c":["‘만물’이 소리 나는 이치에서 시작하여 ‘사람’이 소리를 내는 이치를 밝히며, 소리를 화두로 삼아 문장에 대해 말하고 있군.","‘소리’가 지닌 상반된 특성들이 서로 균형을 이루어야 ‘좋은 소리’임을 제시하여, 문장이 궁극적으로 도달해야 할 바를 드러내고 있군.","최립의 문장이 완성된 것은 아니지만 ‘참으로 어려운 일’에 가까움을 언급하며, 그의 문장에 대한 평가를 드러내고 있군.","최립의 문장에 담긴 ‘뜻’이 도리에 합당함을 향하고 있음을 언급하며, 그가 학업에 정진할 것을 당부하고 있군.","글로 드러난 최립의 소리가 크게 나는 것이 그의 ‘마음’과 ‘기’에서 비롯됨을 언급하여, 그의 문장이 뜻을 크게 드러내고 있음을 칭찬하고 있군."]},"27":{"s":"[A]에 대한 이해로 적절하지 않은 것은?","c":["온 씨와 허명두는 서로에게 질문을 하며 상대의 반응을 살폈다.","허명두는 온 씨의 발언에 불쾌해하며 과거에 자신이 느꼈던 감정을 떠올렸다.","온 씨는 허명두와 대화를 나누며 상대에 대한 자신의 짐작이 맞았다고 생각하였다.","온 씨는 상대의 행위를 평가하는 표현을 반복하며 허명두에게 꾸미고 있는 일을 그만두라고 경고하였다.","온 씨가 공격적인 태도를 보이자 허명두는 에둘러 말하여 상대의 관심을 다른 곳으로 돌릴 수 있었다."]},"28":{"s":"ⓐ와 ⓑ에 대한 이해로 가장 적절한 것은?","c":["ⓐ가 형성된 과정은 ⓑ가 주변에 전해진 것과 무관하다.","ⓐ가 처음 퍼진 시점은 ⓑ가 처음 퍼진 시점보다 앞선다.","ⓐ는 ⓑ로 인한 인물 간의 갈등을 해결할 실마리를 제공하고 있다.","ⓐ가 주변에 빠르게 확산된 것은 ⓑ가 거짓으로 판명되었기 때문이다.","ⓐ에는 ⓐ를 처음 퍼뜨린 인물이 ⓑ와 관련하여 찾아가 만난 인물에게 확인한 내용이 반영되어 있다."]},"29":{"s":"‘독가촌’에 대한 설명으로 가장 적절한 것은?","c":["고속도로가 연결될 것이 알려진 후 외부 사람들의 관심을 받게 된 곳이다.","허명두가 지목 변경으로 기득권을 부여받고서 집들을 사들이고 있는 곳이다.","마을 사람들이 농사를 지어 왔지만 여전히 경제적으로 자립하기 어려운 곳이다.","온 씨가 마을 사람들과 함께 농업 중심의 기존 생활양식을 바꾸려 하는 곳이다.","관광지로서의 좋은 조건을 갖추게 하려고 마을 사람들이 피땀 흘려 노력한 곳이다."]},"30":{"s":"<보기>를 참고하여 ㉠～㉤을 이해한 내용으로 적절하지 않은 것은?","c":["㉠ : 인물과 상대를 ‘두 종류의 인간군’으로 일반화함으로써 상대와의 인식 차이가 좁힐 수 없는 것임을 드러내어, 상대와 소통이 어렵다는 인물의 생각이 타당한 것처럼 서술하였다.","㉡ : 마을의 상황을 ‘싸움’으로 주관화함으로써 상대가 추구하는 ‘사리의 옳음’이 싸움에서 이기는 데에 유용하지 않음을 드러내어, 인물의 생각이 타당한 것처럼 서술하였다.","㉢ : 상황 변화가 ‘안정’을 위협한다는 상대의 생각을 헤아림으로써 변화의 부정성을 인정하면서도 무엇이 변화의 원인인지는 달리 보아, 인물의 왜곡된 시선이 드러나도록 서술하였다.","㉣ : ‘실리’를 추구한 측이 언제나 우위를 차지했다며 과거의 경험을 일반화함으로써 현재 상황에서도 실리가 우선되어야 한다고 합리화하여, 인물의 생각이 타당한 것처럼 서술하였다.","㉤ : ‘그것’이 지나가고 있음에도 ‘아직’은 유효하다고 주관화함으로써 현실의 변화를 인식하면서도 기존의 선택을 고수하여, 인물의 자기중심적 태도가 드러나도록 서술하였다."]},"31":{"s":"(가), (나)에 대한 설명으로 가장 적절한 것은?","c":["(가)는 남의 말을 인용하여 목적지의 위험성을 드러내고 있다.","(가)는 대구와 대조 표현을 함께 사용하여 화자의 괴로운 처지를 드러내고 있다.","(나)는 가상의 존재에 빗대는 표현을 사용하여 자연 현상의 변화를 드러내고 있다.","(나)는 방위의 의미를 포함한 두 어휘를 사용하여 대상이 서로 반대 방향으로 이동함을 드러내고 있다.","(가)와 (나)는 모두, 색채를 나타내는 표현을 통해 배경 속에서 대상의 움직임을 뚜렷하게 드러내고 있다."]},"32":{"s":"㉠～㉤에 대한 이해로 적절하지 않은 것은?","c":["㉠은 행로를 잠시 멈추게 된 이유가 되는 인식으로, 서성 밖까지 이르는 여정이 고단했음을 드러내고 있다.","㉡은 술맛에 대한 평가로, 장사가 홀연히 등장했다는 인식과 함께 술의 출처를 판단하는 근거가 된다.","㉢은 장사에게 화자가 어떻게 보였을지 추측한 진술로, 화자에게 물건을 싸게 판 이유를 추정하는 단서가 되고 있다.","㉣은 이 부사에 대한 평가로, 좋은 술을 얻은 것은 그가 옛 인연이 있었던 화자를 알아보았기 때문이라는 생각을 바탕으로 한다.","㉤은 발을 내려 모습을 가리는 행위의 효과를 의심하는 표현으로, 위엄을 세우기 어렵겠다는 인식과 연결되고 있다."]},"33":{"s":"ⓐ, ⓑ에 대한 이해로 가장 적절한 것은?","c":["ⓐ는 감긴 실을 끝까지 풀어서 멀리 떠나보내려는 대상이다.","ⓐ는 비를 기원하여 바다 건너 자연물에 걸어 두려는 대상이다.","ⓑ는 바람이 잦아들었을 때 하늘에 유유히 띄워 두는 대상이다.","ⓐ와 ⓑ는 모두, 임에게 보내려는 전언을 담고 있는 대상이다.","ⓐ와 ⓑ는 모두, 집단의 의지를 실현하기 위해 날리는 대상이다."]},"34":{"s":"<보기>를 참고하여 (가)～(다)를 감상한 내용으로 적절하지 않은 것은?","c":["(가)에서 얼음물에 빠져 ‘버선 행전’ 다 적시는 대목은 경험을 실감 나게 보여 주면서 화자를 장면 속에서 대상화하여 ‘동태가 되었더라’라고 우스꽝스럽게 표현하는군.","(나)는 정월 보름날에 ‘큰 잔에 술을’ 붓는 행위로 예를 갖추며 연을 ‘마지막 전송’하는 모습을 통해 평안함에 대한 화자의 바람을 담아내는군.","(다)에서 연이 ‘솟아올라 구름’에 걸치는 것을 보고 화자가 연줄의 힘을 빌려 ‘먼 데 임’에게 가려고 하는 것은 대상의 역동성이 화자의 욕망을 불러일으키는 모습을 보여 주는군.","(가)에서 ‘가슴에 열’이 나서 ‘냉수’를 먹는 행위는 임무 수행 에서 느낄 수 있는 고충을 드러내고, (나)에서 근심을 ‘세세히 적’는 행위는 문제 해소를 원하는 화자의 마음을 보여 주는군.","(나)는 연이 ‘굼틀뒤틀 뒤틀어져’ 올라가는 모습을 생동감 있게 묘사하여, (다)는 연의 재료를 ‘강원도 설화지’로 구체적으로 제시하고 ‘크기’까지 언급함으로써 대상 자체를 부각하는군."]}},"26-3학평":{"18":{"s":"(가)~(다)에 대한 설명으로 가장 적절한 것은?","c":["(가), (다)와 달리 (나)는 자연물을 활용하여 특정 계절의 분위기를 자아내고 있다.","(가), (나)와 달리 (다)는 대화의 형식을 활용하여 인물 간의 친밀감을 드러내고 있다.","(가)는 음성상징어를, (나)와 (다)는 현재형 진술을 활용하여 생동감을 부여하고 있다.","(가)는 의문형 어미를, (나)와 (다)는 감탄형 어미를 활용하여 예찬적 태도를 드러내고 있다.","(가)~(다)는 모두 원근을 나타내는 지시 표현을 사용하여 대상에 대한 경외심을 강조하고 있다."]},"19":{"s":"[A]와 [B]를 이해한 내용으로 적절하지 않은 것은?","c":["[A]에서 ‘웃음’과 ‘발걸음’, [B]에서 ‘웃음’과 ‘걸음’은 문장 성분의 의도적 배치를 통해 주목의 대상으로 제시된다.","[A]에서 ‘웃음’과 ‘발걸음’의 주체는 인공물과 자연물의 대응을 토대로 [B]에서 ‘외로운 추수꾼’으로 지시된다.","[A]에서 ‘웃음’에 대응되는 ‘사과’가 지닌 ‘하늘과 물과 바람’의 생명력은, [B]에서 ‘오랜 세월’을 거쳐야 무르익을 수 있는 것으로 부연된다.","[A]의 ‘발걸음’에서 ‘햇빛 향기’로 이어지는 연쇄는 [B]에서의 ‘걸음’이 ‘걷지 않아도 저절로 나아가는’ 것임을 나타낸다.","[A]의 ‘스스로 넘치고 무거워져서 떨어지는 웃음’은 [B]에서 ‘저절로 익어 흘러나온 웃음’에 대응되면서, ‘외로운 추수꾼’이 스스로 충만한 존재임을 드러낸다."]},"20":{"s":"㉠과 ㉡에 대한 이해로 가장 적절한 것은?","c":["㉠은 기대를 간직한 채 망설이는 태도를, ㉡은 꿈에서의 기대를 내려놓고자 하는 태도를 드러내고 있다.","㉠은 기대 실현의 가능성을 부정하려는 태도를, ㉡은 꿈에서 형성된 기대를 현실로 확장하려는 태도를 드러내고 있다.","㉠은 미련을 버리고 기대에 연연하지 않으려는 태도를, ㉡은 꿈에서 품은 기대를 떨치고 현실을 직시하는 태도를 드러내고 있다.","㉠은 현실에서 품은 기대가 좌절될 것을 염려하는 태도를, ㉡은 꿈에서 품은 기대를 허상으로 치부하려는 태도를 드러내고 있다.","㉠은 사실의 확인을 유보함으로써 기대를 유지하려는 태도를, ㉡은 꿈에서의 기대를 현실에서도 유지하려는 태도를 드러내고 있다."]},"21":{"s":"<보기>를 바탕으로 (가)~(다)를 감상한 내용으로 적절하지 않은 것은?","c":["(가)에서 ‘당신’의 부재는 ‘서해’라는 공간을 바탕으로, (나)에서 ‘커다란 웃음’은 ‘고층 빌딩 사무실’이라는 공간을 바탕으로 상상의 공간을 창출하는 계기로 작용하고 있군.","(가)에서 ‘여느 바다’에 대한 경험은 ‘그곳 바다’와의 공통적 속성을 유추하게 하는 동시에 두 공간이 대비를 이루는 것으로 의식하게 하는 단초로 작용하고 있군.","(나)에서 ‘서류 뭉치를 나르’는 행위는 ‘방금 딴 사과가 가득한 상자를 들고’ 움직이는 행위와 동일시되면서 현실과 상상의 공간이 동시적으로 구현되는 양상을 나타내고 있군.","(가)의 ‘가 보지 않은 한쪽 바다’는 ‘마음속에서나 파도치고 있’는 것으로 제시되고 (다)의 ‘의원’은 ‘없다 생각하고’ 봄으로써 ‘없었던 적이 없’는 것으로 규정되어, 공간의 물리적 구속에 얽매이지 않는 비가시적 세계의 속성을 드러내고 있군.","(나)의 ‘안 보는 척 보았네’라는 진술과 (다)의 ‘종이 위에 펼쳐 놓은 말’에 대한 언급은 비가시적인 세계를 현실에 소환하여 공간의 한계를 확인하려는 태도를 드러내고 있군."]},"22":{"s":"(다)의 인물에 대한 이해로 적절하지 않은 것은?","c":["‘나’는 원림을 ‘경영’하는 일과 ‘붓 끝에서 완성하는’ 일을 대비하여, 실제 원림을 가꾸는 것보다 글로 원림을 표현하고 즐기는 것이 더 낫다고 보았다.","‘힐난하는 이’는 ‘이름’과 ‘실질’의 관계를 언급하며, 원림을 실제로 소유하지 않으면서도 소유한 것처럼 여기는 글쓴이의 태도에 문제가 있다고 보았다.","‘나’는 원림을 ‘있다’고 전제하고 바라보면 실재하는 형상에 얽매이게 되어, 오히려 원림을 즐기는 데 방해가 될 수 있다고 보았다.","‘나’는 ‘중장통’과 ‘유린’의 사례를 들어, 글이나 그림이 실제로 존재하는 원림을 대신하는 구실을 하여 진정으로 즐거움을 누릴 수 있다고 보았다.","‘나’는 ‘이름과 실재를 그래 어느 겨를에 논하겠는가’라고 언급함으로써, 원림의 존재를 둘러싼 논의를 부차적인 것으로 보았다."]},"23":{"s":"윗글에 대한 설명으로 가장 적절한 것은?","c":["자연의 영원성과 대조되는 인간사의 무상함을 절제된 어조로 표현하고 있다.","어지러운 세태를 제시하고 이에 거리를 두어 관조하는 태도를 드러내고 있다.","원경에서 근경으로 시선을 이동하며 주변 경치를 관찰하고 느낀 감상을 표출하고 있다.","자연에서의 낯선 경험을 구체적으로 묘사하여 탈속적 이상향을 향한 동경을 강조하고 있다.","스스로 질문을 던지고 답변을 제시하는 형식을 반복하여 상황에 대한 인식을 드러내고 있다."]},"24":{"s":"㉠~㉤에 대한 설명으로 적절하지 않은 것은?","c":["㉠ : 명령형 표현을 사용하여 이어지는 내용에 대한 집중을 유도하고 있다.","㉡ : 유사한 문장 구조를 대응시켜 상대의 언행에 대한 반응을 강조하고 있다.","㉢ : 상반된 행위를 연달아 배치하여 자신의 능력에 대한 자각을 드러내고 있다.","㉣ : 과장된 표현을 통해 자신의 처지를 부각하고 있다.","㉤ : 열거의 방식을 통해 현재 상황에 대한 신체적 반응을 구체화하고 있다."]},"25":{"s":"ⓐ와 ⓑ에 대한 설명으로 가장 적절한 것은?","c":["ⓐ와 ⓑ는 특정 행위가 동기로 작용하여 일어난 상반된 결과이다.","ⓐ와 ⓑ는 정서의 형성을 매개하면서 그 정서가 표출되는 방식의 차이를 유발하는 원인이다.","ⓐ와 ⓑ는 상황의 개선에 대한 기대를 투영하나 실현 가능성의 측면에서는 대비를 이루는 대상이다.","ⓐ에서 ⓑ로 이어지는 자연의 순환은 화자가 처한 상황을 다시 돌아보게 하는 계기이다.","ⓐ에서 ⓑ로 이어지는 시간의 흐름은 화자가 처한 상황이 바뀔 것임을 암시하는 배경이다."]},"26":{"s":"<보기>를 바탕으로 윗글을 감상한 내용으로 적절하지 않은 것은?","c":["‘빌어먹기’에 이어서 ‘신 삼기’와 ‘노 꼬기’를 시도하는 화자의 모습은 귀양살이의 열악한 생활에 적응하려는 반복적인 노력을 보여 주는군.","‘가지런히’ 나는 ‘오리’ 및 ‘한 빛’을 이루는 ‘물과 하늘’은 ‘근심 많은 이내 마음’을 ‘노 꼬기’에 부치게 된 화자의 상태에 조응하는 자연의 풍광이라고 볼 수 있군.","귀양살이에서 벗어나 ‘임’과 ‘웃으며’ 재회하고 싶다는 화자의 소망은 ‘하루 열두 시를 몇 번이나 기다렸’다는 진술에서 그 간절함이 확인되는 것으로 볼 수 있군.","‘공문’과 ‘장수’의 대응과, ‘석방 문서 가진 관선’과 ‘고기 잡는 어선’의 대응은 희망과 현실의 괴리를 드러내면서 소망의 실현이 어려울 것임을 짐작하게 하는군.","‘임으로 든 병’을 고치는 방법에 착안하여 ‘공명으로 든 병’을 ‘공명으로 고치려’는 것은, 귀양살이로 인한 ‘설움’을 완화하기 위한 방편이라 할 수 있군."]},"27":{"s":"이름얻기에 대한 설명으로 가장 적절한 것은?","c":["태어날 당시의 명명과 달리 용기와 사냥 능력을 시험함으로써 새롭게 정체성을 부여받는 의식이다.","이름에 내재된 자연 현상의 의미를 파악함으로써 부족의 세계관을 자신의 것으로 수용하는 의식이다.","신체의 강점과 전투력을 보여 줌으로써 태어날 때 임의로 부여받은 이름을 공고히 유지하는 의식이다.","관습에 따른 명명에서 벗어나 집단과 차별되는 행위를 수행함으로써 개인의 특성을 드러내는 의식이다.","이름을 일방적으로 부여받는 것과 달리 공동체에 이익을 제공함으로써 호명될 이름을 선택하는 의식이다."]},"28":{"s":"㉠~㉤에 대한 이해로 적절하지 않은 것은?","c":["㉠ : 대상의 특징을 잘 드러내는 부분을 부각하여 그것이 지닌 위력을 강조하고 있다.","㉡ : 사냥을 앞둔 소년들의 긴장감을 청각적 경험과 함께 제시하고 있다.","㉢ : 복합적인 심정으로 목표물과의 대면을 기다리는 주인공의 모습을 묘사를 통해 보여 주고 있다.","㉣ : 인물의 심리를 대상에 투영하여 대상의 움직임에 의도를 부여하고 있다.","㉤ : 행동의 연속적 제시를 통해 관찰에서 표현으로 이어지는 과정이 익숙한 것임을 드러내고 있다."]},"29":{"s":"[A]에 나타난 서술상의 특징으로 가장 적절한 것은?","c":["빈번하게 장면을 전환하여 인물들 사이에 긴장감을 조성하고 있다.","초점화된 인물의 시선을 통해 사건의 국면을 상세히 서술하고 있다.","과거를 회상하는 표현을 통해 갈등 해결의 실마리를 제시하고 있다.","사건의 인과 관계를 명시적으로 드러내며 예측했던 결과를 보여 주고 있다.","인용 부호를 생략한 발화를 제시하여 사건을 바라보는 인물의 내면을 드러내고 있다."]},"30":{"s":"<보기>를 참고하여 윗글을 감상한 내용으로 적절하지 않은 것은?","c":["‘훌륭한 식량원’과 ‘진정한 용사의 자격’을 얻고자 소년들이 나서는 것은 공동체의 요구 방식에 따라 수렵 대상인 들소를 포획하기 위해서임을 알 수 있군.","‘돌진해 오’는 들소에게 ‘황급히 창을 겨누었’지만 ‘덮쳐 오는 사나운 콧김과 거친 발굽 소리’에 공포를 느끼는 것에서 주인공의 포획 시도가 실패할 것임을 알 수 있군.","‘오한과 신열’을 의식하지 못한 채 그림에 몰두하는 모습은 들소를 포착하여 공동체의 서열에 진입하고자 하는 주인공의 욕망을 보여 주는군.","‘엄청난 살기’를 뿜어내는 들소의 ‘생명력’을 두려워하는 데서 벗어나 이를 그림에 온전히 담으려 하는 주인공의 모습은 자신만의 방식으로 들소를 포착하려는 시도에 대응하는군.","‘고기와 가죽을 얻기 위해서’가 아니라 ‘나만의 선과 색으로 영원히’ 들소를 ‘잡아 두고자’ 하는 것에서 들소가 예술적 형상화의 대상으로 재규정되는 양상을 확인할 수 있군."]},"31":{"s":"윗글의 내용에 대한 이해로 적절하지 않은 것은?","c":["중백은 군주와의 혼인을 거절했으나 상은 강제로 혼인 날짜를 정했다.","시랑은 현요가 과부의 처지에 만족하지 않을 것이라는 부인의 의견에 동의하였다.","상은 적절한 자질을 갖춘 인물을 사신으로 보내야 한다는 승상 주연의 의견이 타당하다고 보았다.","승상 주연은 중백의 사면을 건의했고 상은 이를 수용한 후 중백에게 기존보다 더 높은 지위를 부여했다.","군주는 중백의 질책을 염려하였으나 중백이 떠나기 전에 상서 부중에 나가는 것이 도리에 부합하는 행위라 판단했다."]},"32":{"s":"㉠~㉤에 대한 이해로 적절하지 않은 것은?","c":["㉠ : ‘중백’을 우연히 본 ‘군주’의 반응이며, ‘보모’에게 원하는 정보를 구해 오라는 요청으로 이어지는군.","㉡ : ‘상’의 명령을 받은 ‘시랑’의 반응이며, ‘부인’의 의견을 구하기 위한 질문으로 이어지는군.","㉢ : 새로운 정보를 접한 ‘심 부인’의 반응이며, 거듭되는 부정적 상황에 대한 심정을 밝히는 발언으로 이어지는군.","㉣ : ‘상서 가중’을 관찰한 ‘보모’의 반응이며, 이들의 숨은 속내를 ‘군주’에게 전달하는 행위로 이어지는군.","㉤ : ‘군주’를 본 ‘가중의 상하’의 반응이며, 본심을 감춘 언사로 이어지는군."]},"33":{"s":"[A]와 [B]에 대한 설명으로 가장 적절한 것은?","c":["[A]에서 문제를 해결할 방책으로 제시된 제안은 [B]에서 그 이면에 숨겨진 의도가 분석되고 있다.","[A]에서 예상된 계획에 대한 긍정적인 전망은 [B]에서 현실로 나타나면서 그 효과가 증명되고 있다.","[A]에서 언급된 기묘한 계책은 [B]에서 실현을 위한 방안이 추가되면서 단계적으로 구체화되고 있다.","[A]에서 제안의 배경으로 제시된 대외 상황의 변화는 [B]에서 제안을 수용해야 하는 근거로 작용하고 있다.","[A]에서 인물의 지위 차이로 촉발된 갈등 상황은 [B]에서 위계질서를 수용함에 따라 완화될 것으로 전망되고 있다."]},"34":{"s":"<보기>를 참고하여 윗글을 감상한 내용으로 적절하지 않은 것은?","c":["군주가 ‘태후께 중백에 대한 말씀을 드리’자 상이 ‘중백을 불러 혼인하라고’ 한 것은, 공적 권력이 개인의 애정 관계에 개입하는 결과를 초래하겠군.","부인이 ‘부부의 정’은 ‘천자의 위엄’도 ‘폐하지 못’한다고 판단한 것은, 공적 명령을 따르는 것보다 개인 간의 혼약을 지키는 것을 우위에 둔 것으로 볼 수 있겠군.","부인이 언급한 ‘일신이 고요한 데서 제 마음을 평안히 하’는 것은, 개인의 생존을 우선시하는 전략적 판단의 성격을 지니는 것으로 볼 수 있겠군.","승상 주연이 중백을 ‘소임에 적합’한 자로 평가하는 것은, 군주와 태후의 사적인 목표를 실현하는 방안과 공적 명분이 부합하는 상황을 포착했기 때문이겠군.","중백이 ‘제국에 보내는 사신으로’ 임명받는 것은, 중백과 현요를 떨어뜨려 놓음으로써 애정의 실현을 지연시키는 원인으로 작용하겠군."]}},"26-5학평":{"18":{"s":"윗글에 대한 이해로 적절하지 않은 것은?","c":["회사는 구정 대목을 앞두고 있어 공급이 달리는 상황이었다.","사환아이는 영하의 추위 속에서 떨기만 하다가 일종의 안도감을 느꼈다.","영희는 타과 소속의 사환애들이 한꺼번에 나타나자 그들을 멈춰 세웠다.","사장은 외유 기간 동안 일정이 바빠서 본가로 국제전화 한 통 할 기회가 없었다.","회사에는 한비서와 부사장의 사임에 대한 소문이 돌게 되었다."]},"19":{"s":"㉠~㉤의 서술 방식에 대한 설명으로 적절하지 않은 것은?","c":["㉠ : 특정 인물의 생각을 직접적으로 드러내어 서술하고 있다.","㉡ : 특정 인물에 대한 정보를 제시하고 그 인물이 보일 법한 행동을 짐작하여 서술하고 있다.","㉢ : 특정 인물의 생각을 서술자의 관점으로 평가하는 방식으로 서술하고 있다.","㉣ : 특정 인물의 행동들을 순차적으로 서술하고 있다.","㉤ : 상황에 대한 인물들의 반응을 관용 표현을 활용하여 서술하고 있다."]},"20":{"s":"ⓐ와 ⓑ에 대한 설명으로 가장 적절한 것은?","c":["ⓐ에 담긴 정보는 ⓑ에 잘못된 정보가 기록되는 원인이 된다.","ⓐ는 ⓑ로 인해 발생한 문제의 책임을 규명하기 위해 만들어진 것이다.","ⓐ의 존재는 누구나 예상할 수 있었지만, ⓑ의 존재는 누구도 예상할 수 없었다.","ⓑ가 작성된 시점은 ⓐ가 집단적으로 공유되는 시점보다 앞선다.","ⓑ는 인물 간 갈등을 표면화하는 계기가 되고, ⓐ는 인물 간 갈등을 해소하는 계기가 된다."]},"21":{"s":"<보기>를 참고하여 윗글을 감상한 내용으로 적절하지 않은 것은?","c":["‘쥐꼬리만한 사환 봉급’마저 ‘에누리하여 지급’받았던 ‘사환아이’가 ‘제대로 난방도 되지 않은 사무실’에서 일하고 있는 것에서, 부당한 노동 환경에 처해 있는 노동자의 현실을 엿볼 수 있군.","‘사환애’가 ‘돌연한 사태’를 ‘그다지 해로울 게 없다’고 생각하며 ‘친구들이나 죄 순방해 보’고자 하는 것에서, 당면한 사건에 대하여 문제의식이 부족한 노동자의 모습을 엿볼 수 있군.","‘남자 사환애’가 ‘당분간 조업’이 ‘중단’된 상황을 ‘휴가 같은 게 아니’라 ‘결국 회사 문을 처닫는단 소리’로 이해하는 것에서, 불안정한 노동 현실에 대한 노동자의 위기의식을 엿볼 수 있군.","‘숙직 사령’인 ‘한비서’가 ‘통화를 할 수 없는 상태’라 ‘수위장 김씨’가 ‘스스로 비서 행세’를 하며 통화한 것에서, 기업이 직면한 위기에 직접 대응할 수밖에 없는 노동자의 모습을 엿볼 수 있군.","회사가 ‘정상 업무를 한다고 공시’된 상황에도 ‘전사원들’이 ‘실업의 위기’에 대하여 생각하는 것에서, 취약한 기업 구조로 인한 노동자들의 불안감을 엿볼 수 있군."]},"22":{"s":"(가)~(다)에 대한 설명으로 가장 적절한 것은?","c":["(가)는 영탄적 표현을 활용하여 대상에 대한 정서를 심화하고 있다.","(나)는 가정적 표현을 활용하여 현재 상황에 대한 원인을 포착하고 있다.","(다)는 음성 상징어를 활용하여 대상의 특징을 드러내고 있다.","(가)는 계절감을 드러내는 표현을 활용하여, (나)는 묘사의 방식을 활용하여 대상에서 촉발된 인상을 표현하고 있다.","(가), (나), (다)는 모두, 반어적 표현을 활용하여 주제 의식을 드러내고 있다."]},"23":{"s":"㉠～㉤에 대한 이해로 적절하지 않은 것은?","c":["㉠은 ‘전차, 자동차, 모든 바퀴’가 가는 곳을 알 수 없음을 부각하고 있다.","㉡은 ‘거리 모퉁이’의 ‘가로등’의 빛이 환하지 않은 상황을 부각하고 있다.","㉢은 ‘사랑하는 동무’들을 ‘안개’ 속에서 찾을 수 있게 된 순간을 강조하고 있다.","㉣은 ‘강물’들이 ‘겹쳐’ 흐르는 상황을 강조하고 있다.","㉤은 ‘별 둘’이 알맞은 때를 지나 ‘뜬’ 상황을 부각하고 있다."]},"24":{"s":"<보기>를 참고하여 (가), (나)를 감상한 내용으로 적절하지 않은 것은?","c":["(가)의 ‘거리가 흘러간다’는 표현은, 대상이 갖지 않는 속성을 활용하여 거리의 상태를 새로운 이미지로 재구성한 것이겠군.","(나)의 ‘기나긴 강물’이 ‘외로운 사람들의 낮과 밤 지나’ ‘내게로 왔’다는 표현은, 대비되는 시간을 활용하여 소외된 존재와 화자가 강물을 통해 연결되는 시적 세계를 형상화하고 있군.","(가)의 ‘안개’가 ‘끝없이’ 흐른다는 표현과 (나)의 ‘강물’과 ‘강물’이 ‘온누리’를 ‘껴안’고 ‘삼라의 뜻을 돌아’온다는 표현은, 과장을 활용하여 현실 세계에 대한 화자의 인식을 자연물의 동적 이미지로 형상화한 것이겠군.","(가)의 ‘다시’ ‘손목을 잡아 보’자는 편지를 ‘포스트 속에 떨어뜨’린다는 표현은 재회에 대한 기대를, (나)의 ‘잔잔한 강물 속에’ ‘숭어떼’가 ‘미끄럽게 춤’춘다는 표현은 강물이 품은 생명력을 이미지화한 것이겠군.","(가)의 ‘금휘장’에 ‘금단추’를 단 ‘배달부’가 ‘찬란히 나타’난다는 표현은 감각의 전이를, (나)의 ‘따뜻하고 드맑은 강물’ 위에 ‘가야금소리’가 ‘깃’든다는 표현은 감각적 이미지의 반복을 활용하여 시적 대상의 긍정적 이미지를 재구성한 것이겠군."]},"25":{"s":"(다)에 대해 이해한 내용으로 적절하지 않은 것은?","c":["주인은 담 그늘에 돋아난 난초의 됨됨이가 풀과 다르다고 생각했다.","객은 난초가 바람과 비를 견디지 못하고 시들어 버릴 것이라고 우려했다.","주인은 객의 말이 거의 통달했다고 인정하며 동자가 하던 일을 멈추게 했다.","동자는 주인의 지시에 따라 풀 덩굴을 치워 숨겨진 난초가 드러나게 만들었다.","지나가는 사람은 무너진 흙과 풀 덩굴 때문에 난초가 있다는 사실을 알지 못했다."]},"26":{"s":"다음에 따라 (가)와 (다)를 감상한 내용으로 가장 적절한 것은?","c":["(가)에서 화자는 ‘많은 사람들’이 ‘정박할’ ‘항구’가 없는 상황을 통해 유랑하는 삶에 대한 연민을, (다)에서 글쓴이는 ‘난초’를 귀하게 여기는 주인을 부정적으로 평가하는 객의 말을 통해 존재의 본성을 인위적으로 드러내지 않는 것의 가치를 부각하고 있군.","(가)에서 화자는 ‘안개 속에 잠긴 거리’의 ‘모든 것이 흐르는’ 모습을 통해 쇠락한 도시 문명에 대한 비애를, (다)에서 글쓴이는 ‘흙단’을 만드는 주인을 비판하는 객의 말을 통해 존재의 가치를 드러내는 것의 중요성을 강조하고 있군.","(가)에서 화자는 ‘붉은 포스트 상자’를 붙잡고 서는 행위를 통해 정착하고자 하는 소망을, (다)에서 글쓴이는 ‘난초’가 ‘풀 덩굴’에 있는 상황을 지적하는 객의 말을 통해 열악한 환경을 개선하는 일의 필요성을 부각하고 있군.","(가)에서 화자는 ‘꺼지지 않은 것’의 ‘상징’에 대한 의문을 통해 현실 극복의 의지를, (다)에서 글쓴이는 ‘난초’의 ‘냄새’를 맡는 행위를 긍정하는 객의 말을 통해 대상과 교감하며 존재의 가치를 확인하는 일의 중요성을 강조하고 있군.","(가)에서 화자는 ‘밤’을 새워 ‘아침’을 기다리는 행위를 통해 벗어날 수 없는 현실에 대한 성찰을, (다)에서 글쓴이는 ‘풀’이 ‘서리와 이슬’을 맞을 상황을 걱정하는 객의 말을 통해 시련으로 인해 존재의 본성이 훼손되는 상황에 대한 경계를 드러내고 있군."]},"27":{"s":"(가)～(다)에 대한 설명으로 적절하지 않은 것은?","c":["(가)는 대구의 방식을 통해 시적 상황을 부각하고 있다.","(나)는 나열의 방식을 통해 운율감을 형성하고 있다.","(다)는 유사한 문장 구조를 반복하여 시적 의미를 강조하고 있다.","(가)와 (나)는 모두, 색채어를 활용하여 대상의 속성을 드러내고 있다.","(가)와 (다)는 모두, 의인화된 대상을 활용하여 화자의 정서를 드러내고 있다."]},"28":{"s":"㉠～㉤에 대한 이해로 적절하지 않은 것은?","c":["㉠ : 세월에 대한 경험을 바탕으로 상대에게 행동에 대한 경계를 드러내고 있다.","㉡ : 불가능한 상황을 설정하여 원하는 것을 얻기 위해서는 시간이 필요함을 드러내고 있다.","㉢ : 대상의 상황에 대한 가정을 바탕으로 세상일에 대한 깨달음을 드러내고 있다.","㉣ : 역사적 인물의 행적을 서술하며 인물에 대한 평가를 드러내고 있다.","㉤ : 분수에 맞는 삶을 영위하고자 하는 자세를 드러내고 있다."]},"29":{"s":"ⓐ와 ⓑ에 대한 설명으로 가장 적절한 것은?","c":["ⓐ는 화자가 바라는 것을 이루기 위해 준비한 대상이고, ⓑ는 화자가 바라는 것을 미루게 하는 대상이다.","ⓐ는 화자가 꺼리는 것을 차단하기 위한 대상이고, ⓑ는 화자가 외부와 단절된 상태임을 알 수 있는 대상이다.","ⓐ는 화자가 심리적으로 가깝게 여기고 있는 대상이고, ⓑ는 화자가 위축된 상황에 처해 있음을 알 수 있는 대상이다.","ⓐ와 ⓑ는 모두, 화자가 자신의 과거를 후회하게 만드는 대상이다.","ⓐ와 ⓑ는 모두, 화자가 자신의 상황이 변할 것이라는 믿음을 갖게 하는 대상이다."]},"30":{"s":"<보기>를 참고하여 (가)~(다)를 감상한 내용으로 적절하지 않은 것은?","c":["(가)에서 ‘털끝마다 점점 흰’ 머리를 ‘이리저리 혜여 보’아도 ‘오는 백발 검을소냐’는 것에서, 노년에 겪는 외면적 모습의 변화로 인해 늙음을 인식하는 화자의 모습을 엿볼 수 있군.","(나)에서 ‘도덕 영웅들은 유적이나 있거니와’ ‘우리 같은 초로인생’ ‘아니 놀고 무엇 하’냐는 것에서, 다른 인물과의 비교를 통해 현재의 삶을 수용하는 화자의 태도를 엿볼 수 있군.","(다)에서 ‘송국죽’을 ‘매일’ ‘즐기어니 늙는 줄을 어이’ 아냐고 하는 것에서, 자연을 향유하며 노년의 삶을 긍정하는 화자의 태도를 엿볼 수 있군.","(가)에서 ‘할 수 없다’며 ‘백발은 사람마다 겪는’다고 하는 것과 (나)에서 ‘백발’이 ‘공도’라고 하는 것에서, 늙음을 자연의 섭리로 이해하는 화자의 모습을 엿볼 수 있군.","(가)에서 ‘늙을사록 분한 마음 정할 수 바이 없다’고 하는 것과 (다)에서 ‘늙는 줄을 내 모르니’ ‘영욕인들 내 알더냐’는 것에서, 인간의 유한성을 인정하지 못하는 화자의 태도를 엿볼 수 있군."]},"31":{"s":"윗글의 인물에 대한 이해로 적절하지 않은 것은?","c":["‘방주’는 황천강에 이르러 완연한 사람의 몰골이 되었다.","‘황제’는 젊은 장수가 나타나자 그의 정체를 궁금해했다.","‘부인’이 열여검을 들어 풀 베듯하자 적졸들은 혼비백산했다.","‘부인’은 자신을 기다리고 있던 백호를 타고 집으로 돌아왔다.","‘방주’가 눈을 떴을 때 부인은 등불 아래에서 바느질을 하고 있었다."]},"32":{"s":"[A]와 [B]에 대한 설명으로 가장 적절한 것은?","c":["[A]는 상대의 지위를 언급하며 자신의 부담을 전가하고 있고, [B]는 상대와의 관계를 언급하며 자신의 요구를 관철하고 있다.","[A]는 구체적인 실익을 제시하여 상대의 논리적 허점을 지적하고 있고, [B]는 구체적인 명분을 들어 상대의 책임을 일깨우고 있다.","[A]는 상대의 선택이 가져온 영향을 언급하며 잘못을 지적하고 있고, [B]는 자신의 결정에 영향을 미친 상대의 행동을 오해하고 있다.","[A]는 상대의 변화에 의미를 부여하며 앞으로의 행동을 당부하고 있고, [B]는 자신의 행위로 인해 발생할 수 있는 상반된 상황을 언급하고 있다.","[A]는 상대의 성품에 기대어 자신에게 필요한 기회를 얻고자 하고 있고, [B]는 상대와 공유한 경험을 근거로 자신에 대한 상대의 행동 변화를 요구하고 있다."]},"33":{"s":"㉠～㉢에 대해 이해한 것으로 가장 적절한 것은?","c":["방주는 ㉠을 따르는 황건역사의 꾸지람을 듣고, 부인은 ㉡을 통해 그동안의 희생을 보상받고자 한다.","방주는 ㉠을 통해 황건역사와의 관계를 회복하고, 부인은 ㉢으로 인해 자신의 정체가 탄로날 것을 염려한다.","방주는 ㉠을 통해 염왕에 대한 두려움을 해소하고, 황제는 ㉢을 통해 부인의 행적에 대한 감격을 드러낸다.","부인은 ㉡을 통해 방주의 요청을 수용하고, 황제는 신하들에 대한 반감을 표출하기 위해 ㉢을 행한다.","부인은 ㉡을 통해 방주의 변화에 대한 만족을 드러내고, 황제는 ㉢을 통해 목숨을 부지하게 된 상황에 대해 감사를 드러낸다."]},"34":{"s":"<보기>를 참고하여 윗글을 감상한 내용으로 적절하지 않은 것은?","c":["‘염왕’이 ‘기름에 삶으라’고 ‘명령’하자 ‘불효한 죄’를 뉘우치며 ‘개과천선’하겠다고 비는 방주의 모습에서, 인물이 초월적 존재가 부여한 시련을 계기로 자신의 잘못을 반성하고 있음을 알 수 있군.","‘그날부터’ ‘진사 부부’를 ‘공양하고’ ‘지성으로 돌보니’ ‘인근 사람들’ ‘모두’에게 ‘칭찬’받는 방주 부부의 모습에서, 인물이 국가 질서의 회복을 위해 윤리적 실천을 사회적 차원으로 확장하고 있음을 알 수 있군.","‘부인’에게 ‘천상의 보배’를 건네며 ‘큰 공을 이루라’고 당부하는 선관의 모습에서, 인물이 정당한 가치 실현을 위한 행동에 나설 수 있도록 초월적 존재가 유도하고 있음을 알 수 있군.","‘그날로 길을 떠나’ ‘적병이 명나라 진영을 에워싸’고 있는 ‘서평관’에 가서 ‘백호’에게 ‘나와 함께 큰 공을 이루’라고 말하는 부인의 모습에서, 인물이 국가적 위기를 계기로 가치 실현을 위한 결심을 했음을 알 수 있군.","‘무수한 적병을 물리’쳐 ‘적 진중에 싸여 거의 죽게’ 된 ‘황제’를 구해내는 부인의 모습에서, 인물이 시련에 직접적으로 대응하며 유교적 가치를 실현하고 있는 모습이 구체화되고 있음을 알 수 있군."]}},"27-6모평":{"18":{"s":"윗글에 대한 이해로 적절하지 않은 것은?","c":["동식이가 마을을 떠나고 사흘 후 그에게 영장이 나왔다.","마을을 떠난 용팔이에게서는 한 번도 소식이 오지 않았다.","모량댁은 두칠이를 만나지 못한 채 슬퍼하며 세상을 떠났다.","마을에 온 양복쟁이는 집을 물어 가며 젊은이들을 찾아다녔다.","갑분이는 두칠이 동생들의 불행한 처지에 매우 가슴 아파했다."]},"19":{"s":"ⓐ, ⓑ의 서사적 특성에 대한 설명으로 가장 적절한 것은?","c":["ⓐ는 중심인물의 내적 갈등이 해소되는 시간이다.","ⓐ는 마을의 위기가 외부에서 비롯되었다는 점에서, 함박눈이 마을을 덮었던 그 겨울과 유사하다.","ⓑ는 적대적 인물에 대한 중심인물의 반감이 해소되는 공간이다.","ⓑ는 마을의 위기가 외부인의 노력으로 해결된다는 점에서, 중심인물의 능동성이 부각되는 나룻배와 차이가 있다.","ⓐ의 시기에, ⓑ는 적대적 인물에 의해 끊어져 인물 간 갈등이 심화된다."]},"20":{"s":"[A]에 나타난 인물의 반응에 대한 이해로 가장 적절한 것은?","c":["‘주먹을 불끈 쥐’는 것은 ‘안 돼!’에서 나타난 고조된 감정에 따른 신체적 반응을 보여 주는군.","‘뿌드득 물었던 어금니’가 떨리는 것은 상대가 ‘또렷하게’ 보인 것의 심리적 원인을 보여 주는군.","‘손가락들이 제가끔’ 힘없이 풀려 나간 것은 ‘하는 수 없다는 생각’을 받아들이지 않으려는 신체적 반응을 보여 주는군.","‘뒤통수를 갈기’는 듯한 생각이 드는 것은 ‘두 눈에 뜨거운 것이 핑’ 돈 것의 심리적 원인을 보여 주는군.","‘궁둥이를 탁 치’는 것은 ‘희한한 생각’을 받아들이지 않으려는 신체적 반응을 보여 주는군."]},"21":{"s":"<보기>를 참고하여 ㉠～㉤을 이해한 내용으로 적절하지 않은 것은?","c":["㉠ : 상대를 바라보는 인물 묘사와 함께 ‘우리 용팔이’라고 하며 ‘용팔이’를 먼저 떠올리는 인물 내면의 목소리를 진술하여, 떠올린 대상에 대한 인물의 유대감을 독자도 느낄 수 있겠군.","㉡ : 인물 내면의 목소리와 함께 상대를 바라보는 인물의 모습을 보여 주며 상대의 이동을 ‘가까워지는데’로 표현하여, 인물의 공간 감각을 독자도 느낄 수 있겠군.","㉢ : 인물 내면의 목소리와 함께 ‘부들부들’ 떨고 있는 인물의 모습을 통해, 상대에 대한 인물의 호기심과 반감을 모두 보여주어 인물이 처한 복합적 상황을 독자가 이해할 수 있겠군.","㉣ : 인물 내면의 목소리와 함께 ‘콧방귀를 팡 뀌’는 인물의 모습을 제시하여, 의기양양해 하는 인물의 심정을 독자도 느낄 수 있겠군.","㉤ : 인물 내면의 목소리와 함께 ‘오스스’ 떠는 인물의 모습을 통해, 자기 행위에 대한 인물의 확신과 불안을 모두 보여 주어 인물이 처한 복합적 상황을 독자가 이해할 수 있겠군."]},"22":{"s":"(가)～(다)의 공통점으로 가장 적절한 것은?","c":["상황의 대비를 통해 주제 의식을 드러내고 있다.","공간의 이동에 따라 대상의 변화를 그려 내고 있다.","계절의 흐름을 통해 애상적 분위기를 고조하고 있다.","말을 주고받는 방식으로 대상과의 친밀감을 드러내고 있다.","가상의 상황을 설정하여 현실에 대한 비판을 드러내고 있다."]},"23":{"s":"(나)에 대한 이해로 적절하지 않은 것은?","c":["‘자리이리라’에는 시련을 견뎌 내려 했던 ‘나무’의 시간과 경험이 ‘갈라’진 자국으로 남아 있다는 인식이 담겨 있군.","‘스며들었으리라’에는 ‘나무’의 내부로 들어온 모진 기운이 ‘수액’에 깊이 배어들었다는 인식이 담겨 있군.","‘익어갔으리라’에는 바깥의 힘이 매운 ‘추위’를 지나 ‘독한 향기’라는 부정적 결과를 맺었다는 인식이 담겨 있군.","‘이르렀을까’에는 시련이 수많은 ‘잎과 꽃’이라는 성취에 선행되었다는 인식이 담겨 있군.","‘흘러다니고 있다’에는 ‘나무’의 ‘무늬’에서 물 속 생명체의 움직임 같은 운동성이 느껴진다는 인식이 담겨 있군."]},"24":{"s":"<보기>를 참고하여 (가), (나)를 감상한 내용으로 적절하지 않은 것은?","c":["(가)에서 ‘나’가 ‘그 나무’를 보고 자신의 방황을 떠올린다는 점에서, ‘그 나무’는 화자의 처지를 환기하는 대상이군.","(나)에서 ‘목질’과 ‘나이테’로 이루어진 무늬는 ‘대패로 깎아’ 만든 가구의 문양이라는 점에서, 화자가 일상의 사물이 된 자연을 보고 그 표면을 관찰한 결과이군.","(가)의 화자는 ‘늦된 나무’의 ‘멍울’을 보고 연민의 정서를, (나)의 화자는 ‘나이테’의 ‘흔적’을 보고 나무에서 작용한 힘들에 대한 지각을 드러낸 것이군.","(가)의 화자는 나무에 대한 자신의 기대와 바람을 ‘푸릇한 잎새’로, (나)의 화자는 겨울을 겪은 후 나무가 맞이한 긍정적 시간을 ‘푸르고 진한 빛’으로 형상화한 것이군.","(가)의 ‘가난한 소지’는 여름 이후의 ‘저 나무’를 향한, (나)의 ‘귀기울’임은 ‘난폭한 힘’과 맞선 ‘거대한 힘’을 향한 화자의 기원이 담긴 점에서, 자연에 대한 화자의 전망을 표현한 것이군."]},"25":{"s":"(다)의 글쓴이에 대한 이해로 적절하지 않은 것은?","c":["‘등이 곱’고 ‘숨이 차’는 어려움 속에서도 노인이 공들여 꽃을 가꾼다는 점에서, 그의 모습을 아름답게 여기고 있군.","나이를 먹고도 ‘누추’한 행동을 하는 사람들도 있지만 노인은 오로지 꽃을 사랑한다는 점에서, 그의 ‘정정’함을 거룩하게 여기고 있군.","직접 심은 꽃나무에 맺힐 ‘꽃봉오리’를 노인이 보게 될 것이라는 점에서, 그의 ‘한 계절’을 보람 있게 여기고 있군.","‘꽃이 난만’하면 ‘우리’는 그 꽃을 보며 즐기겠지만 노인은 슬퍼할 것이라는 점에서, 노인이 끓는 ‘정염’에서 벗어난 경지에 이르렀다고 여기고 있군.","‘노년’이 ‘고고’한 ‘학’과 같은 덕을 지닌 시기라는 점에서, 노인이 꽃의 진정한 아름다움을 볼 수 있다고 여기고 있군."]},"26":{"s":"㉠～㉤에 대한 이해로 적절하지 않은 것은?","c":["㉠은 ‘여느 꽃나무’들이 성취로 빛나는 동안 ‘그 나무’는 멈칫거리고 있던 지체의 시간이다.","㉡은 화자가 ‘그 나무’에 ‘꽃불 성화’가 타오르기까지 앞으로 소요된다고 본 준비의 시간이다.","㉢은 나무의 안으로 ‘찾아 들어’온 ‘햇빛과 공기들’의 움직임이 멈추었던 기다림의 시간이다.","㉣은 ‘딱딱하게 오므’렸던 ‘모든 틈과 통로’가 다시 ‘드나들며 숨쉬’는 생동의 시간이다.","㉤은 ‘꽃’의 피고 지는 속성이 주기적으로 실현되는 반복의 시간이다."]},"27":{"s":"ⓐ와 ⓑ에 대한 설명으로 가장 적절한 것은?","c":["ⓐ는 ‘늦된 나무’가 몸을 감추려는, ⓑ는 ‘노인’이 생의 마지막을 장식하려는 이유이다.","ⓐ는 ‘늦된 나무’ 주변의 나무들에 의해 만들어진, ⓑ는 ‘노인’에 의해 이루어진 결과이다.","ⓐ는 ‘늦된 나무’가 봄을 더디게 맞이하려 하는, ⓑ는 ‘노인’이 매년 달라지려 하는 목적이다.","ⓐ는 ‘늦된 나무’의 꽃철을 앞당기기 위해 필요한, ⓑ는 ‘노인’의 남은 삶이 헛되지 않도록 하는 전제이다.","ⓐ는 ‘늦된 나무’가 부끄러움을 자각하기 위한, ⓑ는 ‘노인’이 자신의 남은 삶을 희생하기 위한 조건이다."]},"28":{"s":"㉠, ㉡을 이해한 내용으로 적절하지 않은 것은?","c":["㉠에는 길동이 승려들을 모이게 하는 것이 포함되겠군.","㉠에는 길동이 모래를 깨무는 것이 포함되겠군.","㉠에는 길동이 승려들을 본관에 고발하는 것이 포함되겠군.","㉡에는 도적들이 절에 들이닥친 일이 포함되겠군.","㉡에는 도적들이 재물을 실어 나른 일이 포함되겠군."]},"29":{"s":"ⓐ와 ⓑ에 대한 이해로 가장 적절한 것은?","c":["ⓐ는 ⓑ와 달리, 재정적으로 여유로운 곳이다.","ⓑ는 ⓐ와 달리, 외부로부터 군사적 지원을 받고 있다.","ⓑ는 ⓐ와 달리, 문서로 외부와의 갈등이 표면화되고 있다.","ⓐ와 ⓑ는 모두, 외부인이 공간 자체를 탈취하려 하고 있다.","ⓐ와 ⓑ는 모두, 구성원 사이에 위계가 없이 평등한 사회이다."]},"30":{"s":"다음은 수업 활동의 일부이다. 학생의 답변으로 적절하지 않은 것은?","c":["길동이 안심할 수 있는 장소로 도적들과 재물을 안전하게 보내려 하는 것은 ‘속이는 의도’로 볼 수 있어요.","길동이 승려의 차림으로 높은 곳에서 관군을 향해 소리친 것은 ‘속이는 방법’으로 볼 수 있어요.","길동이 도적들의 도주 방향에 대하여 관군에게 사실이 아닌 정보를 준 것은 ‘속이는 방법’으로 볼 수 있어요.","길동이 자신이 산에서 내려가는 것에 대하여 관군에게 사실이 아닌 정보를 준 것은 ‘속이는 방법’으로 볼 수 있어요.","길동의 속임수에 관군이 넘어가 도적들과 재물이 안심할 수 있는 장소에 이른 것은 ‘속인 결과’로 볼 수 있어요."]},"31":{"s":"<보기>를 참고하여 윗글을 감상한 내용으로 적절하지 않은 것은?","c":["길동이 ‘국세가 대국이나 다름이 없’는 율도국 정벌을 단행하는 것에서, 주인공이 안정적인 나라를 침략하여 욕망을 실현하려 함을 알 수 있군.","길동이 정벌에 대한 여러 군사들의 뜻을 묻자 장수들이 ‘평생 소원’이라 응하는 것에서, 주인공의 욕망이 공동체의 소원에 부응하는 것으로 제시되고 있음을 알 수 있군.","길동이 ‘대저 나라는 한 사람의 그릇이 아니라’며 ‘성탕’과 ‘무왕’의 일을 인용하는 것에서, 주인공이 내세운 정벌의 명분이 역사적 사례와 동격으로 제시되고 있음을 알 수 있군.","길동이 자신에게 ‘항복’하지 않는 것은 ‘천명’을 거역하는 일이라고 율도국 왕에게 주장한 것에서, 주인공의 정벌에 하늘의 뜻이라는 정당성이 부여되고 있음을 알 수 있군.","길동이 율도국 왕에게는 ‘무명 소적’이지만 ‘문무제신’에게는 두려움의 대상인 것에서, 왕이 되려 하는 주인공의 욕망이 마땅하다는 인식이 율도국에서 확산되고 있음을 알 수 있군."]},"32":{"s":"[A]～[C]에 대해 이해한 내용으로 가장 적절한 것은?","c":["[A]에서 화자는, 임과 함께하고 싶은 공간의 조건을 제시하며 그것이 갖춰지기를 기원하고 있다.","[B]에서 화자는, 창문을 매개로 하여 자신의 속마음을 임에게 전달하고 있다.","[C]에서 화자는, 임이 자신의 믿음을 저버린 이유가 변함없는 사랑을 강요한 자신 때문이라며 자책하고 있다.","[A]와 달리 [C]에서 화자는, 임과의 이별로 인해 홀로 남겨진 슬픔을 극복하고 소망을 이루려는 의지를 표출하고 있다.","[A]에서 화자는 춥더라도 만족할 수 있음을, [B]에서 화자는 봄을 맞고도 만족할 수 없음을 드러내고 있다."]},"33":{"s":"(나)에 대한 이해로 적절하지 않은 것은?","c":["행위를 드러내는 표현인 ‘꺼내 들어 얽어 매고 둘러 묶어’를 통해 행동의 연속적 과정을 드러내고 있다.","색채 표현인 ‘푸른’을 통해 시적 공간의 이미지를 시각화하고 있다.","음성 상징어인 ‘풍덩’을 통해 대상의 무게감을 실감나게 표현하고 있다.","상황을 가정한 표현인 ‘띄워 두면’을 통해 대상을 화자와 분리된 상태인 것처럼 제시하고 있다.","일정한 방향성을 가지지 않는 표현인 ‘이리저리’를 통해 화자의 우유부단한 태도를 드러내고 있다."]},"34":{"s":"<보기>를 참고하여 (가)～(다)를 감상한 내용으로 적절하지 않은 것은?","c":["(가)에서 ‘임’과 ‘정’을 나누는 ‘밤’이 ‘더디’게 흐르기를 원하는 마음을 표현한 것은, 시간의 흐름을 주관적 인식을 통해 변화시키고자 하는 소망에서 비롯한 것이군.","(나)에서 시적 대상을 ‘강물’에 ‘떠다니’는 것으로 표현한 것은, 심적 상태를 형체가 있는 사물로 형상화한 것이군.","(다)에서 ‘칡넝쿨’을 만물이 소생하는 ‘삼사월’의 것이라고 제시한 것은, 시적 대상과 관련한 정보를 덧붙여 자신이 소망하는 상태를 강조한 것이군.","(가)에서 ‘소춘풍’하는 ‘도화’와 대비되는 것으로, (다)에서 ‘나비’를 감는 ‘납거미’에 빗대는 것으로 화자의 상태를 제시한 것은, 특정한 상황으로 임과 하나가 된 현재를 강조한 것이군.","(나)에서 ‘시름’이 ‘절로 삭’을 것이라고, (다)에서 ‘나’가 ‘칡’이 되어 ‘임’과 계속 ‘감’겨 있고 싶다고 표현한 것은, 참신한 발상에서 비롯된 형상화 기법을 보여 준 것이군."]}},"26-7학평":{"18":{"s":"윗글에 대한 이해로 적절하지 않은 것은?","c":["이 통판의 부인은 혼사를 결정하기 위해 추월을 시켜 선옥을 보게 한다.","김 처사의 부인은 까치가 짖고 간 일을 길조로 여겨 향임을 반갑게 맞이한다.","이 통판의 부인은 춘파의 고백을 듣고 춘파 일행의 입장을 이해하여 죄를 묻지 않는다.","관아에서 돌아온 김 처사는 농옥과 의논하지 않고 친척들에게 선옥의 처를 새로 구할 뜻을 알린다.","부사는 삼부자가 한편이라고 생각하여, 김 처사의 부인과 농옥의 의견을 듣기 위해 관아로 불러들인다."]},"19":{"s":"㉠과 ㉡에 대한 이해로 가장 적절한 것은?","c":["㉠에 언급된 농옥에 대한 불신이 ㉡을 통해 해소된다.","㉠에 언급된 선옥의 가출은 ㉡에서 그 이유가 밝혀진다.","㉠에 언급된 선옥의 정체는 ㉡을 통해 가짜임이 드러난다.","㉠에 언급된 김 처사의 염려에 대해 ㉡에서 해결책이 제시된다.","㉠에 언급된 김 처사와 농옥의 입장 차이는 ㉡으로 인해 좁혀진다."]},"20":{"s":"[A], [B]에 대한 이해로 적절하지 않은 것은?","c":["[A]는 인물의 행적을 요약적으로 제시하며 해당 인물에 대한 평가를 드러내고 있다.","[B]는 자신의 행동이 평상시와 같음을 근거로 상대방의 의견이 부당함을 주장하고 있다.","[A]는 명령의 형식을 통해, [B]는 부탁의 형식을 통해 자신의 요구 사항을 전달하고 있다.","[A]는 관용적 표현을 사용하여, [B]는 초월적 존재를 언급하여 자신의 생각을 강조하고 있다.","[A]는 인물과의 친분을 언급하며, [B]는 상대방에 대한 불신을 드러내며 상대방의 인식 변화를 촉구하고 있다."]},"21":{"s":"<보기>를 참고하여 윗글을 감상한 내용으로 적절하지 않은 것은?","c":["향임이 ‘소저의 화용’을 자세히 보기 위해 여승의 모습으로 찾아왔다는 점에서, 속임을 통해 상대의 모습을 살피려는 의도를 확인할 수 있군.","향임이 농옥을, 추월이 선옥을 ‘인간 세상의 사람 같지’ 않다고 평가한 것에서, 혼담이 오가는 과정에 있는 남녀 주인공의 비범함이 주변 인물을 통해 드러나고 있음을 확인할 수 있군.","형옥이 데려온 남자가 ‘갓 나서부터 기른 자식’이 맞다는 김 처사의 부인과 부군이 아니라고 생각하는 농옥이 대립하는 모습에서, 진짜와 가짜를 판별하려는 상황을 확인할 수 있군.","‘홀로 부군이 아’님을 주장하는 농옥을 ‘병자’로 치부하는 부사의 모습에서, 주인공을 의도적으로 곤경에 빠뜨려 시련을 겪게 만드는 상황을 확인할 수 있군.","‘시부모의 뜻을 거역하지 말라’는 부사의 말에 ‘외모에 나타난 얼굴이야 어찌 모르겠’냐고 대답하는 농옥의 대처에서, 뜻을 굽히지 않는 인물의 소신 있는 태도를 확인할 수 있군."]},"22":{"s":"[A]에 나타난 서술상 특징으로 적절하지 않은 것은?","c":["과거 회상을 통해 인물의 내적 갈등을 드러내고 있다.","감각적인 표현을 활용하여 인물의 심리를 드러내고 있다.","인용 부호 없이 대상에 대한 인물의 생각을 드러내고 있다.","시간적 배경을 제시하며 대상과 인물 간의 유사성을 드러내고 있다.","비유적인 표현을 활용하여 인물이 위치한 공간에 대한 인상을 드러내고 있다."]},"23":{"s":"ⓐ～ⓓ를 중심으로 윗글을 이해한 내용으로 가장 적절한 것은?","c":["ⓐ는 소문에 반응을 보이지 않는 ⓑ와 달리, ⓒ의 말에 자신의 생각을 전달한다.","ⓐ와 ⓓ가 사내의 행방에 대해 현실적으로 접근하는 반면 ⓑ는 엉뚱한 상상을 바탕으로 의견을 제시한다.","ⓑ는 사내가 원미산으로 들어간 것에 대해 ⓒ에게 이유를 묻고, 이에 ⓒ는 확실한 근거를 들어 대답한다.","ⓒ는 사내에 대한 대략적인 신상을 알리고, 이후 ⓑ와 ⓓ에게 사내를 본 적이 있는지 묻는다.","ⓓ는 사내의 가족에게, ⓑ는 사내에게 각각 주목해 대화를 이어 가고, 이와 관련하여 ⓐ는 전반적인 상황을 설명한다."]},"24":{"s":"㉠과 ㉡에 대한 이해로 가장 적절한 것은?","c":["㉠을 기다리는 인물은 ㉡에서 언급되지 않는다.","㉠의 부재는 ㉡ 속 인물에 대한 궁금증을 불러일으킨다.","㉠을 알기 위한 인물의 노력은 ㉡을 통해 다수에게 인정받는다.","㉠을 알 수 없는 상황은 ㉡에 참여한 인물 중 한 명을 통해 해결된다.","㉠이 올 것이라는 확신은 ㉡에 참여한 인물들 모두의 공통된 생각이다."]},"25":{"s":"<보기>를 참고하여 윗글을 감상한 내용으로 적절하지 않은 것은?","c":["‘사내’와 관련된 소문을 둘러싸고 동네 사람들이 대화를 나누는 장면과 사내가 ‘숲을 헤매’는 장면을 대비하여 교차 서술하고 있군.","숲에서 벗어날 수 있음에도 일부러 ‘원을 그리며 맴’도는 사내의 모습에서, 도시로 돌아가지 않으려는 사내의 의도를 확인할 수 있군.","‘두 청년’이 떠난 자리를 바라보며 ‘한 가닥의 빛’이라도 곁에 두기를 원하는 사내의 모습에서, 사회와 단절된 상황에서도 여전히 타인의 존재를 갈망하고 있음을 확인할 수 있군.","숲에 홀로 남아 ‘문갑 위’ ‘손목시계’를 떠올리며 ‘애써 시간을 짐작해 보’는 사내의 모습에서, 관계의 부재로 인한 내면적 고독에서 벗어나고 있음을 확인할 수 있군.","사내의 행방에 대한 대화를 ‘귀신 씻나락 까먹는 소리’라고 평하며 ‘자는 기 남는’ 것이라고 말하는 모습에서, 타인의 삶이 피상적으로 소비되는 세태를 엿볼 수 있군."]},"26":{"s":"(가)와 (나)의 공통점으로 가장 적절한 것은?","c":["인물 간의 대화를 통해 대상의 본질을 밝히고 있다.","성현의 행적을 나열하여 대상의 특성을 구체화하고 있다.","음성 상징어를 활용하여 대상의 움직임을 강조하고 있다.","시공간의 이동에 따라 대상의 변화 과정을 드러내고 있다.","설의적 표현을 사용하여 대상에 대한 인식을 드러내고 있다."]},"27":{"s":"ⓐ～ⓔ에 대한 이해로 적절하지 않은 것은?","c":["ⓐ는 응시자들의 성화를 못 이긴 관리가 정해진 시간보다 일찍 문을 연 상황을 드러내고 있다.","ⓑ는 친척의 도움 없이는 과거에 응시하기 힘든 선비의 처지를 드러내고 있다.","ⓒ는 과제를 먼저 보고 답지를 빨리 작성하려는 응시자들의 마음을 드러내고 있다.","ⓓ는 학식이 부족한 사람에게도 배우려고 하는 현인의 자세를 드러내고 있다.","ⓔ는 그릇된 자세로 학문을 하는 사람들이 많은 세태를 드러내고 있다."]},"28":{"s":"(가)의 내용을 <보기>와 같이 도식화할 때, 이에 대한 이해로 적절하지 않은 것은?","c":["㉠에서 선비가 ‘집안사람 굶을망정 선접량’을 모으는 이유는 ‘과거에 병이 깊’기 때문이겠군.","㉠에서 선비가 ‘아침밥 일찍 먹고 사립문에 붙어 서’ 있는 이유는 ㉡에서 ‘울타리 곁’과 같은 좋은 자리에 앉기 위해서겠군.","㉡에서 글제를 본 선비가 ‘묻는 말 내 알겠냐’라고 한 이유는 ㉠에서 ‘경서를 모르고서 의의를’ 짓는 공부를 했기 때문이겠군.","㉢에서 부형이 ‘천지축 바쳤느냐’라고 묻는 이유는 ㉡에서 선비가 답지를 ‘일찍’ ‘바치’었기를 바랐기 때문이겠군.","㉢에서 집안사람들이 ‘대방주 바삐 빚’는 이유는 ㉡에서 선비가 ‘바닥장이 되’게 답지를 제출했다는 것을 알았기 때문이겠군."]},"29":{"s":"(나)를 통해 알 수 있는 글쓴이의 생각으로 가장 적절한 것은?","c":["공자가 성인인 이유는 예와 음악을 배웠기 때문이다.","아는 것이 많다고 생각하여 남에게 배우기를 꺼려서는 안 된다.","어려운 글자를 잘 기억해 낼수록 뛰어난 견해를 지닌 사람이다.","빼어난 학자로 인정받기 위해 기이한 문장을 발견하려는 노력이 필요하다.","이해하기 어려운 시구를 찾아내어 많은 사람들에게 알리는 데에 힘써야 한다."]},"30":{"s":"<보기>를 바탕으로, [A]에 대해 보인 반응으로 적절하지 않은 것은?","c":["‘연목구어’는 ‘모든 물고기는 나무에 오를 수 없다’라는 명제를 바탕으로 하여 나온 말이겠군.","‘납어’와 ‘점어’의 존재를 몰랐던 사람들은 ‘연목구어’를 ‘결코 할 수 없는 일’의 은유적 표현으로 사용했겠군.","‘납어’와 ‘점어’가 발견된 후 ‘모든 물고기는 나무에 오를 수 없다’라는 명제는 더 이상 사실로 인정받지 못했겠군.","‘납어’와 ‘점어’는 특이한 사례에 해당하므로 ‘나무에서 물고기를 구할 수 없다’라는 진술은 일반화의 오류로 볼 수 없겠군.","‘납어’와 ‘점어’가 ‘예측 불가능한 상황이 실제 발생하는 것’의 의미로 사용된다면 ‘나무에 올라 물고기를 구할 수 있다’라는 진술에는 오류가 없겠군."]},"31":{"s":"<보기>를 참고하여 (가), (나)를 이해한 내용으로 적절하지 않은 것은?","c":["(가)에서 ‘약한 선비 엎어지면’ ‘짓밟고 가는’ 것은 올바른 삶의 도리를 배우지 못한 사람의 행동이겠군.","(가)에서 ‘경제책 아득하니 설폐구폐 무엇인고’라고 하는 이유는 선비의 학문하는 태도가 올바르지 않았기 때문이겠군.","(나)에서 ‘화서와 빙잠’을 알고 있는 사람이 ‘쥐는 불에서 살지 못하고 누에는 얼음에서 기를 수 없다’는 말을 비판하는 것은 진정한 앎을 추구하는 자세라 할 수 있겠군.","(나)에서 ‘무리한 중에 간혹 있는 경우’를 근거로 하여 ‘상리’에 해당하는 것을 비판하는 사람은 중요한 의미를 놓치고 사소한 것에 집착하는 지엽적 태도를 지닌 사람이겠군.","(가)에서 ‘역대사 못 알아도 시부를 능히 짓’는 사람은 급제만을 목표로, (나)에서 ‘서사를 약간 섭렵하’고 ‘잘난 체하’는 사람은 현학적 태도로 학문에 임하는 사람이겠군."]},"32":{"s":"(가)와 (나)의 공통점으로 가장 적절한 것은?","c":["자연물에 빗대어 화자의 움직임을 나타내고 있다.","현재 시제를 사용하여 시적 상황을 드러내고 있다.","하강적 이미지를 통해 계절적 배경을 보여 주고 있다.","의문형 어미를 사용하여 화자의 정서를 강조하고 있다.","명사로 시행을 종결하여 화자의 의지를 부각하고 있다."]},"33":{"s":"[A]～[E]에 대한 이해로 적절하지 않은 것은?","c":["[A] : ‘호구책을 마련하’려 ‘하루 종일’ ‘서성거’리는 것에서 생계를 위해 애쓰는 화자의 모습이 드러난다.","[B] : ‘서로 등을 붙이고’ ‘지내는’ 가족을 ‘측은’하게 여기는 것에서 가족에 대한 화자의 연민이 드러난다.","[C] : 분수가 ‘허공에 / 사직을 내다’ 건다고 표현한 것에서 공중으로 물줄기를 뿜어내는 분수의 모습이 드러난다.","[D] : ‘무지개 생’을 ‘물이 꿈꾸는 또 다른’ 삶으로 표현한 것에서 꿈을 꾸는 주체가 분수임이 드러난다.","[E] : ‘저녁 햇살’이 비치는 ‘벤치 위에’ ‘널브러’져 ‘풋잠’을 자는 것에서 화자가 동경하는 삶의 모습이 드러난다."]},"34":{"s":"<보기>를 참고하여 (가), (나)를 감상한 내용으로 적절하지 않은 것은?","c":["(가)에서 화자가 ‘밤이 되면’ 집으로 ‘돌아’오는 것과, (나)에서 분수가 ‘주렴을 펼’쳤다가 ‘끝없이 거둬들이는’ 것에서 화자가 발견한 반복의 양상을 확인할 수 있군.","(가)에서 화자는 ‘어디서나’ ‘가족이 있’는 곳으로 향하는 자신의 ‘회귀심’에 주목해 가장의 역할을 다하는 자신이 갸륵하고 측은하다는 인식을 드러내는군.","(가)에서 화자는 ‘어둑한 버스 안에서’ ‘끝없는 부드러운 그 손’을 느끼는 것을 통해 고단한 하루를 마친 자신을 포용해 주는 존재가 있다는 인식을 드러내는군.","(나)에서 화자는 ‘분수대의 도로’를 ‘평일 오후 내내’ 바라보는 자신을 ‘푼수’라고 부르는 것을 통해 분수와 같은 삶을 살아야 한다는 인식을 드러내는군.","(나)에서 화자는 ‘쳇바퀴 살림’으로 인해 ‘척추 허물어뜨린 분수’에 주목해 반복을 지속하는 것이 지겨운 삶일 수도 있다는 인식을 드러내는군."]}},"27-9모평":{"18":{"s":"한 소년에 대한 이해로 적절하지 않은 것은?","c":["상이 태학사 관직을 내려 주는 인물이다.","여러 신하가 훌륭한 인재로 평가하는 인물이다.","과거 시험장에서 김희경과 나란히 호명되는 인물이다.","설낭이 장 소저와는 별개의 사람으로 인식하는 인물이다.","김생이 북해에서의 일을 떠올리는 계기가 되는 인물이다."]},"19":{"s":"㉠～㉢을 중심으로 윗글을 이해한 내용으로 가장 적절한 것은?","c":["길에서 구경하는 사람들은 ㉠의 희소성에 놀라며 기뻐했다.","김희경이 동의했기 때문에 ㉢이 이루어질 수 있었다.","영춘이 ㉠을 인식한 것은 장 소저가 ㉡을 실현하는 동기가 되었다.","장 소저는 ㉡을 하기 위하여 김희경과 함께 ㉠을 이루었다.","상은 ㉡을 수행한 인물의 간청을 받아들여 ㉢이 이루어지도록 하였다."]},"20":{"s":"‘남복 입기’와 관련하여, [A], [B]의 ‘장 소저’를 이해한 내용으로 가장 적절한 것은?","c":["[A]에서는 세상 사람들이 자신의 남복 입기를 허락했음을 자부하고 있다.","[B]에서는 자신이 남복 입기를 중단하면 사람들이 이를 애석하게 여길 것이라 예상하고 있다.","[A]에서는 처음으로 남복 입기를 시작할 것을, [B]에서는 중단했던 남복 입기를 재개할 것을 고민하고 있다.","[A]에서는 남복 입기를 과거 응시를 위한 조건으로, [B]에서는 남복 입기를 관직 유지를 위한 조건으로 간주하고 있다.","[A]와 [B]에서는 모두, 남복 입기를 두고 부친을 향한 윤리적 의무와 자신을 위한 사회적 성취 사이에서 갈등하고 있다."]},"21":{"s":"<보기>를 참고하여 윗글을 감상한 내용으로 적절하지 않은 것은?","c":["장 소저가 급제한 것을 보고 영춘이 기뻐한 것은, 주인의 성취에 대해 반가운 감정을 표출하는 것이라는 점에서, 영춘이 장 소저에게 정서적으로 밀착되어 있음을 보여 주는군.","장 소저가 영춘의 질문에 근심하지 말라고 한 것은, 시비의 역할을 보호와 수발로 제한하려는 규범적 태도가 드러난 것이라는 점에서, 신분적 위계에서 오는 한계를 보여 주는군.","영춘이 외람됨을 알고도 주인을 ‘상공’이 아닌 ‘소저’로 부른 것은, 진심에 따른 행동을 주인이 존중했기에 가능했다는 점에서, 그들의 주종 관계가 경직되지 않았음을 보여 주는군.","영춘이 장 소저에게 여성임을 밝히라고 조언한 것은, 사회적 지위가 바뀌는 선택을 권유하는 것이라는 점에서, 시비가 주인의 삶의 중요한 결정에 개입하는 것을 보여 주는군.","장 소저가 영춘의 말에 깨달음을 얻고 칭찬한 것은, 주인이 시비가 한 말의 가치를 인정하는 것이라는 점에서, 그들이 서로 존중하며 소통하는 것을 보여 주는군."]},"22":{"s":"(가)～(다)에 대한 설명으로 가장 적절한 것은?","c":["(가)는 (나)와 달리, 의외의 상황에 의아함을 표현하면서 시상 전개를 시작하고 있다.","(나)는 (가)와 달리, 감탄의 표현을 활용하여 고조된 감정을 드러내고 있다.","(나)는 (다)와 달리, 현재와 미래의 상황을 대비하여 인식의 변화를 강조하고 있다.","(다)는 (나)와 달리, 특정 상황을 가정하여 변화된 시대상에 대해 비판적 태도를 드러내고 있다.","(가), (나), (다)는 모두, 자연물을 활용하여 현실을 잊고자 하는 의지를 강조하고 있다."]},"23":{"s":"[A]에 관한 이해로 적절하지 않은 것은?","c":["‘그럴 즈음’은, 만월을 보고 있는 상황에서 시간이 어느새 낮으로 바뀌었음을 지각하는 순간을 가리키고 있군.","‘대낮’은, ‘잡티 하나 없는 고요의’ 상태로서 지극히 밝으면서도 조용한 상태임을 보여 주고 있군.","‘훤히’는, 시적 공간에 있는 대상들이 투명할 만큼 명료하게 드러나는 상황임을 나타내고 있군.","‘바닥’은, 자신의 내면으로 침잠하는 존재가 이를 수 있는 잠잠한 상태를 형상화하고 있군.","‘귀 먹먹하고 숨 갑갑하다’는, 특정한 시적 공간에 놓이게 되었을 때 일어날 수 있는 신체적 반응을 표현하고 있군."]},"24":{"s":"<보기>를 참고하여 (가), (나)를 감상한 것으로 적절하지 않은 것은?","c":["(가)에서 ‘아뜩한 기쁨’인 ‘그 빛’은, ‘눌러 덮은 오랜 자국’을 지닌 가오리가 비상하여 ‘희디흰 배때기’를 드러낼 때 나타난다는 점에서, 자유로운 생명력에 대한 화자의 환희로 볼 수 있군.","(가)에서 ‘천 마리 가오리들이 날아다’니는 남산은, ‘등짝 검은 가오리’가 ‘뒤틀’린 소나무들 사이로 날아다닌다는 점에서, 환상적이면서 어두운 바다의 이미지로 볼 수 있군.","(나)에서 ‘큰 사과’가 ‘깎이고 있네요’는, 골목을 도는 것을 사과 깎기로 보는 상상이 전제된다는 점에서, 마을이 ‘큰 사과’라는 상상의 공간으로 전환되고 있음을 보여 주는군.","(가)에서 ‘삼층석탑 옥개석’이 ‘지느러미’를 펼치는 것과 (나)에서 ‘그 사람’이 ‘천 년 동안’ ‘아가인’ 것은, 각각의 시적 형상이 실재와는 다른, 창조된 현실임을 보여 주는군.","(가)에서 ‘팔뚝’이 ‘불거진다’는 것과 (나)에서 ‘한 송이 구름’이 ‘손등을 덮어주’는 것은, 각각 활력과 위로의 이미지를 상상한 화자의 긍정적 시각을 보여 주는군."]},"25":{"s":"(다)에 대한 이해로 적절하지 않은 것은?","c":["‘도(道)는 털끝만한 차이로도 나뉘는 법’이라고 하는 데에는, 도를 드러낼 수 있다면 사소해 보이는 것도 소홀히 다루어서는 안 된다는 생각이 반영되어 있다.","‘이명’이 있는 사람이 다른 사람에게 소리를 들어 보라고 하는 데에는, 그 소리가 다른 사람에게도 들릴 것이라는 생각이 반영되어 있다.","‘자기만이 홀로 아는 경우’가 생기는 데에는, 다른 사람이 자신보다 아는 것이 많아지는 경우를 부정적으로 보는 관점이 반영되어 있다.","‘말해 무엇 하겠는가’에는, 자신이 아는 것을 남이 알아주지 않을까 봐 근심하는 정도가 글을 짓는 사람의 경우에 더 심할 것이라는 생각이 반영되어 있다.","‘기와 조각이나 돌멩이 같은 것이라도 버리지 않는다면’에는, 글 읽는 사람이 거창하지 않은 것에서도 진실을 찾을 수 있다고 보는 관점이 반영되어 있다."]},"26":{"s":"다음은 수업 활동의 일부이다. 학생의 답변 내용으로 적절하지 않은 것은?","c":["㉮의 작가의 상황은 [C]에서 아이의 귀가 ‘왜앵’하고 울리는 것","㉯의 독자의 상황은 [C]에서 동무가 ‘아무 소리도 듣지 못’한 것","㉰의 작가의 상황은 [C]에서 아이가 ‘소리를 지르’는 것","㉱의 독자의 상황은 [C]에서 남이 시골 사람을 ‘흔들어 깨우’는 것","㉲의 작가의 상황은 [C]에서 시골 사람이 ‘그런 적 없’다고 말하는 것"]},"27":{"s":"㉠～㉤에 대한 이해로 가장 적절한 것은?","c":["㉠은 소나무가 펴지는 듯한 이미지와 만월이 뜨는 이미지를 연결하여 형상화한 표현이다.","㉡은 대상의 움직임에 대한 화자의 안타까움을 드러내는 표현이다.","㉢은 계절의 풍요로움과 이와 대비되는 화자의 불안을 함께 암시하는 표현이다.","㉣은 시원스러운 움직임을 꾸준하게 이어 가는 할머니의 모습을 묘사한 표현이다.","㉤은 앞서 제시된 일화에 대한 글쓴이의 찬탄을 드러내는 표현이다."]},"28":{"s":"윗글에 대한 이해로 적절하지 않은 것은?","c":["판옥은 삼룡이 거주하는 집의 상태가 형편없다는 것이 사실인지에 대한 의구심을 드러냈다.","판옥은 삼룡이 돌아와도 반갑게 맞아 줄 사람이 없을 것이라고 삼룡에게 전했다.","판옥의 처는 집에 들어오는 판옥의 모습을 보고 누구로부터 연락이 왔는지 짐작했다.","판옥의 처는 자신이 알고 싶어 하는 내용을 곧바로 전달해 주지 않는 남편에게 갑갑함을 드러냈다.","판옥의 처는 땅이 풀리지 않아 농사일을 하지 못하고 있는 삼룡이네의 처지를 안타깝게 여겼다."]},"29":{"s":"[A]～[E]에 대한 설명으로 가장 적절한 것은?","c":["[A]에서 인물이 궁금해하는 내용에 대한 답은 [E]에서 나타난다.","[B]에서 인물이 자신의 삶에 대해 자조적인 태도를 보이는 이유는 [C]에서 확인된다.","[C]에서 인물이 알고 있던 정보가 실상과 다르다는 것은 [D]에서 드러난다.","[D]에서 간접 인용을 통해 전달된 인물의 상황은 [A]에서도 확인된다.","[E]에서 인물이 관용 표현을 사용해 대화 상대를 책망하는 일은 [B]에서도 나타난다."]},"30":{"s":"㉠～㉢의 서사적 기능에 대한 설명으로 가장 적절한 것은?","c":["㉠은 발신인의 처지에 대한 수신인의 동정심을 환기하여, 수신인과 발신인 가족 사이의 긴장감을 완화한다.","㉡은 발신인의 입장을 수신인에게 전달하여, 수신인이 결정을 번복하는 계기가 된다.","㉢은 발신인이 회사에 전한 내용을 수신인에게 알려, 회사와 수신인 사이의 갈등을 고조한다.","㉠은 ㉡, ㉢과 달리 발신인 가족의 안부를 수신인에게 전달하여, 수신인이 가지고 있던 근심을 해소하는 실마리가 된다.","㉠, ㉡, ㉢은 모두, 수신인이 몰랐던 정보를 전달하여, 수신인이 새로운 장소에 정착하면서 겪는 갈등을 심화한다."]},"31":{"s":"<보기>를 바탕으로 윗글을 감상한 내용으로 적절하지 않은 것은?","c":["판옥이 ‘고향이 대체 무슨 쓸데’가 있냐며 ‘정답던 고향’에 대해 이제는 ‘그만 정이 뚝 떨어’졌다고 한 데서, 인물이 애착을 가졌던 고향에 대해 환멸을 느끼고 있음을 알 수 있군.","판옥이 더 이상 ‘고향의 참혹한 꼴’을 보고 싶어 하지 않으며 ‘고향에서 쫓겨’난다고 한 데서, 인물이 고향의 상황 변화로 인해 어쩔 수 없이 타관으로 이주하려는 것임을 알 수 있군.","판옥이 삼룡에게 ‘또 모이게 될지 누가 알 것인가’라고 한 데서, 인물이 떠날 수밖에 없는 비참한 처지에도 삶의 터전을 함께 마련하기 위한 용기를 드러내고 있음을 알 수 있군.","판옥이 ‘가슴이 답답’하여 ‘할 말’을 다 못하고, 삼룡이 ‘굵은 눈물방울’을 ‘뚝뚝 떨어’뜨리는 데서, 고향 상실을 맞닥뜨린 인물들이 비애를 느끼고 있음을 알 수 있군.","삼룡이 어디서든지 자신이 ‘발을 딛고 살아가는 곳’을 ‘고향으로 만’들자고 한 데서, 뿌리내릴 수 없는 삶에도 불구하고 인물이 살아 내기 위한 의지를 다지고 있음을 알 수 있군."]},"32":{"s":"㉠～㉤을 설명한 내용으로 적절하지 않은 것은?","c":["㉠은 계절적 배경을 제시하여, 화자의 적적한 정서를 부각하고 있다.","㉡은 새로 마련한 공간의 특징을 밝혀, 화자의 불편함이 완화됨을 드러내고 있다.","㉢은 의문형 종결 표현을 통해, 화자의 안타까운 심정을 강조하고 있다.","㉣은 고사를 바탕으로 상황을 가정하여, 화자의 바람을 드러내고 있다.","㉤은 임을 자연물에 비유하여, 화자와 임의 정서적 유대감이 심화됨을 나타내고 있다."]},"33":{"s":"꿈을 중심으로 [A]를 이해한 내용으로 가장 적절한 것은?","c":["‘연잎으로 옷을 짓고’에는 꿈에서 임에게 전할 물건을 현실에서 마련하고자 하는 연정이 드러난다.","‘눌 위하여 단장할꼬’에는 꿈에서와 달리 현실에서는 누구를 위해 단장해야 할지 몰라서 느끼는 혼란이 드러난다.","‘말소리 울리는 듯’에는 꿈에서의 경험이 현실에서도 이어지는 듯한 착각이 드러난다.","‘귓가에 완연하고’에는 꿈에서 함께한 임이 현실에서도 자신을 위로하는 데 대한 고마움이 드러난다.","‘생시로 삼을런가’에는 꿈에서 경험한 임과의 만남을 현실에서는 이루지 못하고 있는 데 대한 애절함이 드러난다."]},"34":{"s":"<보기>를 바탕으로 윗글을 감상한 내용으로 적절하지 않은 것은?","c":["화자가 ‘주자의 경서’를 펼쳐 보는 한편 ‘고각’에 있는 책을 염려하는 데서, 자유롭지 못한 유배지에서도 사대부로서의 정체성을 잃지 않으려 애쓰는 모습을 엿볼 수 있군.","화자가 ‘천지간 홀로’ 있는 낯선 섬에서 ‘다시 의지’할 대상이 ‘우리 임’밖에 없음을 강조하는 데서, 임금과 함께했던 과거를 그리워하는 태도를 엿볼 수 있군.","화자가 ‘내 신세 홀몸’임을 임이 모르지 않을 것이라 추측하고 ‘왕께서 고쳐 헤아리길’ 염원하는 데서, 임금의 새로운 정치적 판단을 소망하는 모습을 엿볼 수 있군.","화자가 ‘옛 허물’을 헤아리며 ‘망령됨’이 죄라고 밝히는 데서, 자신이 죄를 저지른 동기를 부끄러워하는 심적 고통을 엿볼 수 있군.","화자가 자신을 ‘가을 부채’에 빗대며 ‘광주리’에서 벗어날 때를 몰라 한탄하는 데서, 유배객으로서의 삶이 언제 끝날지 알 수 없기에 느끼는 불안감을 엿볼 수 있군."]}},"26-10학평":{"18":{"s":"(가)~(다)에 대한 설명으로 가장 적절한 것은?","c":["(가)는 (나)와 달리 음성 상징어를 사용하여 중심 제재의 역동적인 측면을 부각하고 있다.","(나)는 (다)와 달리 어조의 변화를 통해 현실 극복의 의지를 강조하고 있다.","(가), (다)는 (나)와 달리 의문의 형식을 활용하여 주제 의식을 드러내고 있다.","(나), (다)는 (가)와 달리 공간을 감각적으로 묘사하여 대상이 환기하는 정서를 구체화하고 있다.","(가)~(다)는 모두 과거와 현재를 대비하여 미래에 대한 낙관적 인식을 나타내고 있다."]},"19":{"s":"(가)에 대한 이해로 적절하지 않은 것은?","c":["1연에서 ‘이제’는 ‘철없이 주걱주걱 흐르던 눈물’로 표현된 감정이 ‘잘게 부서져서’ 해소되고 있다고 인식하는 시점이다.","1연에서 ‘기쁨’과 ‘슬픔’은 ‘반반씩 버무린 색깔’로 어우러지고‘반반씩 한꺼번에 녹아 흐르’는 것으로 형상화되어 감정의 복합적인 양상을 드러낸다.","1연에서 ‘가닥가닥 꼬여 넝쿨져 뻗는 것이 / 참 예사스러운 일이 아니’라고 판단하는 것은 2연에서 ‘밑뿌리’의 외양을 ‘절제 없’는 것으로 평가하게 되는 근거이다.","3연의 ‘또’는 ‘구름이 내 머리 위 평발을 밟고 가나 보다’와 같은 추측이 1연에서 제시된 ‘구름의 나들이가 보기 좋은 날’과의 유사성에 기반한 것임을 드러낸다.","1연의 ‘구슬 같은 소리’는 3연에서 ‘파란 옥빛 구슬 / 꺼내 드는 은은한 소리’로 구체화되면서 감정의 ‘물결’이 가라앉고 평온해진 내면의 상태를 드러낸다."]},"20":{"s":"㉠과 ㉡에 대한 이해로 가장 적절한 것은?","c":["㉠은 화자가 처한 상황이 전형적이지 않음을 부각하는 반면 ㉡은 글쓴이가 제시한 상황의 보편성과 결부된다.","㉠은 상황에 대한 화자의 기대를 강화하는 반면 ㉡은 상황에 대한 글쓴이의 관점이 변화하는 계기로 작용한다.","㉠은 화자가 행동의 제약에서 벗어나기 위한 조건에, ㉡은 글쓴이가 내적 갈등을 해소하기 위한 수단에 해당한다.","㉠과 ㉡은 모두 행동 변화의 동기를 자극하는 매개체이다.","㉠과 ㉡은 모두 정서에 조응하는 시간적 배경으로 기능한다."]},"21":{"s":"<보기>를 바탕으로 (가)~(다)를 감상한 내용으로 적절하지 않은 것은?","c":["(가)의 화자가 ‘등나무 아래 기대어 서서’ 본 후 내면의 변화를 의식하고 (나)의 화자가 ‘어둠이 보일 때까지’ ‘어둠의 내부를 들여다보’는 것은, 물리적 시각의 차원과 정신적 차원을 포괄하는 응시의 양상을 드러내는 것이겠군.","(다)의 글쓴이가 ‘문에 구멍을 뚫고 살펴보는 것’에 이어 ‘마음으로 비춰 봐야 하는 것’에 대해 설명하는 것은 응시가 다층적인 행위임을 드러내는 것이겠군.","(나)의 화자가 ‘오래오래’ 들여다봄으로써 ‘어둠 속의 무수한 빛과 색깔이 / 내 눈을 발견’한다고 한 것은 응시의 주체와 대상 간의 관계를 새로이 정립하였음을 드러내는 것이겠군.","(가)의 화자가 자신의 내면과 ‘지등의 불빛’ 간의 유사성에 주목하고 (다)의 글쓴이가 ‘빛이 널리 퍼져 정기가 흩어지’는 것을 경계하는 것은, 응시를 통해 포착한 대상의 속성에 비추어 내면을 성찰하였음을 드러내는 것이겠군.","(가)의 화자가 ‘큰 둥치를 이루는 것’에서 인간의 삶을 떠올리고 (나)의 화자가 ‘보잘것없는 물건들’이 ‘낮은 빛을 / 조금씩 끊임없이 나누던’ 모습을 발견하는 것은, 응시를 통해 얻은 깨달음의 내용을 드러내는 것이겠군."]},"22":{"s":"소완(素玩)에 대한 글쓴이의 견해로 가장 적절한 것은?","c":["사물을 가까이에서 관찰하면서 대상의 외형적 특징을 탐구하는 것이다.","일정한 거리를 유지하며 대상의 전모를 집약함으로써 핵심을 이해하는 것을 궁극적인 목표로 한다.","정돈된 마음으로 집중하여 대상을 감각적으로 인식함으로써 그 진수를 파악하는 것이다.","대상의 본질을 깨닫기 위해 내면을 비워 선입견을 배제하는 구체적인 방법을 탐색하는 과정이다.","사사로운 마음이 없는 상태에서 대상을 있는 그대로 받아들임으로써 본질을 파악하는 경지이다."]},"23":{"s":"윗글에 대한 설명으로 가장 적절한 것은?","c":["시선의 이동을 따라 특정 계절의 풍속을 묘사하고 있다.","역사적 인물들을 호명하여 회고적 분위기를 조성하고 있다.","특정 시간대를 드러내는 자연물을 활용하여 감흥을 표현하고 있다.","주변의 사물에 감정을 투영하여 세태를 우회적으로 비판하고 있다.","외부 세계와 내면을 대비하여 현실에 대응하는 태도의 변화를 드러내고 있다."]},"24":{"s":"㉠~㉤을 이해한 내용으로 적절하지 않은 것은?","c":["㉠ : ‘청산’의 변화를 인간사에 대응하여 본연의 모습을 잃은 자연에 대한 한탄을 표출하고 있다.","㉡ : 눈 내린 풍경을 ‘조물주’가 빚어낸 결과로 인식하여 그 변화의 다채로움에 감탄하고 있다.","㉢ : ‘까마귀’에 주목하여 눈앞의 정경이 지닌 조화로움이 유지되지 못할 것을 우려하고 있다.","㉣ : ‘바위’의 형상에서 비롯된 가정적 상황을 제시하여 대상에 생명력을 부여하고 있다.","㉤ : 의향을 묻는 말을 통해 ‘밝은 기운’을 누리고 싶다는 뜻을 드러내고 있다."]},"25":{"s":"ⓐ와 ⓑ에 대한 이해로 가장 적절한 것은?","c":["ⓐ와 ⓑ는 모두 상상 세계에 도달하게 해 주는 매개체로 인식된다.","ⓐ와 ⓑ는 모두 과거에 겪었던 경험을 떠올리게 하는 계기로 인식된다.","ⓐ는 ⓑ와 달리 삶의 유한성을 자각하여 세속과 단절하려는 의지를 드러내는 수단으로 인식된다.","ⓑ는 ⓐ와 달리 기다리던 시기가 도래했음을 알려 주는 표지로 인식된다.","ⓐ는 외부의 도움을 얻지 못하는 처지를, ⓑ는 현실의 제약에서 벗어날 가능성을 확인하게 하는 원인으로 인식된다."]},"26":{"s":"<보기>를 바탕으로 윗글을 감상한 내용으로 적절하지 않은 것은?","c":["눈 위의 ‘말발굽 찍힌 자국’과 ‘새 발자국’을 보며 ‘은잔’과 ‘글자’를 떠올리는 것은, 현실의 일상 공간에서 정경을 낯설게 하는 요소를 발견한 것이겠군.","‘집마다 옥실이요 뜨락마다 옥섬돌’이라고 한 것은, 익숙한 공간이 눈으로 덮인 모습을 옥으로 이루어진 비현실적인 정경으로 재인식한 것이겠군.","‘그윽한 흥’이 깊어 ‘바닥 없는 신을 신고 눈 속을 배회하’는 것은, 설경을 바라보는 데 머무르지 않고 그 속을 거닐며 흥취를 누리는 행위를 상상한 것이겠군.","‘어렴풋한 세상은 어디에 숨었는’지 궁금해하는 것은, 현실 공간을 기반으로 상상한 천상 세계에 다다르지 못하는 안타까움을 드러낸 것이겠군.","‘북두 신선’에게 ‘신선주’를 권한 후 ‘나도 한 잔 부어 마’시겠다는 것은, 천상의 존재와 교유하고 싶다는 소망을 표출한 것이겠군."]},"27":{"s":"윗글의 서술상 특징으로 가장 적절한 것은?","c":["시간의 순서를 뒤바꾸어 이야기의 인과 관계를 재구성하고 있다.","이야기 외부의 서술자가 인물들의 대비된 입장을 드러내고 있다.","추측이 담긴 진술을 통해 인물과 사건에 대한 주관적 인식을 드러내고 있다.","상징적 소재를 반복적으로 제시하여 갈등 해결의 실마리를 암시하고 있다.","여러 인물의 내적 독백을 나열하여 인물의 성격을 입체적으로 보여 주고 있다."]},"28":{"s":"윗글에 대한 이해로 적절하지 않은 것은?","c":["‘강 씨’는 동네 사람들 중 일부가 외등 설치 비용을 안 낸 이유를 밝히지 않겠다고 하였다.","동네 사람들은 두 번째 외등이 설치될 때 ‘강 씨’와는 다른 태도를 보였다.","외등을 두 번이나 도둑맞은 후에도 ‘강 씨’는 동네의 문제를 해결한다는 명목으로 비용을 걷었다.","‘강 씨’의 집에 몰려간 동네 사람들은 ‘강 씨’의 의사와 관계없이 집 안으로 들어갔다.","‘강 씨’는 동네를 떠나기로 한 이후 길에서 만난 ‘나’를 모르는 척하였다."]},"29":{"s":"㉠과 ㉡에 대한 이해로 가장 적절한 것은?","c":["㉠은 자신이 입은 피해에 대한 억울함을, ㉡은 변명으로 일관하는 상대방에 대한 답답함을 호소하는 말이다.","㉠은 상식에 비추어 현재 일어난 일을 부당한 것으로, ㉡은 상대방의 말을 되받아 자신의 행위를 정당한 것으로 규정하는 말이다.","㉠은 지금 벌어진 것과 유사한 일이 앞으로도 반복될 것임을, ㉡은 이미 정해진 결정에 따라 자신이 취할 행동을 예고하는 말이다.","㉠은 주변 환경의 특성을 고려하여 현재 일어난 일을 당연한 것으로, ㉡은 다수의 견해를 내세워 자신의 요구를 필연적인 것으로 간주하는 말이다.","㉠은 자신의 부주의로 인해 벌어진 일에 대한 책임을 주변 사람들에게, ㉡은 자신의 오해로 인해 벌어진 일에 대한 책임을 상대방에게 전가하는 말이다."]},"30":{"s":"<보기>를 바탕으로 윗글을 감상한 내용으로 적절하지 않은 것은?","c":["강 씨가 ‘대번에 이웃 간에 유지로 올라’선 것은, 집단에게 이익을 가져다준 강 씨의 행위로 인해 집단의 우호적 정서가 형성되었음을 보여 주는군.","‘뒷소문’이 퍼지기 시작하고 ‘가나 오나 그 사람 욕’을 하는 것은, 강 씨에 대한 집단의 정서가 부정적으로 전환되어 굳어지는 모습을 보여 주는군.","강 씨가 점점 ‘철면피해지고 악착스러워’가는 것은, 집단의 정서가 이를 인식하지 못하는 사람에게도 영향을 미칠 수 있음을 보여 주는군.","강 씨가 ‘수도 신청 용지’를 돌리는 등의 노력을 했음에도 사람들이 ‘우르르 몰려’가 그를 쫓아내려 한 것은, 집단의 정서가 합리적인 방향으로만 작동하는 것은 아님을 보여 주는군.","강 씨의 아내가 ‘서럽게 울음을 터뜨’리고 강 씨가 ‘급하게 집을 내놓’은 것은, 집단의 정서로 인해 개인이 집단의 새로운 구성원으로 인정받지 못하는 양상을 보여 주는군."]},"31":{"s":"윗글의 내용에 대한 이해로 적절하지 않은 것은?","c":["숙영은 선군에게 정해진 기한 동안 자신을 기다려 달라고 부탁했다.","선군은 동별당에서 나는 울음소리에 크게 놀라 중문으로 달려갔다.","선군은 상공의 만류에도 불구하고 길을 재촉하여 임 진사 집을 그냥 지나쳤다.","상공은 선군이 서울로 떠난 후에 숙영의 방에서 난 인기척을 듣고 의혹을 품었다.","선군의 부모는 병든 선군을 위해 백방으로 약을 썼으나 그의 병세는 전혀 차도가 없었다."]},"32":{"s":"㉠과 ㉡에 대한 이해로 가장 적절한 것은?","c":["㉠과 ㉡은 모두 꿈을 꾼 주체가 꿈속에 나타난 인물의 진의를 의심하는 계기가 된다.","㉠과 ㉡은 모두 꿈을 꾼 주체가 꿈속에 나타난 인물이 하는 말에 따르는 계기가 된다.","㉠과 ㉡은 모두 꿈을 꾼 주체가 꿈속에 나타난 인물의 정체에 대해 의문을 갖는 계기가 된다.","㉠은 꿈을 꾼 주체가 꿈속에 나타난 인물을 그리워하는, ㉡은 꿈을 꾼 주체가 꿈속에 나타난 인물의 안위를 걱정하는 원인이 된다.","㉠은 꿈을 꾼 주체가 꿈속에 나타난 인물과의 만남을 유보하는, ㉡은 꿈을 꾼 주체가 꿈속에 나타난 인물이 겪게 될 위험을 예감하는 원인이 된다."]},"33":{"s":"[A]와 [B]에 대한 설명으로 가장 적절한 것은?","c":["[A]와 [B]에서는 모두 상대가 저지른 행위의 부당함을 지적하며 상대에게 자신의 요구 사항을 전달하고 있다.","[A]와 [B]에서는 모두 상대의 지위를 근거로 상대가 스스로의 역할에 부합하는 결정을 내릴 것을 유도하고 있다.","[A]에서는 상대의 의중을 가늠하고자 진실을 은폐하고 있고, [B]에서는 상대를 안심시키고자 상황을 과장하고 있다.","[A]에서는 상대로 인해 변화된 상황이 자신에게 미칠 이익을 숨기고 있고, [B]에서는 상대의 행동이 자신에게 미칠 수 있는 부정적인 영향을 언급하고 있다.","[A]에서는 자신이 알고 있는 정보를 언급하며 상대의 의사를 확인하고 있고, [B]에서는 자신이 가정한 상황을 언급하며 상대의 태도 변화를 요청하고 있다."]},"34":{"s":"<보기>를 바탕으로 윗글을 이해한 내용으로 적절하지 않은 것은?","c":["‘옥연동’에서 ‘귀양살이’하는 숙영이 선군의 ‘병이 위중한 것’을 알고 ‘세 가지 약’을 건네준 것에서, 숙영이 초월적 능력을 지닌 천상의 존재임을 알 수 있군.","‘하늘’에서 내려온 ‘한 선녀’가 한 말을 기억하고 있음에도 선군에게 ‘그 낭자는 생각하지 말’라고 한 것에서, 백 상공이 하늘이 정한 운명을 인정하지 않는 인물임을 알 수 있군.","‘낭자와 맺은 언약’을 파기하도록 선군에게 종용한 것에서, 숙영의 장래를 염려한 백 상공이 세속적 가치관을 토대로 당면한 문제의 해결책을 모색하였음을 확인할 수 있군.","‘부모가 구혼’한 결혼을 통해 ‘부모를 영화롭게 하는 것’이 ‘자식 된 도리’라고 여기는 것에서, 백 상공이 가부장적 사고방식을 지닌 인물임을 알 수 있군.","‘경계하는 말’이 ‘망극하고 답답한 일’을 초래한 것에서, 유교 윤리에 따라 가문의 명예를 우선시한 백 상공의 가치관이 숙영과 선군의 사랑에 장애로 작용했음을 확인할 수 있군."]}}};
const NOTES = {"공간의 의미|26-19-3":[["게서 또 후다닥 빼 놓은 것이 함경도 ㉢ 세수람 고개에다 덜럼 올라앉어 장담을 허것다","{{내 용맹이나 된 게 여기까지 살아왔지}}"],"호랑이는 ㉢에서 살아남은 것을 자기 용맹 덕분이라고 장담한다. 따라서 '뜻밖의 행운'이라고 여겼다고 볼 수 없다."],"우화|26-21-0":[["자라가 호랑이란 말을 듣고서 겁짐에 바로 일러 나는 명색이 자라 새끼요"],"호랑이, 자라, 토끼가 사람처럼 말하고 생각한다. 동물 이야기에 사람 세상을 빗댄 우화에서 출발한 작품이라는 설명이다."],"판소리 사설과 장단|26-21-0":[["{{[엇모리]}} 범 내려온다 범이 내려온다 송림 깊은 골로 한 짐승이 내려온다","{{[휘모리]}} 호랑이 몽그랏다 후다닥 뛰어갈 제"],"장단 표시와 창·아니리가 번갈아 나오는 것이 판소리 사설의 표지다. 호랑이가 등장할 때는 엇모리, 달아날 때는 가장 빠른 휘모리로 부른다."],"중첩|26-21-1":[["사냥개라 허는 것은 같은 우리 모족(毛族)으로 {{사람 집에 기식허니}} 제 무슨 아첨으로 내 잘 맡는 자랑허여"],"사람에게 길들여진 현실의 사냥개가 우화 속 토끼의 말에 겹쳐진다. 강자에게 붙어 이익을 얻는 인간을 비판하므로 적절하다."],"풍자·비판|26-21-1":[["사냥개라 허는 것은 같은 우리 모족(毛族)으로 사람 집에 기식허니 {{제 무슨 아첨으로}} 내 잘 맡는 자랑허여","층암절벽 찾고 찾어 들어와 {{동제 간 살해만 허니}}"],"토끼는 사냥개가 아첨으로 사람 곁에 붙어 같은 모족을 해친다고 꼬집는다. 강자의 환심을 사는 인간에 대한 비판으로 볼 수 있으므로 적절하다."],"위선|26-21-2":[["별주부 듣고 기가 막혀 이 급살 맞어 죽을 놈이 {{동의보감을 얼마나 통달허였는지}} 보는 대로 약 취해 먹기로만 드니","두꺼비 같으면 더욱 좋다 너를 산 채로 불에 살라 술에 타 먹었으면 만병회춘 명약이라니 너를 먹으리라"],"호랑이는 약효를 늘어놓으며 자라를 먹겠다는 속내를 그대로 드러낸다. 숨기는 것이 없으므로 '속내를 지식을 내세워 숨기는' 위선으로 볼 수 없다."],"위계질서|26-21-3":[["호랑이가 {{수령}} 말을 듣더니마는 거두룸을 피우며","나도 배부른 꼴을 보련마는 {{일등 포수}}가 따러다녀 어설피 물랴다가 조총에 불이 번듯 탄환이 쑥 나오면 거 내 신세는 어쩔 것이냐"],"'수령'으로 대접받던 호랑이가 포수를 두려워하는 속내를 털어놓는다. 위계의 꼭대기에 있는 존재가 위신을 잃는 장면이므로 적절하다."],"과장|26-21-5":[["전라도 {{해남에서 냅다 뛴 놈이 의주 압록강 가에서}} 숨을 내쉬고"],"해남에서 압록강까지 한숨에 뛰었다는 것은 현실에서는 불가능하다. 실제 지명을 끌어와 부풀렸으므로 적절하다."],"시적 분위기 조성|26-22-1":[["우리는 이 {{저녁}}을 떠돌고 있는가","우리는 이 {{새벽}}길 숨가쁘게 넘고 있는가"],"'저녁', '새벽', '밤'은 시간을 나타낼 뿐 계절을 나타내지 않는다. 따라서 계절을 나타내는 소재로 분위기를 조성한다고 볼 수 없다."],"관조|26-22-2":[["사랑이 끝났기로서니","그리움마저 사라지랴,","{{봐 봐}}, 시방은 ⓒ 청설모가","쪼르르 타고 내려오네."],"(나)의 화자는 감나무를 바라보지만 '사랑', '그리움', '기다림'을 대상에 겹쳐 놓고, '봐 봐'처럼 말을 건넨다. 따라서 자연을 관조한다고 볼 수 없다."],"탈속적 태도|26-22-2":[["그 기다림 날로 익으니","서러움까지 익어선"],"자연이 배경이라는 것만으로 탈속적 태도가 되지는 않는다. (나)는 이별 뒤의 그리움과 기다림이 익어 가는 과정을 노래한다. 따라서 탈속적 태도로 바라본다고 볼 수 없다."],"세태 비판|26-22-3":[["최립은 좋은 소리를 내는 사람에 가깝다. 그의 문장이 비록 완성된 것은 아니지만 그 뜻은 바름을 향한다."],"(다)는 최립의 문장을 평가하고 학업을 당부하는 글이다. 세상 사람들의 풍조를 문제 삼는 대목이 없으므로 세태를 비판한다고 볼 수 없다."],"연쇄적 표현|26-22-4":[["목메이게 부르짖다 {{잦아드는}} 때가 있다","{{잦아드는}} ㉡ 외마디 소리를 찾아 칼날 세우고","쓸모 있는 소리에는 {{아름다운 소리}}와 추한 소리가 있다.","{{아름다운 소리}}에는 실상이 있는 소리가 있고 흩어지는 소리가 있다."],"두 작품 모두 앞말을 이어받는 연쇄는 있다. 그러나 (가)는 그리운 이를 찾는 행동을, (다)는 소리의 갈래를 차례로 나눌 뿐 주체의 태도가 바뀌는 과정을 보여 주지 않는다. 따라서 적절하지 않다."],"가정적 표현|26-22-5":[["저 짙푸른 감들, 마침내","형형 등불을 {{밝힐 것이라면}}","세상은 어찌 환하지 않으랴.","초목은 움직이지 않으면 그 자체로 소리가 나지 않으나 {{바람이 불면}} 소리가 난다."],"(나)는 감이 등불을 밝힌다는 가정으로 감의 성숙을, (다)는 '-면'으로 초목이 소리를 내는 조건을 밝혀 대상의 속성을 드러낸다. 따라서 적절하다."],"표상|26-23-0a":[["사방을 둘러보아도","등불 하나 켜 든 이 보이지 않고","함께 어둠 지새던 별 하나 눈뜨지 않는다"],"<보기>는 함께하던 이들을 잃은 현실을 '어두운 밤'으로 나타냈다고 본다. 등불 든 이도, 함께 어둠을 지새던 별도 보이지 않는 밤이 그 현실을 대신 보여 준다."],"형상화|26-23-0b":[["빛나는 때를 위해 {{소금을 뿌리며}}","우리는 이 저녁을 떠돌고 있는가"],"빛이 돌아오기를 바라는 보이지 않는 소망이 '소금을 뿌리며' 떠도는 구체적 행동으로 그려진다는 설명이다."],"동일시|26-23-0c":[["그 그리움 날로 자라면","주먹송이처럼 커 갈 땡감들.","그 기다림 날로 {{익으니}}","서러움까지 {{익어선}}"],"감이 커 가고 익어 가는 모습과 화자의 그리움·기다림이 자라고 익어 가는 모습이 겹친다. 자연물과 화자의 내면이 같은 과정을 밟는다는 설명이다."],"시간의 흐름에 따른 변화|26-23-0c":[["{{아까는}} ⓑ 오색딱다구리가","따다다닥 찍고 가더니","봐 봐, {{시방은}} ⓒ 청설모가","저 짙푸른 감들, {{마침내}}"],"'아까는', '시방은', '날로', '마침내' 같은 시간 표지를 따라 장면과 감의 상태가 바뀐다는 설명이다."],"암시|26-23-2":[["우리가 뿌린 소금들 반짝반짝 별빛이 되어","오던 길 {{환히 비춰 주고 있으니}}"],"뿌린 소금이 별빛이 되어 길을 비추는 장면은 빛이 돌아올 수 있다는 기대를 넌지시 보여 준다. 따라서 적절하다."],"성찰|26-23-3":[["감나무 그늘에 {{평상을 놓고}}","그래 그래, 밤이면 잠 뒤척여","산이 우는 소리도 들어 보고"],"감나무 아래 평상을 놓고 밤과 새벽을 보내며 산과 계곡의 소리에 귀 기울이는 것이 내면을 돌아보는 시간으로 읽힌다. 따라서 적절하다."],"명암 이미지|26-23-3":[["감나무 잎새를 {{반짝이는}} 게","어찌 햇살뿐이랴.","감나무 {{그늘}}에 평상을 놓고"],"잎새를 반짝이게 하는 햇살과 그 아래 그늘이 한 나무에 함께 있다. 밝음과 어두움이 어우러진 자연이므로 적절하다."],"간절함|26-24-1":[["잊혀진 ㉠ 한 목소리 잊혀진 다른 목소리의 끝을 찾아","{{목메이게 부르짖다}} 잦아드는 때가 있다","우리는 이 새벽길 {{숨가쁘게}} 넘고 있는가"],"목메게 부르짖고 숨가쁘게 길을 넘는 모습에서 대상을 찾으려는 절박함이 드러난다. 따라서 적절하다."],"문학론|26-26-0":[["㉢ 사람의 소리로서 남에게 듣기 좋고, 남에게 듣기 좋아 글로 쓰이고, 글로 쓰였으면서 {{바름에 합당하다면}} 그것을 일컬어 ㉣ 좋은 소리라 한다."],"글쓴이는 듣기 좋고, 글로 쓰이고, 바름에 합당해야 '좋은 소리'라고 정의한다. 이것이 좋은 글에 대한 이이의 생각, 곧 문학론이다."],"화두|26-26-1":[["천지간에 만물이 {{소리}}를 내게 만드는 것은 무엇인가?","그런즉 사람이 소리를 내게 하는 것은 기이다."],"만물이 소리 나는 이치에서 시작해 사람의 소리, 다시 최립의 문장으로 이야기가 옮겨 간다. 소리를 화두로 삼았으므로 적절하다."],"칭찬과 당부|26-26-4":[["그의 문장이 비록 완성된 것은 아니지만 그 뜻은 {{바름을 향한다}}.","그러니 {{학업을 게을리하지 않는다면}} 바르게 되는 데 무슨 어려움이 있겠는가."],"뜻이 바름을 향한다고 평가한 뒤 학업을 게을리하지 말라고 당부한다. 따라서 적절하다."],"칭찬과 당부|26-26-5":[["최립은 소리가 크니 그 본체가 큰 것을 알 만하다.","사람의 본체는 마음이니 그의 {{마음이 가히 크다}}고 하겠다.","최립의 {{기는 가히 크다}}고 하겠다."],"소리가 큰 까닭을 큰 마음과 큰 기에서 찾으며 최립을 칭찬한다. 따라서 적절하다."],"반복|26-27-4":[["이봐요. 허 선생. 더 이상 {{서툰 짓}}은 하지 마시오.","우리의 피땀으로 이룩한 독가촌을 가지고 {{서툰 짓}}을 벌이려고 하다가는 당신이 온전치는 못할 거요."],"온 씨는 허명두의 행위를 '서툰 짓'이라 되풀이해 부르며 그만두라고 경고한다. 따라서 적절하다."],"에둘러 말하기|26-27-5":[["“나한테 협박을 하는 것이라면…… 그런 협박은 하나도 무섭지 않으니 {{어디 한번 해볼 대로 해보라지}}.”","“내가 한 말 명심하시오. 당신 같은 사람이 날뛰던 시대는 서서히 지나가고 있다는 것을.”"],"허명두는 돌려 말하지 않고 '해볼 대로 해보라지'라고 정면으로 맞선다. 온 씨도 경고를 되풀이할 뿐 관심을 다른 데로 돌리지 않으므로 적절하지 않다."],"초점화|26-30-0a":[["온 씨의 주장은 옳은 것이었다. 허명두 씨의 입장에서도 그것은 부정할 수 없었다.","㉡ 그러나 그렇기는 하지만 {{명분이나 사리의 옳음이란 것이 싸움에 무슨 필요가 있단 말인가}}."],"서술자는 허명두의 눈으로 상황을 보며 그의 생각을 그대로 옮긴다. 이 생각은 허명두의 것이지 서술자의 판단이 아니라는 점이 중요하다."],"내면 서술|26-30-0a":[["㉡ 그러나 그렇기는 하지만 {{명분이나 사리의 옳음이란 것이 싸움에 무슨 필요가 있단 말인가}}."],"따옴표 없이 허명두의 속생각이 문장으로 드러난다. 서술자가 인물의 내면을 직접 옮긴 것이다."],"서술자|26-30-0b":[["‘이제 당신 같은 사람들이 날뛰던 시대는 서서히 지나가고 있다’는 말을 그는 물론 실감으로 받아들이고는 있으되, ㉤ 문제는 그것이 아직까지는 완전히 지나간 게 아니라는 데 있었다."],"서술은 허명두의 생각을 그럴듯하게 보여 주지만, 그가 변화를 알면서도 버티는 모습을 함께 드러낸다. 그 이면에 서술자의 비판이 있다는 설명이다."],"일반화|26-30-1":[["㉠ 이 세상에서 서로 말이 통하지 않는 {{두 종류의 인간군}}들이 사는가 보았다."],"온 씨와 한 번 나눈 대화를 '두 종류의 인간군'으로 넓혀 말한다. 소통이 어렵다는 생각을 타당해 보이게 하므로 적절하다."],"주관화|26-30-2":[["허명두 씨로서는 마지막 안간힘을 내어 그가 일으켜 보려는 이번 {{싸움}}이 과거 어느 때보다도 어렵다는 것은 알고 있었다.","㉡ 그러나 그렇기는 하지만 명분이나 사리의 옳음이란 것이 {{싸움}}에 무슨 필요가 있단 말인가."],"마을의 갈등을 '싸움'으로 부르는 것은 허명두 자신의 관점이다. 싸움이라면 이기는 게 중요하다는 논리로 사리의 옳음을 밀어내므로 적절하다."],"상대의 생각 헤아리기|26-30-3":[["온 씨가 무슨 이야기를 하고 싶어 하는지 모르는 바는 아니었다.","온 씨의 주장은 옳은 것이었다. 허명두 씨의 입장에서도 그것은 부정할 수 없었다."],"허명두는 온 씨의 생각을 헤아리고 그 주장이 옳다고 인정한다. 변화의 원인을 달리 보며 왜곡하는 대목은 없으므로 적절하지 않다."],"일반화|26-30-4":[["㉣ 명분보다는 실리를 추구해 오는 측이 {{항상}} 이겨 오고 있었던 게 아닌가."],"지난 경험을 '항상'으로 넓혀 지금도 실리가 앞선다고 본다. 따라서 적절하다."],"합리화|26-30-4":[["대한청년단 시절의 일하며 화랑동지회의 체험들을 그가 요 근래 부쩍 회상해 보는 것도 그 때문이었다.","㉣ {{명분보다는 실리를 추구해 오는 측이 항상 이겨 오고 있었던 게 아닌가}}."],"지난 체험을 끌어와 지금의 자기 선택이 옳다는 근거로 삼는다. 따라서 합리화로 볼 수 있으므로 적절하다."],"주관화|26-30-5":[["㉤ 문제는 그것이 {{아직까지는}} 완전히 지나간 게 아니라는 데 있었다."],"시대가 바뀌는 것을 실감하면서도 '아직'은 아니라고 자기에게 유리하게 해석한다. 따라서 적절하다."],"자기중심적 태도|26-30-5":[["‘이제 당신 같은 사람들이 날뛰던 시대는 서서히 지나가고 있다’는 말을 그는 물론 실감으로 받아들이고는 있으되, ㉤ 문제는 그것이 {{아직까지는 완전히 지나간 게 아니라는 데}} 있었다."],"변화를 알면서도 기존 선택을 고수할 근거로 삼는다. 자기에게 유리한 쪽으로만 보는 태도이므로 적절하다."],"인용|26-31-1":[["여기에서 종성 가기 {{오십 리가 된다 하니}}","바삐 가는 저문 길에 얼음 밑에 빠지고나"],"'~된다 하니'는 남의 말을 옮긴 것이지만, 전하는 내용은 거리일 뿐 목적지의 위험성이 아니다. 따라서 적절하지 않다."],"대구|26-31-2":[["{{여러 달 주리다가}} 혹시 혹시 출두하면","음식은 장하건만 하나나 살로 가랴","{{여러 날 칩떨다가}} 더운 방에 들어오면","가슴에 열이 나니 먹느니 냉수로다","{{고맙단 이 잠깐이오}} {{원수는 대대로다}}"],"두 구절이 같은 짜임으로 짝을 이루고, 둘 다 어사로서 겪는 고충을 드러낸다. 따라서 적절하다."],"대조|26-31-2":[["고맙단 이 {{잠깐}}이오 원수는 {{대대로}}다","괴롭기는 저 혼자라 못할 것이 어사로다"],"고마워하는 마음은 잠깐이고 원한은 대대로 간다는 대조로 어사 노릇의 괴로움을 드러낸다. 따라서 적절하다."],"빗대는 표현 (비유)|26-31-3":[["둥둥 떠서 높고 높이 솟아올라 {{백룡의 굽이같이}} 굼틀뒤틀 뒤틀어져 구름 속에 들거고나"],"상상의 존재인 백룡에 빗댄 것은 맞지만, 빗대어 드러낸 것은 하늘로 오르는 연의 움직임이다. 자연 현상의 변화가 아니므로 적절하지 않다."],"방위 어휘|26-31-4":[["정월 대보름에 {{서풍}}이 고이 불 제 하얀 실 한 얼레를 끝까지 풀어 띄울 제","{{동해}} 바다 건너가서 외로이 섰는 나무에 걸렸다가"],"서풍은 바람이 불어오는 쪽, 동해는 연이 가 닿는 곳이다. 연이 바람을 타고 같은 쪽으로 가므로 서로 반대로 움직인다고 볼 수 없다."],"색채어|26-31-5":[["{{하얀 실}} 한 얼레를 끝까지 풀어 띄울 제","온성이 몇 리런고 ㉠ 우리 말이 지쳤구나"],"(나)에는 '하얀 실', '백룡'이 있지만 (가)에는 색채를 나타내는 표현이 없다. '모두'라는 조건을 채우지 못하므로 적절하지 않다."],"소재 중심의 시상 전개|26-34-0":[["이 시름 저 시름 여러 가지 시름 ⓐ {{방패연}}에 세세히 적어","강원도 설화지를 제 크기로 ⓑ {{연}}을 지어"],"(나)와 (다)는 모두 '연'을 중심 소재로 시상을 펼친다. (나)는 시름을 적은 연을 날려 보내고, (다)는 높이 오른 연을 보며 임을 떠올린다는 설명이다."],"해학|26-34-1":[["바삐 가는 저문 길에 얼음 밑에 빠지고나","버선 행전 다 적시고 {{동태가 되었더라}}","이 몰골 이 거동을 남 뵈기 부끄럽다"],"얼음물에 빠져 언 자신을 '동태'에 빗대 웃음을 만든다. 남을 비꼬는 웃음이 아니라 자기 처지를 웃음거리로 삼으므로 해학이다. 따라서 적절하다."],"화자의 대상화|26-34-1":[["{{이 몰골 이 거동을}} 남 뵈기 부끄럽다","만인 중에 출두하고 남여 위에 높게 앉아"],"화자가 자기 모습을 '이 몰골 이 거동'이라며 바깥에서 보듯 그린다. 따라서 적절하다."],"정서의 촉발|26-34-3":[["바람이 한창인 제 삼간 퇴김 사간 근두* 반공에 {{솟아올라 구름에 걸쳤으니}}","먼 데 임 줄맥을 길게 대어 {{낚아 올까}} 하노라"],"솟아오른 연을 보고 임을 떠올리는 것은 정서의 촉발이 맞다. 그러나 화자는 연줄로 임을 '낚아 올까' 한다. 임에게 가려는 것이 아니라 임을 끌어오려는 것이므로 적절하지 않다."],"생동감 있는 묘사|26-34-5":[["백룡의 굽이같이 {{굼틀뒤틀 뒤틀어져}} 구름 속에 들거고나","{{강원도 설화지}}를 {{제 크기로}} ⓑ 연을 지어"],"(나)는 의태어로 연의 움직임을, (다)는 연의 재료와 크기를 구체적으로 밝혀 대상 자체를 부각한다. 따라서 적절하다."],"시적 분위기 조성|m3-18-1":[["방금 딴 {{사과}}가 가득한 상자를 들고","나 몰래 엿보았네 {{외로운 추수꾼}}의 웃음을"],"(나)는 갓 딴 사과와 '추수꾼'으로 수확의 계절인 가을의 분위기를 자아낸다. (가)의 서해, (다)의 원림에는 특정 계절을 드러내는 자연물이 없으므로 적절하다."],"대화 형식|m3-18-2":[["그러나 내게 {{힐난하는}} 이가 나타나 이렇게 말했다.","내가 그에게 이렇게 사죄하였다."],"(다)에는 '나'와 '힐난하는 이'가 말을 주고받는 대화가 있다. 그러나 그 대화는 비판과 해명이지 친밀감을 드러내지 않으므로 적절하지 않다."],"음성 상징어|m3-18-3":[["검은 개펄에 작은 게들이 구멍 속을 들락거리고","사과들이 {{데굴데굴}} 굴러 나오는 커다란 웃음을 웃으며"],"(나)에는 '데굴데굴'이 있지만 (가)에는 의성어·의태어가 없다. 선지는 (가)에 음성 상징어가 있다고 했으므로 적절하지 않다."],"현재형 진술|m3-18-3":[["그녀는 서류 뭉치를 {{나르고 있었다}}","나 몰래 {{엿보았네}} 외로운 추수꾼의 웃음을"],"(나)는 '나르고 있었다', '엿보았네'처럼 과거형으로 서술한다. 현재형 진술로 생동감을 준다고 볼 수 없으므로 적절하지 않다."],"종결 어미의 활용|m3-18-4":[["그곳 바다인들 여느 바다와 {{다를까요}}","책상들 사이에서 안 보는 척 {{보았네}}"],"(가)의 '-ㄹ까요', (나)의 '-네' 같은 어미는 있다. 그러나 이 어미들로 대상을 기리는 태도가 드러나지 않으므로 적절하지 않다."],"예찬적 태도|m3-18-4":[["아직 서해엔 가 보지 않았습니다","어쩌면 당신이 거기 계실지 모르겠기에"],"(가)의 화자는 '당신'이 계실지 모를 곳을 남겨 두려는 마음을 말할 뿐 대상을 찬양하지 않는다. 예찬적 태도로 볼 수 없으므로 적절하지 않다."],"지시 표현|m3-18-5":[["{{그곳}} 바다인들 여느 바다와 다를까요","{{저}} 푸르면서도 발그레한 웃음의 빛깔을"],"'그곳', '저' 같은 지시어는 있지만 대상을 두려워하며 공경하는 마음을 드러내지 않는다. 따라서 적절하지 않다."],"문장 성분의 배치 (도치)|m3-19-1":[["어떻게 기억해 냈을까 사과를 나르던 {{발걸음을}}","나 몰래 엿보았네 외로운 추수꾼의 {{웃음을}}","외로운 추수꾼의 {{걸음을}}"],"서술어 뒤에 목적어 '발걸음을', '웃음을', '걸음을'을 두어 그 말에 시선이 모이게 한다. 따라서 적절하다."],"연쇄적 표현|m3-19-4":[["어떻게 기억해 냈을까 사과를 나르던 {{발걸음}}을","{{발걸음}}에서 튀어 오르는 {{공기}}를","{{공기}}에서 터져 나오는 {{햇빛}}을","{{햇빛}} 과즙, 햇빛 향기를"],"발걸음에서 공기로, 공기에서 햇빛으로 끝말을 이어받으며 걸음이 저절로 퍼져 나가듯 이어진다. 이 연쇄가 [B]에서 '걷지 않아도 저절로 나아가는' 걸음과 호응하므로 적절하다."],"대응|m3-19-5":[["{{스스로 넘치고 무거워져서 떨어지는 웃음}}을","노래처럼 {{저절로 익어 흘러나온 웃음}}을"],"[A]의 '스스로 … 떨어지는 웃음'과 [B]의 '저절로 익어 흘러나온 웃음'이 짝을 이룬다. 추수꾼이 스스로 충만한 존재임을 보여 주므로 적절하다."],"공간의 의미|m3-21-0":[["내 가 보지 않은 한쪽 바다는","늘 {{마음속에서나 파도치고}} 있습니다"],"직접 가 보지 않은 서해가 마음속에서 파도치는 바다가 된다. 현실의 공간을 바탕으로 상상의 공간이 만들어진다는 설명이다."],"동일시|m3-21-3":[["방금 딴 사과가 가득한 상자를 들고","그녀는 {{서류 뭉치를 나르고}} 있었다"],"사무실에서 서류를 나르는 모습이 사과 상자를 나르는 모습과 겹쳐 보인다. 현실과 상상의 공간이 함께 펼쳐지므로 적절하다."],"무상감|m3-23-1":[["동냥도 꿈이로다 등짐도 꿈이로다.","{{차라리 빨리 죽어 이 설움을 모르고 싶네.}}"],"화자는 귀양살이의 고통을 토로할 뿐, 영원한 자연과 대조해 인간사의 덧없음을 노래하지 않는다. 따라서 적절하지 않다."],"어조|m3-23-1":[["이리저리 생각하니 {{가슴속에 불이 난다}}.","포구 가에 퍼져 앉아 {{종일토록 통곡하고}}"],"화자는 설움을 직접 쏟아 낸다. 감정을 누르는 절제된 어조로 볼 수 없으므로 적절하지 않다."],"관조|m3-23-2":[["㉡ {{네 웃음도 듣기 싫고 많은 밥도 먹기 싫다}}.","차라리 굶을망정 이 노릇은 못 하겠네."],"화자는 주인의 비웃음에 직접 반응하며 자기 처지를 겪어 낸다. 거리를 두고 바라보는 관조로 볼 수 없으므로 적절하지 않다."],"세태 비판|m3-23-2":[["㉠ 저 주인의 거동 보소. 코웃음 치고 비웃으며"],"주인의 비웃음은 화자 개인이 겪는 일이다. 어지러운 세상 풍조를 제시하는 것이 아니므로 적절하지 않다."],"시선·공간의 이동|m3-23-3":[["오동에 낙엽 지고 가을바람 소슬한데","오리는 가지런히 날고 물과 하늘 한 빛이구나."],"경치가 나오지만 먼 곳에서 가까운 곳으로 시선을 옮기며 관찰하는 흐름은 없다. 따라서 적절하지 않다."],"탈속적 태도|m3-23-4":[["사립문에 개 짖으니 {{나를 놓아줄 공문인가}}.","바다에 배가 오니 {{석방 문서 가진 관선인가}}."],"화자가 바라는 것은 귀양에서 풀려나는 것이다. 세속을 떠난 이상향을 동경하지 않으므로 적절하지 않다."],"자문자답|m3-23-5":[["사립문에 개 짖으니 {{나를 놓아줄 공문인가}}.","반겨 나가 물어보니 {{황아* 파는 장수로다}}.","바다에 배가 오니 {{석방 문서 가진 관선인가}}.","일어서서 바라보니 {{고기 잡는 어선이라}}."],"스스로 묻고 곧바로 답하는 짝이 되풀이되며, 풀려나기를 바라는 기대와 현실을 드러낸다. 따라서 적절하다."],"명령형 표현|m3-24-1":[["㉠ 저 주인의 {{거동 보소}}. 코웃음 치고 비웃으며"],"'보소'라는 명령형으로 듣는 이의 시선을 주인의 모습에 모은다. 따라서 적절하다."],"대구|m3-24-2":[["㉡ {{네 웃음도 듣기 싫고}} {{많은 밥도 먹기 싫다}}."],"'~도 ~기 싫다'라는 같은 짜임이 짝을 이루어 주인의 언행에 대한 거부감을 강조한다. 따라서 적절하다."],"대조|m3-24-3":[["㉢ {{종이 노도 모르는데 짚 새끼를 어찌 꼬리}}.","다만 한 발 채 못 꼬아 손바닥이 부르트네."],"종이 노와 짚 새끼 꼬기는 반대되는 행위가 아니다. 쉬운 일도 모르는데 어려운 일을 어찌하겠냐는 비교이므로 적절하지 않다."],"과장|m3-24-4":[["㉣ {{일각이 삼 년처럼 더디 가니}} 이 고생을 어찌할꼬."],"짧은 시간을 삼 년처럼 느낀다고 부풀려 귀양살이의 고통을 부각한다. 따라서 적절하다."],"열거 (나열)|m3-24-5":[["㉤ 배가 고파 {{허기증}}에 몸이 추워 {{냉증}}이요","잠 못 들어 {{현기증}} 나니 {{조갈증}}은 늘 앓는 병이로다."],"여러 증세를 늘어놓아 설움이 몸으로 드러나는 모습을 구체화한다. 따라서 적절하다."],"감각적 표현|m3-28-2":[["㉡ 소년들은 흥분과 초조 속에 멀리서 소를 몰아오는 아버지들의 {{은은한 함성을 듣고}} 있었다."],"멀리서 들려오는 함성이라는 청각 경험과 함께 사냥을 앞둔 소년들의 긴장을 보여 준다. 따라서 적절하다."],"투영|m3-28-4":[["㉣ 하지만 공격할 만한 곳이 못 된다고 판단된 듯 몇 번 위협적인 콧김을 내뿜더니 어슬렁거리며 숲속으로 사라져 버렸다.","{{몹시 기분이 상했다는 식의 걸음걸이}}였다."],"소의 움직임에 '판단', '기분' 같은 의도를 붙인 것은 맞다. 그러나 이는 주인공의 심리가 아니라 소의 모습을 해석한 것이므로, 인물의 심리를 투영했다고 보기 어렵다. 따라서 적절하지 않다."],"장면 전환·교차 서술|m3-29-1":[["처음 그 소는 똑바로 ‘뱀눈’을 향해서 돌진하는 것 같았다.","‘뱀눈’은 기다렸다는 듯이 그런 소에게 창을 날렸다."],"[A]는 들소가 달려와 '뱀눈'이 창을 던지는 한 장면 안에서 이어진다. 장면이 자주 바뀌지 않으므로 적절하지 않다."],"초점화|m3-29-2":[["그 순간 {{그는 비로소 ‘뱀눈’에게 속았다는 것을 깨달았다}}.","일견 소는 ‘뱀눈’을 피해 가는 것처럼 보였지만 실은 ‘뱀눈’이 올라서 있는 한 길 남짓한 바위를 피해 간 것이었다."],"주인공 '그'의 눈으로 들소의 움직임과 '뱀눈'의 속셈을 하나하나 짚어 간다. 따라서 적절하다."],"회상|m3-29-3":[["그도 곧 숲 가의 관목 사이를 헤치고 달려오는 들소를 보았다."],"[A]는 지금 벌어지는 사냥 장면이다. 과거를 떠올리는 대목이 없으므로 적절하지 않다."],"내면 서술|m3-29-5":[["그 순간 그는 비로소 ‘뱀눈’에게 속았다는 것을 {{깨달았다}}."],"[A]에서 인물의 생각은 '깨달았다'처럼 서술자가 정리해 전한다. 인용 부호 없이 인물의 말을 그대로 옮긴 대목은 없으므로 적절하지 않다."],"형상화|m3-30-0":[["이제 나는 너를 {{나만의 선과 색으로 영원히 잡아 두고자}} 한다."],"들소를 잡아야 할 사냥감이 아니라 그림으로 그려 낼 대상으로 바라보게 된다는 설명이다. 여기서 형상화는 들소를 그림으로 구체화하는 일이다."],"내면 서술|m5-19-1":[["사환아이는 한동안 멍하니 서 있기만 했다. ㉠ {{도무지 무슨 영문인지 알 수가 없었다}}."],"사환아이의 생각을 서술자가 직접 드러낸다. 따라서 적절하다."],"서술자|m5-19-3":[["㉢ 그러고는 오랜만에 영화라도 한 프로 감상해야지.","그래, 명자나 수연일 불러내서 거길 가야지."],"㉢은 사환아이의 생각을 그대로 옮긴 것이다. 서술자가 그 생각을 평가하는 말이 없으므로 적절하지 않다."],"관용 표현|m5-19-5":[["㉤ 이 대목에서만은 다들 {{쓴 입맛만 다셨을}} 따름이었다."],"'쓴 입맛을 다시다'는 일이 뜻대로 되지 않아 언짢을 때 쓰는 관용 표현이다. 따라서 적절하다."],"영탄적 표현|m5-22-1":[["{{사랑하는 동무 박(朴)이여!}} 그리고 김(金)이여! 자네들은 ㉢ 지금 어디 있는가?"],"부름과 느낌표로 떠나간 벗을 향한 그리움을 깊게 드러낸다. 따라서 적절하다."],"가정적 표현|m5-22-2":[["해거름녘 쓸쓸한 사람들과 흐르던","따뜻한 강물이 내게로 왔네"],"(나)에는 '-면' 같은 가정의 표현이 없고, 강물이 '내게로 왔네'라고 서술할 뿐이다. 따라서 적절하지 않다."],"음성 상징어|m5-22-3":[["집의 남쪽 허물어진 담 그늘에 난초가 있어 싹이 돋아났다."],"(다)에는 의성어·의태어가 없다. (나)의 '파릇파릇'과 헷갈리지 않아야 하므로 적절하지 않다."],"시적 분위기 조성|m5-22-4":[["으스름히 {{안개}}가 흐른다. 거리가 흘러간다."],"(가)의 안개와 거리, 가로등은 계절을 드러내지 않는다. 계절감을 드러내는 표현이 없으므로 적절하지 않다."],"반어|m5-22-5":[["이 밤을 하염없이 안개가 흐른다.","따뜻한 강물이 내게, 내게로 왔네"],"세 작품 모두 겉말과 속뜻이 반대인 표현이 없다. 따라서 적절하지 않다."],"형상화|m5-24-0":[["으스름히 안개가 흐른다. {{거리가 흘러간다}}."],"추상적인 인식이나 감정을 구체적인 움직임이나 상태의 이미지로 그려 낸다는 설명이다. 흐를 수 없는 거리가 흘러간다는 표현이 그 예다."],"과장|m5-24-3":[["{{끝없이}} 안개가 흐르는데,","㉣ 서로 겹쳐 흐르며 {{온누리 껴안으며}}","{{삼라의 뜻을 돌아}} 내게로 왔네"],"'끝없이', '온누리', '삼라'처럼 실제보다 크게 부풀려 흐르는 자연물의 이미지를 만든다. 따라서 적절하다."],"공감각 (감각의 전이)|m5-24-5":[["{{금휘장(金徽章)에 금단추를 삐었고 거인처럼 찬란히 나타나는}} 배달부"],"'금휘장', '금단추', '찬란히'는 모두 시각 이미지다. 다른 감각으로 옮겨 가지 않았으므로 감각의 전이로 볼 수 없다. 따라서 적절하지 않다."],"대구|m5-27-1":[["{{위풍으로 제어하면}} 겁내야 아니올까","{{기운으로 쫓아보면}} 못이기어 아니올까"],"'~으로 ~하면 ~아니올까'라는 같은 짜임이 이어지며 백발을 막을 수 없는 상황을 부각한다. 따라서 적절하다."],"열거 (나열)|m5-27-2":[["천황 지황 인황 후에 복희 신농 헌원씨며 요순우탕 문무주공"],"옛 임금과 성인의 이름을 늘어놓아 운율을 만든다. 따라서 적절하다."],"반복|m5-27-3":[["{{시비인들 내 알며}} {{영욕(榮辱)인들 내 알더냐}}"],"'~인들 내 알며/알더냐'라는 같은 짜임이 되풀이되며 세속에 매이지 않는 마음을 강조한다. 따라서 적절하다."],"색채어|m5-27-4":[["소문없이 오는 {{백발}} 귀밑이 {{반백(半白)}}이라","공도*라는 {{백발}}이요 못 면할손 죽음이라"],"(가)의 '백발', '반백', (나)의 '백발'이 늙음이라는 대상의 속성을 드러낸다. 따라서 적절하다."],"의인화|m5-27-5":[["꾸짖어 물리치면 {{무색(無色)하야}} 아니올까","욕하야 거절하면 {{노여하야}} 아니올까","벗이 올 이 없으니 ⓑ 동문(洞門)이 잠겨 있다"],"(가)의 백발은 무안해하고 노여워하는 사람처럼 그려진다. 그러나 (다)에는 의인화된 대상이 없어 '모두'가 성립하지 않으므로 적절하지 않다."],"가정적 표현|m5-28-3":[["꽃이라도 {{떠러지면}} 오는 나비 돌아 가고","㉢ 옥식(玉食)도 {{쉬어지면}} 수채 구멍 찾아 가네","세상일 생각하니 만사가 허사로다"],"'-면'으로 대상이 쇠한 상황을 가정해, 쓸모를 잃으면 모두 떠난다는 세상일의 이치를 깨닫는다. 따라서 적절하다."],"고사·역사적 인물의 활용|m5-28-4":[["㉣ {{어리석다 진시황은}} 만리장성 굳이 쌓고","장수불사 하려다 여산의 고혼되고"],"불로장생을 꿈꾼 진시황의 행적을 들어 '어리석다'고 평가한다. 따라서 적절하다."],"성찰|m5-30-0":[["할 수 없다 저 백발은 사람마다 겪는고나","우리 같은 초로인생* 공수래공수거라 아니 놀고 무엇 하리"],"늙음을 피할 수 없음을 깨닫고 남은 삶을 어떻게 살지 돌아본다는 설명이다."],"칭찬과 당부|m5-32-4":[["네가 저렇듯 깨달은 것은 천지신령이 도우심이며 방씨 가문을 빛내게 하고 늙은 우리 부부의 홍복인가 하노라.","네가 매사를 동동촉촉해 부모와 처자를 보전케 하며 우리 방씨 가문을 {{창성케 하라}}."],"진사 부부는 방주의 깨달음을 가문의 복으로 반기며 가문을 일으키라고 당부한다. [B]도 살아 돌아오는 경우와 죽는 경우를 함께 말하므로 적절하다."],"초월적 존재|m5-34-3":[["“이는 {{천상의 보배}}라. 창검도 아니 들며, 불에 들어가도 타지 아니하고 물에 들어도 젖지 아니하는 것이라. 속히 큰 공을 이루라.”"],"선관이 천상의 보배를 건네며 큰 공을 이루라고 이끈다. 초월적 존재가 인물의 행동을 이끌므로 적절하다."],"내면 서술|m6-21-0":[["㉢ {{또 오는구나. 또 누굴 데려갈라고…….}} 술기와 함께 온몸의 피가 얼굴로 치솟는 듯했다."],"따옴표 없이 삼바우의 속말이 이어지고, 바로 곁에 그의 몸이 달아오르는 모습이 묘사된다는 설명이다."],"대조|m6-22-1":[["한 해의 꽃잎을 ㉠ 며칠 만에 활짝 피웠다 지운","미처 제 꽃 한 송이도 펼쳐 들지 못하고 멈칫거리는","{{희고 밝은 목질}} 사이를 지나가는","{{어둡고 딱딱한 나이테}}들"],"(가)는 이미 진 벚꽃과 늦된 나무를, (나)는 밝은 목질과 어두운 나이테를, (다)는 청춘과 노년을 맞세워 주제를 드러낸다. 따라서 적절하다."],"시선·공간의 이동|m6-22-2":[["벚꽃 가로 따라가다가","한참이나 거기 멈춰 서 있었지요."],"(가)에 걷는 길이 나오지만 (나)는 가구의 무늬를, (다)는 노인과 꽃을 한자리에서 바라본다. 공간의 이동에 따라 대상이 바뀐다고 볼 수 없으므로 적절하지 않다."],"시적 분위기 조성|m6-22-3":[["이 봄 가기 전 저 나무도 푸릇한 잎새 매달까요?"],"계절이 언급되기는 하지만 슬픈 분위기를 높이지 않는다. (가)와 (다)는 오히려 기대와 긍정으로 나아가므로 적절하지 않다."],"대화 형식|m6-22-4":[["노인이 꽃나무를 심으심은 무슨 보람을 위하심이오니까."],"(다)는 노인에게 일방적으로 말을 건넬 뿐 대답이 없다. 세 작품 모두 말을 주고받지 않으므로 적절하지 않다."],"가정적 표현|m6-22-5":[["{{만일 노인 백 세 후에}} 기거하시던 창호가 닫히고 뜰 앞에 손수 심으신 꽃이 난만할 때 우리는 거기서 슬퍼하겠나이다."],"(다)에 가상의 상황은 있지만 현실을 비판하지 않는다. (가)와 (나)에도 현실 비판이 없으므로 적절하지 않다."],"빗대는 표현 (비유)|m6-23-5":[["{{지느러미처럼}} 빠르고 날렵한 무늬들은","가구들 위를 흘러다니고 있다"],"나무 무늬를 물고기 지느러미에 빗대 물속 생명체처럼 움직이는 느낌을 준다. 따라서 적절하다."],"속임수담|m6-30-0":[["“저 관군은 도적이 {{북으로 갔으니}} 북쪽 소로로 쫓아가 잡게 하라.”","하고 북쪽 소로를 가리키거늘, 관군이 그리로 쫓아가니라."],"길동이 승려 차림으로 관군에게 거짓 방향을 알려 도적들을 남쪽으로 빼돌린다. 속이는 이, 속는 이, 방법, 결과가 모두 드러나는 장면이다."],"이본|m6-31-0":[["“내 들으니 율도국이 살림이 넉넉하고 국세가 대국이나 다름이 없다 하니, 여러 군사들의 뜻이 어떠하뇨?”"],"「홍길동전」은 판본마다 율도국 왕이 되는 과정이 다르다. 이 지문은 안정적인 나라를 정벌하는 쪽에 해당한다는 설명이다."],"인용|m6-31-3":[["대저 나라는 한 사람의 그릇이 아니라. 이러하므로 {{성탕이 걸을 치시고 무왕이 주를 치시니}}, 예부터 정벌이 천리에 떳떳한 일인 고로"],"옛 성군이 폭군을 친 일을 끌어와 정벌의 명분으로 삼는다. 따라서 적절하다."],"색채어|m6-33-2":[["{{푸른}} 강물에 풍덩 들입다 띄워 두면"],"'푸른'이 강물이라는 공간을 눈에 보이게 한다. 따라서 적절하다."],"음성 상징어|m6-33-3":[["푸른 강물에 {{풍덩}} 들입다 띄워 두면"],"'풍덩'이 시름을 던지는 소리로 그 무게를 실감 나게 한다. 따라서 적절하다."],"가정적 표현|m6-33-4":[["푸른 강물에 풍덩 들입다 {{띄워 두면}}","자연히 이리저리 떠다니다 절로 삭으리라"],"'-면'으로 상황을 가정하며 시름을 화자에게서 떨어진 물건처럼 다룬다. 따라서 적절하다."],"형상화|m6-34-2":[["{{시름을 꺼내 들어 얽어 매고 둘러 묶어}}","자연히 이리저리 떠다니다 절로 삭으리라"],"형체 없는 시름을 꺼내 묶어 강물에 띄우는 물건으로 그린다. 심적 상태를 사물로 형상화했으므로 적절하다."],"요약적 제시|m7-20-1":[["김 처사는 이전 시중 완국의 아들이라. 그 부친이 무죄하게 외로운 섬에서 죽은 바 되었으니, 청운의 뜻이 없이 농부 어옹과 짝이 되어 세월을 보내니, 또한 {{지상의 신선이라}}."],"통판이 김 처사의 집안 내력과 사는 모습을 몇 문장으로 간추리며 '지상의 신선'이라고 평가한다. 따라서 적절하다."],"관용 표현|m7-20-4":[["속담에 하였으되, ‘{{호랑이는 개의 새끼를 아니 낳는다}}.’ 하였으니"],"속담을 들어 김 처사의 아들도 훌륭할 것이라는 생각을 강조한다. 따라서 적절하다."],"초월적 존재|m7-20-4":[["분명 부군이 아님은 {{위에 있는 하늘이 굽어살피시오니}}"],"농옥은 하늘을 끌어와 자기 말이 진실임을 강조한다. 따라서 적절하다."],"화소|m7-21-0":[["저와 함께 온 여인은 과연 여승이 아니오라 김 처사 댁 시비 향임이라.","이 송사는 진짜 선옥을 보기 전에는 귀신도 결단하지 못할지라."],"여승으로 꾸며 신부를 살피는 '속임을 통한 선보기', 가짜 선옥을 가려내는 '진가쟁주'가 이 작품을 이루는 화소라는 설명이다."],"회상|m7-22-1":[["자신이 내는 발자국 소리라도 듣지 않고는 견딜 수 없었다.","그는 다시 나무둥치에 등을 기대고 서서 눈을 감았다."],"'지난밤'을 떠올리는 대목은 [A] 바깥에 있다. [A] 안에는 과거 회상이 없으므로 적절하지 않다."],"감각적 표현|m7-22-2":[["저 혼자 떨어져 나와 산을 헤매던 한 마리 쥐의 구부정한 등허리 위로 {{청색 어둠이 내려앉고}} 있었다."],"'청색 어둠이 내려앉는' 시각 이미지로 사내의 쓸쓸한 마음을 드러낸다. 따라서 적절하다."],"내면 서술|m7-22-3":[["{{이상한 놈이군.}} 그가 몸을 돌렸다."],"따옴표 없이 쥐에 대한 사내의 생각이 그대로 드러난다. 따라서 적절하다."],"빗대는 표현 (비유)|m7-22-5":[["가도 가도 끝이 없을 것 같은, {{깊은 터널처럼}} 뚫려 있는 숲이었다."],"숲을 깊은 터널에 빗대 끝없이 갇힌 듯한 인상을 준다. 따라서 적절하다."],"장면 전환·교차 서술|m7-25-1":[["“성님. 우짜다가 그 사람은 산으로 들어갔답니꺼.","자신이 내는 발자국 소리라도 듣지 않고는 견딜 수 없었다."],"동네 사람들의 술자리 대화와 숲속 사내의 장면이 번갈아 나온다. 따라서 적절하다."],"세태 비판|m7-25-5":[["“에헤이, 그라모 여태 우리가 무신 ㉡ 이야기들을 했노? {{귀신 씻나락 까먹는 소리}}만 안 했나.","하여간에 시간도 많이 됐으이 고마 들어가 잡시더. {{자는 기 남는 기다}}.”"],"남의 불행을 화젯거리로 삼다가 금세 잠자리로 돌아가는 모습에서 타인의 삶을 가볍게 소비하는 세태가 드러난다. 따라서 적절하다."],"대화 형식|m7-26-1":[["어찌하여 금세(今世) 사람 과거에 병이 깊어","지금 사람들은 서사(書史)를 약간 섭렵하면 곧 함부로 잘난 체하여"],"(가)와 (나) 모두 글쓴이가 세태를 말할 뿐, 인물이 말을 주고받는 대화가 없다. 따라서 적절하지 않다."],"열거 (나열)|m7-26-2":[["공자는 배우지 않아도 스스로 깨달아 아는 성인이면서 오히려 {{노자에게 예를 물었고, 담자에게 관직에 대해 물었으며, 사양에게 거문고를 배웠다}}."],"(나)는 공자의 행적을 늘어놓지만 (가)에는 성현의 행적이 없다. 공통점이 아니므로 적절하지 않다."],"음성 상징어|m7-26-3":[["{{우우우}} 하는 소리 선비 입에 난단 말가"],"(가)에는 '우우우'가 있지만 (나)에는 의성어·의태어가 없다. 공통점이 아니므로 적절하지 않다."],"시선·공간의 이동|m7-26-4":[["팔월에 과장 열면 이월부터 분주하여","그르쳐 들이치고 그날에 백 리 가네"],"(가)는 과거 준비에서 귀향까지 이어지지만 (나)는 한자리에서 논의를 펼친다. 공통점이 아니므로 적절하지 않다."],"설의적 표현|m7-26-5":[["ⓑ 친척 사돈 모르거든 {{붕우장유 어이 알리}}","그런데 지금 만약 이를 근거로 “나무에 올라 물고기를 구할 수 있다.”고 한다면 {{과연 말이 되겠는가}}."],"답이 정해진 물음으로 (가)는 선비들의 무례함을, (나)는 그릇된 주장의 어리석음을 강조한다. 따라서 적절하다."],"현재형 진술|m7-32-2":[["원효로행 버스를 {{기다린다}}.","저 분수대의 도로(徒勞)* 물끄러미 {{바라본다}}, 푼수!"],"(가)의 '기다린다', (나)의 '바라본다'처럼 현재 시제로 지금의 상황을 드러낸다. 따라서 적절하다."],"상승·하강 이미지|m7-32-3":[["고독한 공간으로 / 혼자 {{떨어져 가는}}","이처럼 {{떨어지는}} 모든 것을"],"'떨어지는' 하강 이미지는 있지만 계절을 보여 주지 않는다. 고독한 삶을 드러낼 뿐이므로 적절하지 않다."],"종결 어미의 활용|m7-32-4":[["물이 꿈꾸는 또 다른 물{{일까}}","그래도 그가 풋잠에 섞는 건 오색 꿈결{{일까}}"],"(나)에는 의문형 어미가 있지만 (가)에는 없다. 공통점이 아니므로 적절하지 않다."],"명사형 종결|m7-32-5":[["{{이 갸륵하고 측은한 회귀심.}}","하룻밤을 지내는 {{측은한 화목들.}}"],"(가)는 명사로 행을 끝맺지만 화자의 의지가 아니라 측은함을 드러낸다. (나)에는 그런 종결이 없으므로 적절하지 않다."],"영탄적 표현|m9-22-2":[["내 자전거 바퀴는 골목의 모퉁이를 만날 때마다","둥글게 둥글게 길을 깎아내고 있어요"],"(나)는 '-네요', '-어요'로 차분하게 말할 뿐, 감탄사나 감탄형 어미로 고조된 감정을 드러내지 않는다. 따라서 적절하지 않다."],"대조|m9-22-3":[["그 작은 구름에게선 천 년 동안 아직도","아가인 그 사람의 냄새가 나네요"],"(나)에는 현재와 미래를 맞세워 인식이 바뀌는 대목이 없다. 따라서 적절하지 않다."],"가정적 표현|m9-22-4":[["말로써 도를 {{표현할 수 있다면}} 기와 조각이나 돌멩이인들 어찌 버리겠는가."],"(다)에 가정은 있지만 글을 짓고 읽는 태도를 말할 뿐, 변화된 시대상을 비판하지 않는다. 따라서 적절하지 않다."],"투영|m9-24-0":[["경주 남산 달밤에 가오리들이 날아다닌다","아닌 밤중에 웬 가오리라니"],"시 속의 현실은 실제와 다른, 상상으로 만든 현실이고 거기에 화자가 세계를 보는 시각이 담겨 있다는 설명이다."],"빗대는 표현 (비유)|m9-26-0":[["이는 꼭 {{이명(耳鳴)이나 코골이}}와 같다."],"박지원은 남이 모르는 자기만의 소리(이명)와 자기만 모르는 소리(코골이)로 작가와 독자의 관계를 빗대어 말한다는 설명이다."],"형상화|m9-27-1":[["그 나무들 {{무릎뼈 펴}} ㉠ 둥싯, {{만월이다}}"],"굽은 소나무가 무릎을 펴는 듯한 이미지와 둥근 달이 떠오르는 이미지를 한 행에 이어 그린다. 따라서 적절하다."],"암시|m9-27-3":[["내 자전거 바퀴가 ㉢ {{치르르치르르}} 도는 소리"],"'치르르치르르'는 자전거 바퀴가 도는 소리일 뿐, 계절의 풍요나 화자의 불안을 넌지시 드러내지 않는다. 따라서 적절하지 않다."],"인용|m9-29-4":[["한 달을 살어 갈랴니께 죽겄다고 덕근 어무니는 날마당 울고 있다고 {{안 하는가}}?”","“어디서 왔소? 아마 덕근 아배한테서 왔는감만, 저리도 좋아하게.”"],"[D]에서 판옥은 편지 내용을 '~다고 안 하는가'로 옮겨 전한다. 그러나 [A]에서 마누라는 편지가 누구에게서 왔는지 짐작할 뿐, 삼룡 가족의 형편은 확인되지 않으므로 적절하지 않다."],"관용 표현|m9-29-5":[["“흥, {{당구(堂狗) 삼 년에 음풍월}}이라더니","판옥이는 쓰디쓰게 웃었다."],"[E]에 관용 표현은 있지만 아내를 책망하기보다 씁쓸하게 놀리는 말이다. [B]에도 관용 표현으로 상대를 책망하는 대목이 없으므로 적절하지 않다."],"디아스포라|m9-31-0":[["어디든지 우리가 {{발을 딛고 살아가는 곳을 우리의 고향으로 만드세}}."],"고향으로 돌아갈 수도, 타향에 뿌리내릴 수도 없는 사람들의 처지를 말한다. 삼룡은 그 속에서 발 딛는 곳을 고향으로 만들자고 다짐한다."],"시적 분위기 조성|m9-32-1":[["㉠ {{가을이 점점 깊고}} 객회(客懷)는 쓸쓸한데"],"깊어 가는 가을을 제시하며 객지에서 느끼는 쓸쓸함을 부각한다. 따라서 적절하다."],"종결 어미의 활용|m9-32-3":[["㉢ 정원에 가득한 꽃 잘라 벤들 {{뉘 금할꼬}}"],"'-ㄹ꼬'라는 의문형 종결로 아무도 돌보지 않는 처지의 안타까움을 강조한다. 따라서 적절하다."],"고사·역사적 인물의 활용|m9-32-4":[["㉣ {{주 문왕 기산(岐山) 다스릴 제}} 인정(仁政)을 베푸시면","가련한 이내 몸이 반드시 먼저 들리"],"주 문왕의 고사를 끌어와, 어진 정치가 베풀어지면 자신이 먼저 구제될 것이라는 바람을 드러낸다. 따라서 적절하다."],"빗대는 표현 (비유)|m9-32-5":[["㉤ {{일월 같은}} 우리 임이 거의 아니 살피실까"],"임을 해와 달에 빗댄 것은 맞다. 그러나 임이 살펴 주기를 바라는 마음일 뿐, 둘 사이의 유대감이 깊어지는 것은 아니므로 적절하지 않다."],"유배 가사|m9-34-0a":[["섬 안의 모든 백성 마음 다해 일 마치니","{{감군은(感君恩)}} 세 글자를 벽 위에 크게 쓰고"],"낯선 섬에 유배된 사대부가 임금의 은혜를 그리며 지은 가사라는 설명이다."],"성찰|m9-34-0b":[["긴 소매 들고 앉아 {{옛 허물을 헤아리니}}","우직하기 본성이요 망령됨도 내 죄이오나"],"화자가 지난날의 허물을 헤아리며 자신을 돌아보는 대목이다."],"음성 상징어|m10-18-1":[["철없이 {{주걱주걱}} 흐르던 눈물도 이제는"],"(가)의 '주걱주걱'은 눈물이 흐르는 모양이다. 중심 제재인 등나무의 역동성을 부각하지 않으므로 적절하지 않다."],"어조|m10-18-2":[["창문 하나 없던 낡은 월세 자취방.","자세히 보면 어둠도 환하게 보이던 방."],"(나)는 처음부터 끝까지 '~던 방'으로 차분히 이어 갈 뿐 어조가 바뀌지 않는다. 따라서 적절하지 않다."],"설의적 표현|m10-18-3":[["그렇다 너와 내가 자꾸 꼬여 가는 그 속에서","{{좋은 꽃들은 피어나지 않겠느냐?}}","이것이 소완(素玩), 즉 마음을 비워 완상하는 것 {{아니겠나?}}"],"(가)와 (다)는 답이 정해진 물음으로 주제를 드러내고, (나)에는 이런 물음이 없다. 따라서 적절하다."],"감각적 표현|m10-18-4":[["{{퀴퀴하고 걸쭉한 어둠}}이 항상 고여 있던 방.","“자네는 물건 찾는 사람을 보지 못했나?"],"(나)는 어두운 방을 감각적으로 묘사하지만, (다)는 대화로 이치를 설명할 뿐 공간을 묘사하지 않는다. 따라서 적절하지 않다."],"대조|m10-18-5":[["철없이 주걱주걱 흐르던 눈물도 {{이제는}}","잘게 부서져서 구슬 같은 소리를 내고"],"(가)에는 예전과 지금의 대비가 있지만 (나)와 (다)에는 과거와 현재를 맞세워 미래를 낙관하는 내용이 없다. 따라서 적절하지 않다."],"형상화|m10-19-2":[["슬픔에다 기쁨을 {{반반씩 버무린 색깔}}로","내 가슴에 기쁨 같은 슬픔 같은 것의 물결이","{{반반씩 한꺼번에 녹아 흐르기}} 시작한 것은"],"기쁨과 슬픔이 섞인 감정을 색깔과 물결처럼 구체적으로 그려 낸다. 따라서 적절하다."],"성찰|m10-21-4":[["연등 날 {{지등의 불빛이 흔들리듯}}","빛이 널리 퍼져 정기가 흩어지기 때문이라네."],"(가)의 화자는 지등의 불빛에 비추어 자기 내면을 본다. 그러나 (다)의 글쓴이는 빛이 흩어지는 이치를 설명할 뿐, 그것을 경계하며 내면을 성찰하지 않으므로 적절하지 않다."],"시선·공간의 이동|m10-23-1":[["창문을 활짝 열고 병든 얼굴 높이 드니","㉠ 만 리 하늘땅의 가없는 청산이"],"창밖으로 눈 덮인 풍경을 바라보지만, 그려지는 것은 설경이지 그 계절의 풍속이 아니다. 따라서 적절하지 않다."],"시적 분위기 조성|m10-23-2":[["옛 시를 읊조리며 옛사람 생각하니","외로운 배 달빛 실어 흥취를 다하거늘"],"옛사람을 떠올리는 대목은 있지만 작품 전체는 설경을 즐기는 흥취로 나아간다. 지난날을 그리는 회고적 분위기로 볼 수 없으므로 적절하지 않다."],"고사·역사적 인물의 활용|m10-23-2":[["옛 시를 읊조리며 {{옛사람 생각하니}}"],"옛사람을 떠올리기는 하지만 역사적 인물을 이름으로 부르지 않는다. 따라서 적절하지 않다."],"세태 비판|m10-23-4":[["일만 집 거리에 흰 옥이 낭자하되","줍지 아니하니 {{풍속도 좋을시고}}."],"화자는 눈 덮인 거리를 보며 풍속이 좋다고 감탄한다. 세태를 비판하지 않으므로 적절하지 않다."],"투영|m10-23-4":[["㉢ 석양 추운 날에 날아드는 저 까마귀","깨끗하고 희디흰 눈빛을 더럽힐라."],"까마귀에 대한 걱정은 설경이 흐트러질까 하는 마음일 뿐, 사물에 감정을 담아 function markText(text, phrases){
  const ph=[...new Set(phrases)].sort((a,b)=>b.length-a.length);
  const e=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  if(!ph.length) return e(text);
  const re=new RegExp("("+ph.map(p=>p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","g");
  return text.split(re).map((part,i)=>i%2?`<mark>${e(part)}</mark>`:e(part)).join("");
}

function linkText(text,id,links){
  if(!links||!links.length) return esc(text);
  const map={};
  links.forEach(({t,ph})=>ph.forEach(p=>{(map[p]=map[p]||[]).push(t.id);}));
  const ph=Object.keys(map).sort((a,b)=>b.length-a.length);
  const re=new RegExp("("+ph.map(p=>p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","g");
  return text.split(re).map((part,i)=>i%2
    ? `<button type="button" class="hl" data-item="${id}" data-terms="${[...new Set(map[part])].join(" ")}">${esc(part)}</button>`
    : esc(part)).join("");
}

function termsFiltered(){

    if(!visibleTerm(t))return false;
    const exs=liveEx(t).filter(([id])=>exVisible(id));
    if((S.exam||S.q)&&!exs.length)return false;
    if(q&&!termText(t).includes(q)&&!exs.some(([id,n])=>norm(ITEMS[id].t+" "+n).includes(q)))return false;
    return true;});

/* ---------- exam view (시험지형) ---------- */
function renderExam(){
  const qn=norm(S.s), E=S.exam, QS=QUESTIONS[E]||{};
  const per={};
  TERMS.forEach(t=>{
    if(!visibleTerm(t)||(S.cat&&t.c!==S.cat)) return;
    liveEx(t).forEach(([id,,mk])=>{ if(ITEMS[id].e!==E) return; (per[id]=per[id]||[]).push({t,ph:mk||MARK[t.n]||[]}); });
  });
  const src=SOURCES[E];
  let html=src?`<p class="src">지문은 문제지 원본에서 확인하세요 · <a href="${src[1]}" target="_blank" rel="noopener">${esc(src[0])} ↗</a></p>`:"";
  let last=null, nQ=0; const used=new Set();
  Object.keys(QS).map(Number).sort((a,b)=>a-b).forEach(q=>{
    if(S.q&&String(q)!==S.q) return;
    const Qd=QS[q];
    const bogi=Object.keys(ITEMS).filter(id=>ITEMS[id].e===E&&ITEMS[id].q===q&&ITEMS[id].c===0).sort();
    const cids=[1,2,3,4,5].map(c=>ITEM_BY[E+'|'+q+'|'+c]);
    const all=[...bogi,...cids.filter(Boolean)];
    if(S.cat&&!all.some(id=>per[id])) return;
    if(qn){
      const txt=norm(Qd.s+" "+Qd.c.join(" ")+" "+bogi.map(id=>ITEMS[id].t).join(" "));
      if(!txt.includes(qn)&&!all.some(id=>(per[id]||[]).some(x=>norm(x.t.n).includes(qn)))) return;
    }
    const g=(WORKS[E]||[]).find(r=>q>=r[0]&&q<=r[1]);
    if(g&&g!==last){ html+=`<h2 class="grp"><span>[${g[0]}～${g[1]}]</span> ${esc(g[2])}</h2>`; last=g; }
    nQ++; all.forEach(id=>(per[id]||[]).forEach(x=>used.add(x.t.id)));
    html+=`<section class="q"><p class="stem"><b>${q}.</b> ${esc(Qd.s)}</p>`;
    if(bogi.length) html+=`<div class="bogi-box"><span class="bogi-tag">&lt;보기&gt; 중에서</span>${bogi.map(id=>`<p>${linkText(ITEMS[id].t,id,per[id])}</p>`).join("")}</div>`;
    html+=`<ol class="choices">${Qd.c.map((c,i)=>`<li><span class="no">${NO[i+1]}</span><span class="ct">${cids[i]?linkText(c,cids[i],per[cids[i]]):esc(c)}</span></li>`).join("")}</ol></section>`;
  });
  $("count").textContent=`문항 ${nQ}개 · 용어 ${used.size}개 · 형광펜을 누르면 설명이 열립니다`;
  return nQ?html:"";
}

    return `<article class="pop-term">
      <header><h3>${esc(t.n)}</h3><span class="cat">${esc(t.c)}</span></header>
      <dl><dt>뜻</dt><dd>${esc(t.d)}</dd><dt>확인할 것</dt><dd>${esc(t.k)}</dd>${t.p?`<dt>헷갈리는 짝</dt><dd>${esc(t.p)}</dd>`:""}</dl>
      ${noteBlock(t,id)}
      <div class="pop-foot"><button type="button" class="go" data-t="${t.id}">다른 기출에서 보기 (${n})</button>${delBtn(exKey(t,id),d,"이 선지에서 빼기")}</div>
    </article>`;}).join("");
  pop.hidden=false; popFrom=btn;
  document.querySelectorAll(".hl.on").forEach(b=>b.classList.remove("on")); btn.classList.add("on");
  const sheet=window.innerWidth<640;
  pop.classList.toggle("sheet",sheet);
  if(!sheet){
    const r=btn.getBoundingClientRect(), w=Math.min(460,window.innerWidth-32);
    pop.style.width=w+"px";
    let left=r.left+window.scrollX; left=Math.max(16+window.scrollX,Math.min(left,window.scrollX+window.innerWidth-w-16));
    pop.style.left=left+"px"; pop.style.top=(r.bottom+window.scrollY+8)+"px";
    const ph=pop.offsetHeight, below=window.innerHeight-r.bottom;
    if(ph>below-16&&r.top>=ph+16) pop.style.top=(r.top+window.scrollY-ph-8)+"px";
  } else { pop.style.left=pop.style.top=pop.style.width=""; }
  pop.querySelector(".pop-close").focus({preventScroll:true});
}
function closePop(){
  const pop=$("pop"); if(!pop||pop.hidden) return;
  pop.hidden=true; document.querySelectorAll(".hl.on").forEach(b=>b.classList.remove("on"));
  if(popFrom&&document.body.contains(popFrom)) popFrom.focus({preventScroll:true}); popFrom=null;
}
function gotoTerm(tid){
  closePop();
  S.view="abc"; S.exam=""; S.q=""; S.cat=""; S.s=""; $("search").value=""; save(); render();
  const el=document.getElementById(tid); if(!el) return;
  el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll("#views button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S.view));
  document.querySelectorAll("#cats button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===S.cat));
  $("exam").value=S.exam; fillQ();
  const sd=$("showdel"); sd.hidden=!EDITOR||(!DEL.size&&!SHOWDEL);
  sd.setAttribute("aria-pressed",SHOWDEL); sd.textContent=`지운 항목 보기 (${DEL.size})`;
  let html="";
  closePop();
  if(S.view==="exam"){ html=renderExam(); }
  else{
    const ts=termsFiltered();
    if(S.view==="abc"){ html=ts.slice().sort((a,b)=>a.n.localeCompare(b.n,"ko")).map(termCard).join(""); }
    else{ html=CATS.map(c=>{const g=ts.filter(t=>t.c===c);return g.length?`<h2 class="cathead">${c}</h2>`+g.map(termCard).join(""):"";}).join(""); }
    $("count").textContent=`용어 ${ts.length}개`;
  }
  $("out").innerHTML=html||`<p class="empty">조건에 맞는 항목이 없습니다. 검색어나 필터를 바꿔 보세요.</p>`;
}
$("showdel").addEventListener("click",()=>{SHOWDEL=!SHOWDEL;render();});
function say(m){$("msg").textContent=m;}
async function toggleDel(key,on){
  if(!DB)return;
  const ref=DB.collection("deleted").doc(key);
  const prev=DEL.has(key);
  on?DEL.add(key):DEL.delete(key); render();
  try{
    if(on) await ref.set({kind:key.startsWith("t-")?"term":"example",at:new Date().toISOString()});
    else await ref.delete();
    say(on?"삭제했습니다. ‘지운 항목 보기’에서 되살릴 수 있습니다.":"되살렸습니다.");
  }catch(err){
    prev?DEL.add(key):DEL.delete(key); render();
    say(err&&err.code==="invalid_argument"?"이 계정에는 삭제 권한이 없습니다.":"저장하지 못했습니다. 잠시 뒤 다시 눌러 주세요.");
  }
}
$("out").addEventListener("click",e=>{
  const h=e.target.closest(".hl"); if(h){ if(popFrom===h&&!$("pop").hidden) closePop(); else openPop(h); return; }
  const d=e.target.closest(".del"); if(d){toggleDel(d.dataset.key,d.dataset.on==="1");return;}
  const b=e.target.closest(".ref"); if(!b)return;
  const el=document.getElementById(b.dataset.go); if(!el)return;
  el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
});
$("pop").addEventListener("click",e=>{
  if(e.target.closest(".pop-close")){closePop();return;}
  const g=e.target.closest(".go"); if(g){gotoTerm(g.dataset.t);return;}
  const d=e.target.closest(".del"); if(d){closePop();toggleDel(d.dataset.key,d.dataset.on==="1");}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePop();});
document.addEventListener("click",e=>{ if(!e.target.closest("#pop")&&!e.target.closest(".hl")) closePop(); });
window.addEventListener("resize",()=>closePop());
$("sub").textContent=`수능·모평·학평 ${Object.keys(EXAMS).length}회 문학 · 용어 ${TERMS.length}개 · 선지와 <보기> ${Object.keys(ITEMS).length}개`;
render();
(async function initDb(){
  if(DIST||!(window.claude&&window.claude.use))return;
  try{
    const [user,db]=await Promise.all([claude.use("user"),claude.use("db")]);
    if(!db)return;
    DB=db; EDITOR=user?await user.canEdit():false;
    db.collection("deleted").onSnapshot(snap=>{
      DEL.clear(); snap.docs.forEach(d=>{if(d.exists)DEL.add(d.id);}); render();
    },()=>{EDITOR=false;render();});
    render();
  }catch(e){}
})();
</script>

</html>
