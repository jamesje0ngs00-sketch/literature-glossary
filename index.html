<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>문학 선지 용어집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* Layout: 시험지 한 면처럼 좁은 단 하나 — 상단 조작줄, 아래로 용어 카드 또는 문항 묶음 */
:root{
  --paper:#fbfbf8; --card:#ffffff; --ink:#16171b; --muted:#454852; --line:#c7cad2;
  --accent:#233f8c; --accent-bg:#e9edf7; --pen:#a1261d; --flash:#fff3c4; --hl:#fff176;
  --f-display:"Noto Serif KR","Nanum Myeongjo",serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14161b; --card:#1b1e25; --ink:#eceef2; --muted:#b9bdc8; --line:#3a3f4b;
  --accent:#9db2ef; --accent-bg:#232a3d; --pen:#f1907f; --flash:#4a4120; --hl:rgba(255,226,64,.32); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14161b; --card:#1b1e25; --ink:#eceef2; --muted:#b9bdc8; --line:#3a3f4b;
  --accent:#9db2ef; --accent-bg:#232a3d; --pen:#f1907f; --flash:#4a4120; --hl:rgba(255,226,64,.32); color-scheme:dark}

body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:820px;margin:0 auto;padding-block:28px 64px}
h1{font-family:var(--f-display);font-size:30px;line-height:1.3;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:15px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);
  padding-block:14px 12px;margin-top:18px;border-bottom:2px solid var(--ink);display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:15px;font-weight:500;padding:6px 14px;background:transparent;color:var(--ink);border:0;cursor:pointer}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
select,input[type=search]{font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:6px 10px}
input[type=search]{flex:1;min-width:160px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;padding:3px 11px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:700}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.count{font-size:14px;color:var(--muted)}

main{display:flex;flex-direction:column;gap:22px;margin-top:22px}
.cathead{font-family:var(--f-display);font-size:22px;margin:14px 0 0;padding-bottom:4px;border-bottom:1px solid var(--line)}

/* 용어 카드 */
.term{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.term header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.term h3{font-family:var(--f-display);font-size:22px;margin:0}
.cat{font-size:13px;font-weight:500;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 6px;letter-spacing:.02em}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
dt{font-weight:700;font-size:15px;white-space:nowrap;padding-top:1px}
dd{margin:0;min-width:0}
.exs{display:flex;flex-direction:column;gap:12px;margin-top:4px;padding-top:12px;border-top:1px dashed var(--line)}
.ex-label{font-size:14px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.sj{margin:2px 0 0}
.bogi{border:3px double var(--ink);padding:6px 12px;margin-top:4px;border-radius:2px}
.note{margin:6px 0 0;color:var(--ink)}
.note b{color:var(--pen);margin-right:6px}

/* 시험별 */
.q{display:flex;flex-direction:column;gap:14px}
.q h2{font-family:var(--f-display);font-size:24px;margin:0;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:4px}
.q h2 small{font-family:var(--f-body);font-size:14px;font-weight:400;color:var(--muted)}
.item{display:flex;flex-direction:column;gap:10px;min-width:0}
.item-text{font-weight:500}
.item-text .no{font-weight:700;margin-right:4px}
.bogi-tag{font-weight:700;margin-right:6px}
.eterm{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:4px;padding:10px 16px;margin-left:12px;min-width:0}
.eterm h4{font-family:var(--f-display);font-size:19px;margin:0 0 4px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin-left:12px}
.ref{font:inherit;font-size:14px;background:transparent;color:var(--accent);border:1px dashed var(--accent);border-radius:4px;padding:2px 10px;cursor:pointer}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--flash)}100%{background:var(--card)}}
@media (prefers-reduced-motion: reduce){.flash{animation:none;outline:3px solid var(--accent)}}
mark{background:var(--hl);color:inherit;padding:0 1px}
.del{font:inherit;font-size:13px;margin-left:auto;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 9px;cursor:pointer;white-space:nowrap}
.del:hover{color:var(--pen);border-color:var(--pen)}
.ex-head{display:flex;align-items:center;gap:10px}
.deleted{opacity:.5;border-style:dashed}
.deleted .del{opacity:1}
.empty{padding:40px 0;text-align:center;color:var(--muted)}

@media (max-width:520px){
  h1{font-size:25px}
  dl{grid-template-columns:1fr} dt{padding-top:6px}
  .eterm,.refs{margin-left:0}
  .term{padding:14px 14px}
}
</style>

<div class="wrap">
  <h1>문학 선지 용어집</h1>
  <p class="sub" id="sub"></p>

  <div class="bar">
    <div class="row">
      <div class="seg" role="group" aria-label="보기 방식" id="views">
        <button type="button" data-v="exam">시험별</button>
        <button type="button" data-v="abc">가나다순</button>
        <button type="button" data-v="cat">갈래별</button>
      </div>
      <select id="exam" aria-label="시험"></select>
      <select id="qsel" aria-label="문항"></select>
      <input type="search" id="search" placeholder="용어·선지 검색" aria-label="검색">
    </div>
    <div class="row">
      <div class="chips" id="cats" role="group" aria-label="갈래"></div>
      <span class="count" id="count"></span>
      <button type="button" class="chip" id="showdel" hidden>지운 항목 보기</button>
      <span class="count" id="msg" role="status"></span>
    </div>
  </div>

  <main id="out"></main>
</div>

<script>
const CATS = ["표현법","태도·정서","시상 전개·이미지","서술·인물","갈래·맥락"];
const EXAMS = { "26수능": "2026학년도 수능 (홀수형)" };
EXAMS["26-3학평"] = "2026학년도 3월 고3 학평";
EXAMS["26-5학평"] = "2026학년도 5월 고3 학평";

EXAMS["27-9모평"] = "2027학년도 9월 모평";
EXAMS["26-10학평"] = "2026학년도 10월 고3 학평";

const NO = ["","①","②","③","④","⑤"];
const WORKS = {
  "26수능": [
    [18,21,"작자 미상, 「수궁가」"],
    [22,26,"이시영, 「그리움」 · 고재종, 「감나무 그늘 아래」 · 이이, 「최립에게 주는 글」"],
    [27,30,"박태순, 「독가촌 풍경」"],
    [31,34,"구강, 「북새곡」 · 작자 미상, 사설시조"]

WORKS["26-3학평"] = [[18, 22, "이성복, 「서해」 · 김기택, 「어떻게 기억해 냈을까」 · 유경종, 「의원지」"], [23, 26, "안도환, 「만언사」"], [27, 30, "이문열, 「들소」"], [31, 34, "작자 미상, 「수매청심록」"]];
WORKS["26-5학평"] = [[18, 21, "이동하, 「모래」"], [22, 26, "윤동주, 「흐르는 거리」 · 고정희, 「따뜻한 동행」 · 남유용, 「난설」"], [27, 30, "작자 미상, 「노인가」 · 작자 미상, 사설시조 · 김득연, 「영회잡곡」"], [31, 34, "작자 미상, 「방주전」"]];
WORKS["27-6모평"] = [[18, 21, "하근찬, 「나룻배 이야기」"], [22, 27, "김명인, 「그 나무」 · 김기택, 「나무」 · 정지용, 「노인과 꽃」"], [28, 31, "작자 미상, 「홍길동전」"], [32, 34, "작자 미상, 「만전춘별사」 · 김수장 · 이정보"]];
WORKS["26-7학평"] = [[18, 21, "작자 미상, 「화산중봉기」"], [22, 25, "양귀자, 「한 마리의 나그네 쥐」"], [26, 31, "김약련, 「과폐탄」 · 윤기, 「한거필담」"], [32, 34, "박목월, 「회귀심」 · 김명인, 「분수」"]];
WORKS["27-9모평"] = [[18, 21, "작자 미상, 「금환기봉」"], [22, 27, "장옥관, 「가오리 날아오르다」 · 김혜순, 「잘 익은 사과」 · 박지원, 「공작관문고 자서」"], [28, 31, "박화성, 「고향 없는 사람들」"], [32, 34, "이진유, 「속사미인곡」"]];
WORKS["26-10학평"] = [[18, 22, "송수권, 「등꽃 아래서」 · 김기택, 「어둠도 자세히 보면 환하다」 · 박지원, 「소완정기」"], [23, 26, "홍계영, 「희설」"], [27, 30, "이호철, 「이단자 1」"], [31, 34, "작자 미상, 「숙영낭자전」"]];
/* 선지·<보기> 문장. c=0 은 <보기> */
const ITEMS = {
 "26-19-3":{e:"26수능",q:19,c:3,t:"㉢은 호랑이가 안도감을 나타내는 공간으로, 이곳에서 호랑이는 살아남은 것을 자신의 능력을 넘어서는 뜻밖의 행운이라고 여겼다."},
 "26-21-0":{e:"26수능",q:21,c:0,t:"「수궁가」는 우화에서 판소리 사설로 발전한 작품입니다."},
 "26-21-1":{e:"26수능",q:21,c:1,t:"‘사냥개’에 대한 토끼의 평가에서, 현실에서 사냥개가 사람에게 길들여진 것을 우화 속 상황에 중첩함으로써 강자의 환심을 사 이익을 얻는 인간에 대한 비판이 드러남을 알 수 있군."},
 "26-21-2":{e:"26수능",q:21,c:2,t:"자라가 ‘동의보감’을 떠올린 데서, 현실의 의서를 우화 속 상황에 중첩함으로써 명약을 탐하는 속내를 지식을 내세워 숨기는 위선적 인간에 대한 비판이 드러남을 알 수 있군."},
 "26-21-3":{e:"26수능",q:21,c:3,t:"‘포수’에 대한 호랑이의 태도에서, 현실의 인간이 지닌 힘을 우화 속 인물들의 위계질서에 중첩함으로써 권력자가 상대에 대한 두려움을 보여 위신을 잃는 상황이 강조됨을 알 수 있군."},
 "26-21-5":{e:"26수능",q:21,c:5,t:"호랑이가 ‘해남’에서 ‘압록강 가’까지 뛴 데서, 현실의 지명을 우화 속 공간에 중첩함으로써 실제라면 단숨에 닿기 불가능한 거리를 이동하는 상황이 과장되게 표현된 것임을 알 수 있군."},
 "26-22-1":{e:"26수능",q:22,c:1,t:"(가)는 계절을 나타내는 소재로 시적 분위기를 조성하고 있다."},
 "26-22-2":{e:"26수능",q:22,c:2,t:"(나)는 자연을 관조하며 시적 상황을 탈속적 태도로 바라보고 있다."},
 "26-22-3":{e:"26수능",q:22,c:3,t:"(다)는 글쓴이와 타인의 생각을 비교하며 세태를 비판하고 있다."},
 "26-22-4":{e:"26수능",q:22,c:4,t:"(가)와 (다)는 모두, 연쇄적 표현을 통해 주체의 태도 변화 과정을 보여 주고 있다."},
 "26-22-5":{e:"26수능",q:22,c:5,t:"(나)와 (다)는 모두, 가정적 표현을 통해 대상의 속성을 드러내고 있다."},
 "26-23-0a":{e:"26수능",q:23,c:0,t:"(가)는 연대를 상실한 암울한 현실 상황을 어두운 밤으로 표상하고, 빛이 회복되는 미래에 대한 소망을 드러낸다."},
 "26-23-0b":{e:"26수능",q:23,c:0,t:"이러한 소망은 소금을 뿌리며 그리운 이를 찾아다니는 행동으로 형상화된다."},
 "26-23-0c":{e:"26수능",q:23,c:0,t:"이러한 성찰은 자연물과 내면을 동일시하며 시간의 흐름에 따른 변화의 양상을 그려 내는 방식으로 나타난다."},
 "26-23-2":{e:"26수능",q:23,c:2,t:"(가)에서 ‘오던 길’을 ‘소금들’이 ‘환히 비춰 주’는 것은, ‘두고 온 것들’이 되살아날 미래를 기대하게 한다는 점에서 빛의 회복에 대한 소망이 실현될 수 있음을 암시하겠군."},
 "26-23-3":{e:"26수능",q:23,c:3,t:"(나)에서 ‘반짝’이는 ‘잎새’와 ‘그늘’을 함께 지닌 ‘감나무’ 아래에 ‘평상을 놓’는 것은, 밝음과 어두움이 어우러져 있는 자연에서 내면에 대한 성찰을 이어 가고 있음을 나타내는군."},
 "26-24-1":{e:"26수능",q:24,c:1,t:"㉠이 ‘목메이게 부르짖’는 것과 ㉡을 찾고자 ‘숨가쁘게’ 길을 넘는 것에는 모두, 대상을 향한 간절한 마음이 드러난다."},
 "26-26-0":{e:"26수능",q:26,c:0,t:"(다)는 마음에서 기가 움직여 뜻이 소리로 나오는 데 있어 도리에 합당해야 좋은 글[文]이라는 글쓴이의 문학론을 바탕으로, 상대의 문장을 평가하며 칭찬과 당부를 전하고 있다."},
 "26-26-1":{e:"26수능",q:26,c:1,t:"‘만물’이 소리 나는 이치에서 시작하여 ‘사람’이 소리를 내는 이치를 밝히며, 소리를 화두로 삼아 문장에 대해 말하고 있군."},
 "26-26-4":{e:"26수능",q:26,c:4,t:"최립의 문장에 담긴 ‘뜻’이 도리에 합당함을 향하고 있음을 언급하며, 그가 학업에 정진할 것을 당부하고 있군."},
 "26-26-5":{e:"26수능",q:26,c:5,t:"글로 드러난 최립의 소리가 크게 나는 것이 그의 ‘마음’과 ‘기’에서 비롯됨을 언급하여, 그의 문장이 뜻을 크게 드러내고 있음을 칭찬하고 있군."},
 "26-27-5":{e:"26수능",q:27,c:5,t:"온 씨가 공격적인 태도를 보이자 허명두는 에둘러 말하여 상대의 관심을 다른 곳으로 돌릴 수 있었다."},
 "26-27-4":{e:"26수능",q:27,c:4,t:"온 씨는 상대의 행위를 평가하는 표현을 반복하며 허명두에게 꾸미고 있는 일을 그만두라고 경고하였다."},

Object.assign(ITEMS, {"m3-18-1": {"e": "26-3학평", "q": 18, "c": 1, "t": "(가), (다)와 달리 (나)는 자연물을 활용하여 특정 계절의 분위기를 자아내고 있다."}, "m3-18-3": {"e": "26-3학평", "q": 18, "c": 3, "t": "(가)는 음성상징어를, (나)와 (다)는 현재형 진술을 활용하여 생동감을 부여하고 있다."}, "m3-18-4": {"e": "26-3학평", "q": 18, "c": 4, "t": "(가)는 의문형 어미를, (나)와 (다)는 감탄형 어미를 활용하여 예찬적 태도를 드러내고 있다."}, "m3-18-5": {"e": "26-3학평", "q": 18, "c": 5, "t": "(가)~(다)는 모두 원근을 나타내는 지시 표현을 사용하여 대상에 대한 경외심을 강조하고 있다."}, "m3-18-2": {"e": "26-3학평", "q": 18, "c": 2, "t": "(가), (나)와 달리 (다)는 대화의 형식을 활용하여 인물 간의 친밀감을 드러내고 있다."}, "m3-19-1": {"e": "26-3학평", "q": 19, "c": 1, "t": "[A]에서 ‘웃음’과 ‘발걸음’, [B]에서 ‘웃음’과 ‘걸음’은 문장 성분의 의도적 배치를 통해 주목의 대상으로 제시된다."}, "m3-19-4": {"e": "26-3학평", "q": 19, "c": 4, "t": "[A]의 ‘발걸음’에서 ‘햇빛 향기’로 이어지는 연쇄는 [B]에서의 ‘걸음’이 ‘걷지 않아도 저절로 나아가는’ 것임을 나타낸다."}, "m3-19-5": {"e": "26-3학평", "q": 19, "c": 5, "t": "[A]의 ‘스스로 넘치고 무거워져서 떨어지는 웃음’은 [B]에서 ‘저절로 익어 흘러나온 웃음’에 대응되면서, ‘외로운 추수꾼’이 스스로 충만한 존재임을 드러낸다."}, "m3-21-0": {"e": "26-3학평", "q": 21, "c": 0, "t": "(가), (나), (다)는 각각 ‘서해’, ‘고층 빌딩 사무실’, ‘원림’이라는 공간을 바탕으로 삼아 상상의 공간을 창출하고, 이 과정에서 동시적으로 구현된 공간들 간의 대비를 드러낸다."}, "m3-21-3": {"e": "26-3학평", "q": 21, "c": 3, "t": "(나)에서 ‘서류 뭉치를 나르’는 행위는 ‘방금 딴 사과가 가득한 상자를 들고’ 움직이는 행위와 동일시되면서 현실과 상상의 공간이 동시적으로 구현되는 양상을 나타내고 있군."}, "m3-23-1": {"e": "26-3학평", "q": 23, "c": 1, "t": "자연의 영원성과 대조되는 인간사의 무상함을 절제된 어조로 표현하고 있다."}, "m3-23-2": {"e": "26-3학평", "q": 23, "c": 2, "t": "어지러운 세태를 제시하고 이에 거리를 두어 관조하는 태도를 드러내고 있다."}, "m3-23-3": {"e": "26-3학평", "q": 23, "c": 3, "t": "원경에서 근경으로 시선을 이동하며 주변 경치를 관찰하고 느낀 감상을 표출하고 있다."}, "m3-23-4": {"e": "26-3학평", "q": 23, "c": 4, "t": "자연에서의 낯선 경험을 구체적으로 묘사하여 탈속적 이상향을 향한 동경을 강조하고 있다."}, "m3-23-5": {"e": "26-3학평", "q": 23, "c": 5, "t": "스스로 질문을 던지고 답변을 제시하는 형식을 반복하여 상황에 대한 인식을 드러내고 있다."}, "m3-24-1": {"e": "26-3학평", "q": 24, "c": 1, "t": "㉠ : 명령형 표현을 사용하여 이어지는 내용에 대한 집중을 유도하고 있다."}, "m3-24-2": {"e": "26-3학평", "q": 24, "c": 2, "t": "㉡ : 유사한 문장 구조를 대응시켜 상대의 언행에 대한 반응을 강조하고 있다."}, "m3-24-3": {"e": "26-3학평", "q": 24, "c": 3, "t": "㉢ : 상반된 행위를 연달아 배치하여 자신의 능력에 대한 자각을 드러내고 있다."}, "m3-24-4": {"e": "26-3학평", "q": 24, "c": 4, "t": "㉣ : 과장된 표현을 통해 자신의 처지를 부각하고 있다."}, "m3-24-5": {"e": "26-3학평", "q": 24, "c": 5, "t": "㉤ : 열거의 방식을 통해 현재 상황에 대한 신체적 반응을 구체화하고 있다."}, "m3-28-2": {"e": "26-3학평", "q": 28, "c": 2, "t": "㉡ : 사냥을 앞둔 소년들의 긴장감을 청각적 경험과 함께 제시하고 있다."}, "m3-28-4": {"e": "26-3학평", "q": 28, "c": 4, "t": "㉣ : 인물의 심리를 대상에 투영하여 대상의 움직임에 의도를 부여하고 있다."}, "m3-29-1": {"e": "26-3학평", "q": 29, "c": 1, "t": "빈번하게 장면을 전환하여 인물들 사이에 긴장감을 조성하고 있다."}, "m3-29-2": {"e": "26-3학평", "q": 29, "c": 2, "t": "초점화된 인물의 시선을 통해 사건의 국면을 상세히 서술하고 있다."}, "m3-29-3": {"e": "26-3학평", "q": 29, "c": 3, "t": "과거를 회상하는 표현을 통해 갈등 해결의 실마리를 제시하고 있다."}, "m3-29-5": {"e": "26-3학평", "q": 29, "c": 5, "t": "인용 부호를 생략한 발화를 제시하여 사건을 바라보는 인물의 내면을 드러내고 있다."}, "m3-30-0": {"e": "26-3학평", "q": 30, "c": 0, "t": "이 과정에서 들소는 물리적 살생의 대상에서 예술적 형상화의 대상으로 재규정된다."}, "m5-19-1": {"e": "26-5학평", "q": 19, "c": 1, "t": "㉠: 특정 인물의 생각을 직접적으로 드러내어 서술하고 있다."}, "m5-19-3": {"e": "26-5학평", "q": 19, "c": 3, "t": "㉢: 특정 인물의 생각을 서술자의 관점으로 평가하는 방식으로 서술하고 있다."}, "m5-19-5": {"e": "26-5학평", "q": 19, "c": 5, "t": "㉤: 상황에 대한 인물들의 반응을 관용 표현을 활용하여 서술하고 있다."}, "m5-22-1": {"e": "26-5학평", "q": 22, "c": 1, "t": "(가)는 영탄적 표현을 활용하여 대상에 대한 정서를 심화하고 있다."}, "m5-22-2": {"e": "26-5학평", "q": 22, "c": 2, "t": "(나)는 가정적 표현을 활용하여 현재 상황에 대한 원인을 포착하고 있다."}, "m5-22-3": {"e": "26-5학평", "q": 22, "c": 3, "t": "(다)는 음성 상징어를 활용하여 대상의 특징을 드러내고 있다."}, "m5-22-4": {"e": "26-5학평", "q": 22, "c": 4, "t": "(가)는 계절감을 드러내는 표현을 활용하여, (나)는 묘사의 방식을 활용하여 대상에서 촉발된 인상을 표현하고 있다."}, "m5-22-5": {"e": "26-5학평", "q": 22, "c": 5, "t": "(가), (나), (다)는 모두, 반어적 표현을 활용하여 주제 의식을 드러내고 있다."}, "m5-24-0": {"e": "26-5학평", "q": 24, "c": 0, "t": "이 과정에서 시적 대상의 이미지의 반복, 과장, 대비, 전이 등을 통해 시적 세계는 형상화된다."}, "m5-24-3": {"e": "26-5학평", "q": 24, "c": 3, "t": "(가)의 ‘안개’가 ‘끝없이’ 흐른다는 표현과 (나)의 ‘강물’과 ‘강물’이 ‘온누리’를 ‘껴안’고 ‘삼라의 뜻을 돌아’온다는 표현은, 과장을 활용하여 현실 세계에 대한 화자의 인식을 자연물의 동적 이미지로 형상화한 것이겠군."}, "m5-24-5": {"e": "26-5학평", "q": 24, "c": 5, "t": "(가)의 ‘금휘장’에 ‘금단추’를 단 ‘배달부’가 ‘찬란히 나타’난다는 표현은 감각의 전이를, (나)의 ‘따뜻하고 드맑은 강물’ 위에 ‘가야금소리’가 ‘깃’든다는 표현은 감각적 이미지의 반복을 활용하여 시적 대상의 긍정적 이미지를 재구성한 것이겠군."}, "m5-27-1": {"e": "26-5학평", "q": 27, "c": 1, "t": "(가)는 대구의 방식을 통해 시적 상황을 부각하고 있다."}, "m5-27-2": {"e": "26-5학평", "q": 27, "c": 2, "t": "(나)는 나열의 방식을 통해 운율감을 형성하고 있다."}, "m5-27-3": {"e": "26-5학평", "q": 27, "c": 3, "t": "(다)는 유사한 문장 구조를 반복하여 시적 의미를 강조하고 있다."}, "m5-27-4": {"e": "26-5학평", "q": 27, "c": 4, "t": "(가)와 (나)는 모두, 색채어를 활용하여 대상의 속성을 드러내고 있다."}, "m5-27-5": {"e": "26-5학평", "q": 27, "c": 5, "t": "(가)와 (다)는 모두, 의인화된 대상을 활용하여 화자의 정서를 드러내고 있다."}, "m5-28-3": {"e": "26-5학평", "q": 28, "c": 3, "t": "㉢: 대상의 상황에 대한 가정을 바탕으로 세상일에 대한 깨달음을 드러내고 있다."}, "m5-28-4": {"e": "26-5학평", "q": 28, "c": 4, "t": "㉣: 역사적 인물의 행적을 서술하며 인물에 대한 평가를 드러내고 있다."}, "m5-30-0": {"e": "26-5학평", "q": 30, "c": 0, "t": "고전 시가에서 노년의 삶은 화자가 늙음에 대해 성찰하고 현재 삶의 의미를 재정립하는 계기로 작용하기도 한다."}, "m5-32-4": {"e": "26-5학평", "q": 32, "c": 4, "t": "[A]는 상대의 변화에 의미를 부여하며 앞으로의 행동을 당부하고 있고, [B]는 자신의 행위로 인해 발생할 수 있는 상반된 상황을 언급하고 있다."}, "m5-34-3": {"e": "26-5학평", "q": 34, "c": 3, "t": "‘부인’에게 ‘천상의 보배’를 건네며 ‘큰 공을 이루라’고 당부하는 선관의 모습에서, 인물이 정당한 가치 실현을 위한 행동에 나설 수 있도록 초월적 존재가 유도하고 있음을 알 수 있군."}, "m6-21-0": {"e": "27-6모평", "q": 21, "c": 0, "t": "이 작품에는 인물의 모습을 묘사하는 진술과 그 인물 내면의 목소리를 드러내는 진술이 인접한 경우가 있다."}, "m6-22-1": {"e": "27-6모평", "q": 22, "c": 1, "t": "상황의 대비를 통해 주제 의식을 드러내고 있다."}, "m6-22-2": {"e": "27-6모평", "q": 22, "c": 2, "t": "공간의 이동에 따라 대상의 변화를 그려 내고 있다."}, "m6-22-3": {"e": "27-6모평", "q": 22, "c": 3, "t": "계절의 흐름을 통해 애상적 분위기를 고조하고 있다."}, "m6-22-4": {"e": "27-6모평", "q": 22, "c": 4, "t": "말을 주고받는 방식으로 대상과의 친밀감을 드러내고 있다."}, "m6-22-5": {"e": "27-6모평", "q": 22, "c": 5, "t": "가상의 상황을 설정하여 현실에 대한 비판을 드러내고 있다."}, "m6-23-5": {"e": "27-6모평", "q": 23, "c": 5, "t": "‘흘러다니고 있다’에는 ‘나무’의 ‘무늬’에서 물 속 생명체의 움직임 같은 운동성이 느껴진다는 인식이 담겨 있군."}, "m6-30-0": {"e": "27-6모평", "q": 30, "c": 0, "t": "고전소설에서는 주인공이 속임수로 상대를 속이는 ‘속임수담’이 나타나기도 하는데, 여기에는 ‘속이는 이, 속는 이, 속이는 의도, 속이는 방법, 속인 결과’가 포함돼요."}, "m6-31-0": {"e": "27-6모평", "q": 31, "c": 0, "t": "이 사건은 이본에 따라 그 양상이 다르게 나타난다."}, "m6-31-3": {"e": "27-6모평", "q": 31, "c": 3, "t": "길동이 ‘대저 나라는 한 사람의 그릇이 아니라’며 ‘성탕’과 ‘무왕’의 일을 인용하는 것에서, 주인공이 내세운 정벌의 명분이 역사적 사례와 동격으로 제시되고 있음을 알 수 있군."}, "m6-33-2": {"e": "27-6모평", "q": 33, "c": 2, "t": "색채 표현인 ‘푸른’을 통해 시적 공간의 이미지를 시각화하고 있다."}, "m6-33-3": {"e": "27-6모평", "q": 33, "c": 3, "t": "음성 상징어인 ‘풍덩’을 통해 대상의 무게감을 실감나게 표현하고 있다."}, "m6-33-4": {"e": "27-6모평", "q": 33, "c": 4, "t": "상황을 가정한 표현인 ‘띄워 두면’을 통해 대상을 화자와 분리된 상태인 것처럼 제시하고 있다."}, "m6-34-2": {"e": "27-6모평", "q": 34, "c": 2, "t": "(나)에서 시적 대상을 ‘강물’에 ‘떠다니’는 것으로 표현한 것은, 심적 상태를 형체가 있는 사물로 형상화한 것이군."}, "m7-20-1": {"e": "26-7학평", "q": 20, "c": 1, "t": "[A]는 인물의 행적을 요약적으로 제시하며 해당 인물에 대한 평가를 드러내고 있다."}, "m7-20-4": {"e": "26-7학평", "q": 20, "c": 4, "t": "[A]는 관용적 표현을 사용하여, [B]는 초월적 존재를 언급하여 자신의 생각을 강조하고 있다."}, "m7-21-0": {"e": "26-7학평", "q": 21, "c": 0, "t": "「화산중봉기」는 남녀 주인공의 결연과 이별, 그리고 재회 과정을 다양한 화소를 활용하여 드러낸 작품이다."}, "m7-22-1": {"e": "26-7학평", "q": 22, "c": 1, "t": "과거 회상을 통해 인물의 내적 갈등을 드러내고 있다."}, "m7-22-2": {"e": "26-7학평", "q": 22, "c": 2, "t": "감각적인 표현을 활용하여 인물의 심리를 드러내고 있다."}, "m7-22-3": {"e": "26-7학평", "q": 22, "c": 3, "t": "인용 부호 없이 대상에 대한 인물의 생각을 드러내고 있다."}, "m7-22-5": {"e": "26-7학평", "q": 22, "c": 5, "t": "비유적인 표현을 활용하여 인물이 위치한 공간에 대한 인상을 드러내고 있다."}, "m7-25-1": {"e": "26-7학평", "q": 25, "c": 1, "t": "‘사내’와 관련된 소문을 둘러싸고 동네 사람들이 대화를 나누는 장면과 사내가 ‘숲을 헤매’는 장면을 대비하여 교차 서술하고 있군."}, "m7-25-5": {"e": "26-7학평", "q": 25, "c": 5, "t": "사내의 행방에 대한 대화를 ‘귀신 씻나락 까먹는 소리’라고 평하며 ‘자는 기 남는’ 것이라고 말하는 모습에서, 타인의 삶이 피상적으로 소비되는 세태를 엿볼 수 있군."}, "m7-26-1": {"e": "26-7학평", "q": 26, "c": 1, "t": "인물 간의 대화를 통해 대상의 본질을 밝히고 있다."}, "m7-26-2": {"e": "26-7학평", "q": 26, "c": 2, "t": "성현의 행적을 나열하여 대상의 특성을 구체화하고 있다."}, "m7-26-3": {"e": "26-7학평", "q": 26, "c": 3, "t": "음성 상징어를 활용하여 대상의 움직임을 강조하고 있다."}, "m7-26-4": {"e": "26-7학평", "q": 26, "c": 4, "t": "시공간의 이동에 따라 대상의 변화 과정을 드러내고 있다."}, "m7-26-5": {"e": "26-7학평", "q": 26, "c": 5, "t": "설의적 표현을 사용하여 대상에 대한 인식을 드러내고 있다."}, "m7-32-2": {"e": "26-7학평", "q": 32, "c": 2, "t": "현재 시제를 사용하여 시적 상황을 드러내고 있다."}, "m7-32-3": {"e": "26-7학평", "q": 32, "c": 3, "t": "하강적 이미지를 통해 계절적 배경을 보여 주고 있다."}, "m7-32-4": {"e": "26-7학평", "q": 32, "c": 4, "t": "의문형 어미를 사용하여 화자의 정서를 강조하고 있다."}, "m7-32-5": {"e": "26-7학평", "q": 32, "c": 5, "t": "명사로 시행을 종결하여 화자의 의지를 부각하고 있다."}, "m9-22-2": {"e": "27-9모평", "q": 22, "c": 2, "t": "(나)는 (가)와 달리, 감탄의 표현을 활용하여 고조된 감정을 드러내고 있다."}, "m9-22-3": {"e": "27-9모평", "q": 22, "c": 3, "t": "(나)는 (다)와 달리, 현재와 미래의 상황을 대비하여 인식의 변화를 강조하고 있다."}, "m9-22-4": {"e": "27-9모평", "q": 22, "c": 4, "t": "(다)는 (나)와 달리, 특정 상황을 가정하여 변화된 시대상에 대해 비판적 태도를 드러내고 있다."}, "m9-24-0": {"e": "27-9모평", "q": 24, "c": 0, "t": "여기에는 세계에 대한 화자의 시각이 투영되어 있다."}, "m9-26-0": {"e": "27-9모평", "q": 26, "c": 0, "t": "박지원은 [C]에서 이명과 코골이의 비유를 통해 작가의 창작 및 독자의 감상에 대해 다루고 있어요."}, "m9-27-1": {"e": "27-9모평", "q": 27, "c": 1, "t": "㉠은 소나무가 펴지는 듯한 이미지와 만월이 뜨는 이미지를 연결하여 형상화한 표현이다."}, "m9-27-3": {"e": "27-9모평", "q": 27, "c": 3, "t": "㉢은 계절의 풍요로움과 이와 대비되는 화자의 불안을 함께 암시하는 표현이다."}, "m9-29-4": {"e": "27-9모평", "q": 29, "c": 4, "t": "[D]에서 간접 인용을 통해 전달된 인물의 상황은 [A]에서도 확인된다."}, "m9-29-5": {"e": "27-9모평", "q": 29, "c": 5, "t": "[E]에서 인물이 관용 표현을 사용해 대화 상대를 책망하는 일은 [B]에서도 나타난다."}, "m9-31-0": {"e": "27-9모평", "q": 31, "c": 0, "t": "정치적․경제적 이유 등으로 어쩔 수 없이 삶의 터전을 떠나온 이들, 즉 디아스포라는 고향으로 돌아갈 수도, 타향에 뿌리내릴 수도 없는 상황에 놓여 있다."}, "m9-32-1": {"e": "27-9모평", "q": 32, "c": 1, "t": "㉠은 계절적 배경을 제시하여, 화자의 적적한 정서를 부각하고 있다."}, "m9-32-3": {"e": "27-9모평", "q": 32, "c": 3, "t": "㉢은 의문형 종결 표현을 통해, 화자의 안타까운 심정을 강조하고 있다."}, "m9-32-4": {"e": "27-9모평", "q": 32, "c": 4, "t": "㉣은 고사를 바탕으로 상황을 가정하여, 화자의 바람을 드러내고 있다."}, "m9-32-5": {"e": "27-9모평", "q": 32, "c": 5, "t": "㉤은 임을 자연물에 비유하여, 화자와 임의 정서적 유대감이 심화됨을 나타내고 있다."}, "m9-34-0a": {"e": "27-9모평", "q": 34, "c": 0, "t": "「속사미인곡」은 낯선 섬에 유배된 사대부 작가의 유배 가사이다."}, "m9-34-0b": {"e": "27-9모평", "q": 34, "c": 0, "t": "「속사미인곡」의 화자는 임금과 함께했던 과거를 그리워하며, 자신의 삶을 성찰하는 가운데 심적 고통을 토로한다."}, "m10-18-1": {"e": "26-10학평", "q": 18, "c": 1, "t": "(가)는 (나)와 달리 음성 상징어를 사용하여 중심 제재의 역동적인 측면을 부각하고 있다."}, "m10-18-2": {"e": "26-10학평", "q": 18, "c": 2, "t": "(나)는 (다)와 달리 어조의 변화를 통해 현실 극복의 의지를 강조하고 있다."}, "m10-18-3": {"e": "26-10학평", "q": 18, "c": 3, "t": "(가), (다)는 (나)와 달리 의문의 형식을 활용하여 주제 의식을 드러내고 있다."}, "m10-18-4": {"e": "26-10학평", "q": 18, "c": 4, "t": "(나), (다)는 (가)와 달리 공간을 감각적으로 묘사하여 대상이 환기하는 정서를 구체화하고 있다."}, "m10-18-5": {"e": "26-10학평", "q": 18, "c": 5, "t": "(가)~(다)는 모두 과거와 현재를 대비하여 미래에 대한 낙관적 인식을 나타내고 있다."}, "m10-19-2": {"e": "26-10학평", "q": 19, "c": 2, "t": "1연에서 ‘기쁨’과 ‘슬픔’은 ‘반반씩 버무린 색깔’로 어우러지고 ‘반반씩 한꺼번에 녹아 흐르’는 것으로 형상화되어 감정의 복합적인 양상을 드러낸다."}, "m10-21-4": {"e": "26-10학평", "q": 21, "c": 4, "t": "(가)의 화자가 자신의 내면과 ‘지등의 불빛’ 간의 유사성에 주목하고 (다)의 글쓴이가 ‘빛이 널리 퍼져 정기가 흩어지’는 것을 경계하는 것은, 응시를 통해 포착한 대상의 속성에 비추어 내면을 성찰하였음을 드러내는 것이겠군."}, "m10-23-1": {"e": "26-10학평", "q": 23, "c": 1, "t": "시선의 이동을 따라 특정 계절의 풍속을 묘사하고 있다."}, "m10-23-2": {"e": "26-10학평", "q": 23, "c": 2, "t": "역사적 인물들을 호명하여 회고적 분위기를 조성하고 있다."}, "m10-23-4": {"e": "26-10학평", "q": 23, "c": 4, "t": "주변의 사물에 감정을 투영하여 세태를 우회적으로 비판하고 있다."}, "m10-24-4": {"e": "26-10학평", "q": 24, "c": 4, "t": "㉣ : ‘바위’의 형상에서 비롯된 가정적 상황을 제시하여 대상에 생명력을 부여하고 있다."}, "m10-27-1": {"e": "26-10학평", "q": 27, "c": 1, "t": "시간의 순서를 뒤바꾸어 이야기의 인과 관계를 재구성하고 있다."}, "m10-27-2": {"e": "26-10학평", "q": 27, "c": 2, "t": "이야기 외부의 서술자가 인물들의 대비된 입장을 드러내고 있다."}, "m10-27-3": {"e": "26-10학평", "q": 27, "c": 3, "t": "추측이 담긴 진술을 통해 인물과 사건에 대한 주관적 인식을 드러내고 있다."}, "m10-27-4": {"e": "26-10학평", "q": 27, "c": 4, "t": "상징적 소재를 반복적으로 제시하여 갈등 해결의 실마리를 암시하고 있다."}, "m10-27-5": {"e": "26-10학평", "q": 27, "c": 5, "t": "여러 인물의 내적 독백을 나열하여 인물의 성격을 입체적으로 보여 주고 있다."}, "m10-34-1": {"e": "26-10학평", "q": 34, "c": 1, "t": "‘옥연동’에서 ‘귀양살이’하는 숙영이 선군의 ‘병이 위중한 것’을 알고 ‘세 가지 약’을 건네준 것에서, 숙영이 초월적 능력을 지닌 천상의 존재임을 알 수 있군."}});

 "합리화":["합리화"], "상대의 생각 헤아리기":["헤아림"], "에둘러 말하기":["에둘러 말하여"], "화자의 대상화":["대상화"],
 "공간의 의미":["안도감을 나타내는 공간"], "우화":["우화"], "판소리 사설과 장단":["판소리 사설"], "중첩":["중첩"],
 "풍자·비판":["비판"], "위선":["위선적"], "위계질서":["위계질서"], "세태 비판":["세태를 비판"], "문학론":["문학론"],
 "화두":["화두"], "칭찬과 당부":["당부","칭찬"]
};
function markText(text, phrases){
  const ph=[...new Set(phrases)].sort((a,b)=>b.length-a.length);
  const e=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  if(!ph.length) return e(text);
  const re=new RegExp("("+ph.map(p=>p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","g");
  return text.split(re).map((part,i)=>i%2?`<mark>${e(part)}</mark>`:e(part)).join("");
}

/* ---------- state ---------- */
const S = {view:"exam", exam:"26수능", q:"", cat:"", s:""};
const DEL = new Set(BAKED_DELETED||[]);
let EDITOR=false, SHOWDEL=false, DB=null;
const exKey=(t,id)=>"e-"+t.id.slice(2)+"-"+id;
const isTermDel=t=>DEL.has(t.id);
const isExDel=(t,id)=>DEL.has(exKey(t,id));
const visibleTerm=t=>SHOWDEL||!isTermDel(t);
const liveEx=t=>t.ex.filter(([id])=>SHOWDEL||(!isExDel(t,id)&&!isTermDel(t)));
function delBtn(key,isDel,lab){return EDITOR?`<button type="button" class="del" data-key="${key}" data-on="${isDel?0:1}">${isDel?"되살리기":lab}</button>`:"";}
try{const v=JSON.parse(localStorage.getItem("glossary-state")||"{}"); if(v.view) S.view=v.view; if(v.cat!=null) S.cat=v.cat;}catch(e){}
function save(){try{localStorage.setItem("glossary-state",JSON.stringify({view:S.view,cat:S.cat}))}catch(e){}}

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.toLowerCase();
function workOf(e,q){const w=(WORKS[e]||[]).find(r=>q>=r[0]&&q<=r[1]);return w?w[2]:"";}
function label(id){const it=ITEMS[id];return `${it.e} ${it.q}번 ${it.c?NO[it.c]:"<보기>"}`;}
function itemKey(id){const it=ITEMS[id];return it.q*10+it.c;}

/* ---------- controls ---------- */
$("exam").innerHTML = `<option value="">전체 시험</option>`+Object.entries(EXAMS).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("");
function fillQ(){
  const qs=[...new Set(Object.values(ITEMS).filter(i=>!S.exam||i.e===S.exam).map(i=>i.q))].sort((a,b)=>a-b);
  $("qsel").innerHTML=`<option value="">전체 문항</option>`+qs.map(q=>`<option value="${q}">${q}번</option>`).join("");
  $("qsel").value=S.q;
}
$("cats").innerHTML=[["","전체"],...CATS.map(c=>[c,c])].map(([v,l])=>`<button type="button" class="chip" data-c="${v}">${l}</button>`).join("");

$("views").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.view=b.dataset.v;if(S.view==="exam"&&!S.exam){S.exam=Object.keys(EXAMS)[0];}save();render();});
$("exam").addEventListener("change",e=>{S.exam=e.target.value;S.q="";if(!S.exam&&S.view==="exam")S.view="abc";render();});
$("qsel").addEventListener("change",e=>{S.q=e.target.value;render();});
$("cats").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.cat=b.dataset.c;save();render();});
$("search").addEventListener("input",e=>{S.s=e.target.value.trim();render();});

/* ---------- matching ---------- */
function termText(t){return norm([t.n,t.d,t.k,t.p].join(" "));}
function exVisible(id){const it=ITEMS[id];return (!S.exam||it.e===S.exam)&&(!S.q||String(it.q)===S.q);}

/* ---------- term views ---------- */
function termCard(t){
  const q=norm(S.s);
  const exs=liveEx(t).filter(([id])=>exVisible(id));
  const tDel=isTermDel(t);
  const exHtml=exs.map(([id,note,mk])=>{
    const it=ITEMS[id]; const d=isExDel(t,id);
    return `<div class="ex${d&&!tDel?" deleted":""}"><div class="ex-head"><span class="ex-label">${esc(label(id))}</span>${tDel?"":delBtn(exKey(t,id),d,"예시 삭제")}</div>
      <p class="sj${it.c?"":" bogi"}">${markText(it.t,mk||MARK[t.n]||[])}</p>
      <p class="note"><b>판단</b>${esc(note)}</p></div>`;}).join("");
  return `<article class="term${tDel?" deleted":""}" id="${t.id}">
    <header><h3>${esc(t.n)}</h3><span class="cat">${esc(t.c)}</span>${delBtn(t.id,tDel,"용어 삭제")}</header>
    <dl><dt>뜻</dt><dd>${esc(t.d)}</dd><dt>확인할 것</dt><dd>${esc(t.k)}</dd>${t.p?`<dt>헷갈리는 짝</dt><dd>${esc(t.p)}</dd>`:""}</dl>
    ${exHtml?`<div class="exs">${exHtml}</div>`:""}</article>`;
}
function termsFiltered(){
  const q=norm(S.s);
  return TERMS.filter(t=>{
    if(S.cat&&t.c!==S.cat)return false;
    if(!visibleTerm(t))return false;
    const exs=liveEx(t).filter(([id])=>exVisible(id));
    if((S.exam||S.q)&&!exs.length)return false;
    if(q&&!termText(t).includes(q)&&!exs.some(([id,n])=>norm(ITEMS[id].t+" "+n).includes(q)))return false;
    return true;});
}

/* ---------- exam view ---------- */
function renderExam(){
  const q=norm(S.s);
  const ids=Object.keys(ITEMS).filter(id=>ITEMS[id].e===S.exam).sort((a,b)=>itemKey(a)-itemKey(b));
  // 용어별 대표 위치: 선지 우선, 없으면 <보기>
  const primary={}, occ={}, linked={}, linkedPh={};
  TERMS.forEach(t=>{
    if(!visibleTerm(t))return;
    const exs=liveEx(t).filter(e=>ITEMS[e[0]].e===S.exam);
    exs.forEach(([id,,mk])=>{(linkedPh[id]=linkedPh[id]||[]).push(...(mk||MARK[t.n]||[]));});
    const its=exs.map(e=>e[0]).sort((a,b)=>itemKey(a)-itemKey(b));
    if(!its.length)return;
    const sj=its.filter(id=>ITEMS[id].c>0);
    primary[t.id]=sj.length?sj[0]:its[0];
    its.forEach(id=>{ (linked[id]=linked[id]||[]).push(t); if(id===primary[t.id]||ITEMS[id].c>0)(occ[id]=occ[id]||[]).push(t); });
  });
  let html="", nItems=0, shownTerms=new Set();
  let curQ=null, buf="";
  const flush=()=>{ if(buf){ html+=`<section class="q"><h2>${curQ}번<small>${esc(workOf(S.exam,curQ))}</small></h2>${buf}</section>`; } buf=""; };
  ids.forEach(id=>{
    const it=ITEMS[id];
    if(S.q&&String(it.q)!==S.q)return;
    let ts=(occ[id]||[]).filter(t=>!S.cat||t.c===S.cat);
    if(q){ const itemHit=norm(it.t).includes(q); ts=ts.filter(t=>itemHit||termText(t).includes(q)); }
    if(!ts.length)return;
    if(it.q!==curQ){flush();curQ=it.q;}
    nItems++;
    const full=ts.filter(t=>primary[t.id]===id), refs=ts.filter(t=>primary[t.id]!==id);
    full.forEach(t=>shownTerms.add(t.id));
    const head = it.c ? `<p class="item-text"><span class="no">${NO[it.c]}</span>${markText(it.t,linkedPh[id]||[])}</p>`
                      : `<p class="item-text bogi"><span class="bogi-tag">&lt;보기&gt;</span>${markText(it.t,linkedPh[id]||[])}</p>`;
    buf+=`<div class="item">${head}
      ${full.map(t=>{const td=isTermDel(t), d=td||isExDel(t,id);
        return `<div class="eterm${d?" deleted":""}" id="e-${t.id}"><h4>${esc(t.n)}<span class="cat">${esc(t.c)}</span>${td?delBtn(t.id,true,""):delBtn(exKey(t,id),d,"이 선지에서 빼기")}</h4>
        <dl><dt>뜻</dt><dd>${esc(t.d)}</dd><dt>확인할 것</dt><dd>${esc(t.k)}</dd></dl></div>`;}).join("")}
      ${refs.length?`<div class="refs">${refs.map(t=>`<button type="button" class="ref" data-go="e-${t.id}">${esc(t.n)} → ${esc(label(primary[t.id]).replace(S.exam+" ",""))}에서 설명</button>`).join("")}</div>`:""}
    </div>`;
  });
  flush();
  $("count").textContent=`선지 ${nItems}개 · 용어 ${shownTerms.size}개`;
  return html;
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll("#views button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S.view));
  document.querySelectorAll("#cats button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===S.cat));
  $("exam").value=S.exam; fillQ();
  const sd=$("showdel"); sd.hidden=!EDITOR||(!DEL.size&&!SHOWDEL);
  sd.setAttribute("aria-pressed",SHOWDEL); sd.textContent=`지운 항목 보기 (${DEL.size})`;
  let html="";
  if(S.view==="exam"){ html=renderExam(); }
  else{
    const ts=termsFiltered();
    if(S.view==="abc"){ html=ts.slice().sort((a,b)=>a.n.localeCompare(b.n,"ko")).map(termCard).join(""); }
    else{ html=CATS.map(c=>{const g=ts.filter(t=>t.c===c);return g.length?`<h2 class="cathead">${c}</h2>`+g.map(termCard).join(""):"";}).join(""); }
    $("count").textContent=`용어 ${ts.length}개`;
  }
  $("out").innerHTML=html||`<p class="empty">조건에 맞는 항목이 없습니다. 검색어나 필터를 바꿔 보세요.</p>`;
}
$("showdel").addEventListener("click",()=>{SHOWDEL=!SHOWDEL;render();});
function say(m){$("msg").textContent=m;}
async function toggleDel(key,on){
  if(!DB)return;
  const ref=DB.collection("deleted").doc(key);
  const prev=DEL.has(key);
  on?DEL.add(key):DEL.delete(key); render();
  try{
    if(on) await ref.set({kind:key.startsWith("t-")?"term":"example",at:new Date().toISOString()});
    else await ref.delete();
    say(on?"삭제했습니다. ‘지운 항목 보기’에서 되살릴 수 있습니다.":"되살렸습니다.");
  }catch(err){
    prev?DEL.add(key):DEL.delete(key); render();
    say(err&&err.code==="invalid_argument"?"이 계정에는 삭제 권한이 없습니다.":"저장하지 못했습니다. 잠시 뒤 다시 눌러 주세요.");
  }
}
$("out").addEventListener("click",e=>{
  const d=e.target.closest(".del"); if(d){toggleDel(d.dataset.key,d.dataset.on==="1");return;}
  const b=e.target.closest(".ref"); if(!b)return;
  const el=document.getElementById(b.dataset.go); if(!el)return;
  el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
});
$("sub").textContent=`수능·모평·학평 ${Object.keys(EXAMS).length}회 문학 · 용어 ${TERMS.length}개 · 선지와 <보기> ${Object.keys(ITEMS).length}개`;
render();
(async function initDb(){
  if(DIST||!(window.claude&&window.claude.use))return;
  try{
    const [user,db]=await Promise.all([claude.use("user"),claude.use("db")]);
    if(!db)return;
    DB=db; EDITOR=user?await user.canEdit():false;
    db.collection("deleted").onSnapshot(snap=>{
      DEL.clear(); snap.docs.forEach(d=>{if(d.exists)DEL.add(d.id);}); render();
    },()=>{EDITOR=false;render();});
    render();
  }catch(e){}
})();
</script>

</html>
